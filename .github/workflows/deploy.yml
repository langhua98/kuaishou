name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Rewrite JS src to jsDelivr CDN (accessible in China)
        run: |
          JS_FILE=$(ls dist/assets/index-*.js | head -1 | xargs basename)
          echo "JS file: $JS_FILE"
          CDN="https://cdn.jsdelivr.net/gh/langhua98/kuaishou@gh-pages/assets/$JS_FILE"
          sed -i "s|src=\"/kuaishou/assets/$JS_FILE\"|src=\"$CDN\"|" dist/index.html
          echo "Script src rewritten to: $CDN"
          grep -o 'src="[^"]*"' dist/index.html | grep cdn

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
