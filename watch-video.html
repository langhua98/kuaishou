<script>
var V=document.getElementById('v'), OUT=document.getElementById('out'),
    SUM=document.getElementById('sum'), GO=document.getElementById('go');
var LINES=[];

document.getElementById('hd').textContent =
  'W'+innerWidth+' H'+innerHeight+' DPR'+(devicePixelRatio||1)+' | '+navigator.userAgent;

function row(c,t){var d=document.createElement('div');d.className='r '+c;d.innerHTML=t;OUT.appendChild(d);}

// canPlayType 原样回显：'' 是「不确定」，不是「不支持」
function probe(){
  var t=document.createElement('video'), q=t.canPlayType.bind(t);
  var m={
    h264:q('video/mp4; codecs="avc1.42E01E"'),
    hevc:q('video/mp4; codecs="hvc1.1.6.L93.B0"'),
    hls :q('application/vnd.apple.mpegurl'),
    vp9 :q('video/webm; codecs="vp9"'),
    mp4 :q('video/mp4')
  };
  row('','<b>canPlayType 原始返回</b>');
  for(var k in m){
    var v=m[k], cls = v==='probably'?'ok' : v==='maybe'?'mid' : 'dim';
    row(cls,' '+k+' = '+(v===''?'"" (不确定)':'"'+v+'"'));
  }
  row('dim','空字符串只代表引擎不表态，仍可能播得动');
  return m;
}

function grab(){
  var c=document.createElement('canvas');c.width=32;c.height=38;
  var g=c.getContext('2d');
  try{g.drawImage(V,0,0,32,38);}catch(e){return null;}
  try{return g.getImageData(0,0,32,38).data;}catch(e){return 'tainted';}
}
function lum(d){var s=0;for(var i=0;i<d.length;i+=4)s+=d[i]+d[i+1]+d[i+2];return s;}
function diff(a,b){var n=0;for(var i=0;i<a.length;i+=4)if(Math.abs(a[i]-b[i])>12)n++;return n;}
function errTxt(e){
  if(!e) return '无';
  var M={1:'1 中止',2:'2 网络',3:'3 解码',4:'4 源不支持'};
  return (M[e.code]||e.code)+(e.message?' ('+e.message.slice(0,40)+')':'');
}

// 跑一种投递方式，返回结果对象
function runOne(name, src, done){
  row('','<b>'+name+'</b>');
  var md=0, playOK=0, playErr='', f0=null;
  try{ V.pause(); }catch(e){}
  V.removeAttribute('src'); V.load();
  V.src = src;
  var onMeta=function(){ md=1; };
  V.addEventListener('loadedmetadata', onMeta);
  V.load();

  var pr=V.play();
  if(pr&&pr.then) pr.then(function(){playOK=1;},function(e){playErr=e.name||'err';});
  else playOK=1;

  var t0=V.currentTime;
  setTimeout(function(){ f0=grab(); },350);
  setTimeout(function(){
    var t1=V.currentTime, f1=grab(), adv=+(t1-t0).toFixed(2);
    var pix=0, note='';
    if(f0===null||f1===null)      note='drawImage 不可用';
    else if(f0==='tainted')       note='canvas 被污染';
    else{
      var d=diff(f0,f1);
      if(d>20){pix=1;note=d+' 像素在变';}
      else if(lum(f1)<2000) note='全黑';
      else note='静止(疑似首帧)';
    }
    V.removeEventListener('loadedmetadata', onMeta);
    row(md?'ok':'no',   ' 元数据 '+(md?V.videoWidth+'×'+V.videoHeight:'未加载')+' rs'+V.readyState);
    row(playOK?'ok':'no',' play() '+(playOK?'成功':'被拒 '+playErr));
    row(adv>0.3?'ok':'no',' 时间前进 '+adv+'s');
    row(pix?'ok':'mid', ' 像素 '+note);
    row(V.error?'no':'ok',' MediaError '+errTxt(V.error));
    LINES.push(name.toUpperCase()+' md'+md+' rs'+V.readyState+' play'+playOK+
               ' ct'+adv+' pix'+pix+' err'+(V.error?V.error.code:0));
    done();
  },2400);
}
