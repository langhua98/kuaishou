<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>随机视频</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: #000; color: #fff;
             font-family: -apple-system, "PingFang SC", sans-serif; }

/* 全屏视频区 */
#player {
  width: 100%; height: 100dvh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
video {
  width: 100%; height: 100%;
  object-fit: contain; background: #000;
}

/* 底部控制栏 */
.bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,.8));
  padding: 24px 16px 36px;
  display: flex; flex-direction: column; gap: 12px;
  pointer-events: none;
}
.bar > * { pointer-events: auto; }

/* 视频源选择 */
.source-row { display: flex; gap: 8px; flex-wrap: wrap; }
.src-btn {
  padding: 6px 14px; border-radius: 20px; border: 1.5px solid rgba(255,255,255,.5);
  background: rgba(0,0,0,.4); color: #fff; font-size: 13px; cursor: pointer;
  backdrop-filter: blur(6px);
}
.src-btn.active { background: #fb7299; border-color: #fb7299; font-weight: 600; }

/* 主操作按钮 */
.btn-row { display: flex; gap: 10px; }
.main-btn {
  flex: 1; padding: 14px; border-radius: 14px; border: none;
  font-size: 16px; font-weight: 600; cursor: pointer;
}
.btn-next { background: #fb7299; color: #fff; }
.btn-auto {
  flex: 0; padding: 14px 18px; border-radius: 14px; border: none;
  font-size: 13px; cursor: pointer;
  background: rgba(255,255,255,.15); color: #fff; white-space: nowrap;
}
.btn-auto.on { background: rgba(251,114,153,.3); color: #fb7299; }

/* 状态提示 */
#tip {
  font-size: 12px; color: rgba(255,255,255,.6); text-align: center; min-height: 16px;
}

/* 加载遮罩 */
#loading {
  position: fixed; inset: 0; background: #000;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; color: rgba(255,255,255,.6);
  transition: opacity .3s;
}
#loading.hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div id="player">
  <video id="vid" playsinline controls></video>
</div>

<div class="bar">
  <div class="source-row" id="sourceRow"></div>
  <div id="tip">点「换一个」加载视频</div>
  <div class="btn-row">
    <button class="main-btn btn-next" onclick="next()">换一个 🔀</button>
    <button class="btn-auto" id="autoBtn" onclick="toggleAuto()">自动 ▶</button>
  </div>
</div>

<div id="loading">加载中…</div>

<script>
const SOURCES = [
  { label: "线路1·快手",  url: "https://www.zhiyunge.cn/ks/ks.php" },
  { label: "线路2",        url: "https://api.yujn.cn/api/zzxjj.php" },
  { label: "线路3",        url: "https://v.nrzj.vip/video.php" },
  { label: "小哥哥",       url: "https://api.317ak.com/API/sp/sgxl.php" },
];

let cur = 0;      // 当前视频源索引
let autoPlay = false;
const vid = document.getElementById("vid");
const tip = document.getElementById("tip");
const autoBtn = document.getElementById("autoBtn");

// 渲染源按钮
const row = document.getElementById("sourceRow");
SOURCES.forEach((s, i) => {
  const b = document.createElement("button");
  b.className = "src-btn" + (i === 0 ? " active" : "");
  b.textContent = s.label;
  b.onclick = () => { cur = i; row.querySelectorAll(".src-btn").forEach((x,j)=> x.classList.toggle("active", j===i)); next(); };
  row.appendChild(b);
});

function next() {
  tip.textContent = "加载中…";
  const url = SOURCES[cur].url + "?_t=" + Math.random();
  vid.src = url;
  vid.load();
  vid.play().catch(() => {});   // 部分浏览器需用户手势，catch 静默处理
}

vid.addEventListener("loadeddata", () => {
  document.getElementById("loading").classList.add("hide");
  tip.textContent = SOURCES[cur].label + " · 点击换一个，或上划换下一个";
});
vid.addEventListener("error", () => {
  tip.textContent = "该线路加载失败，换一个试试";
});
vid.addEventListener("ended", () => { if (autoPlay) next(); });

function toggleAuto() {
  autoPlay = !autoPlay;
  autoBtn.textContent = autoPlay ? "自动 ✓" : "自动 ▶";
  autoBtn.classList.toggle("on", autoPlay);
}

// 上划换下一个（滑动手势）
let touchY = 0;
document.addEventListener("touchstart", e => { touchY = e.touches[0].clientY; }, { passive: true });
document.addEventListener("touchend", e => {
  const dy = touchY - e.changedTouches[0].clientY;
  if (dy > 60) next();   // 上划 60px 换下一个
}, { passive: true });

// 初始提示
document.getElementById("loading").classList.add("hide");
</script>
</body>
</html>
