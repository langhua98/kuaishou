<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>B站搜索</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
       background: #f2f2f7; min-height: 100vh; color: #1c1c1e; }
.overlay { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.45);
           display: flex; align-items: flex-end; }
.sheet { background: #fff; border-radius: 20px 20px 0 0; padding: 24px 20px 40px; width: 100%; }
.sheet h2 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
.sheet p { font-size: 13px; color: #6c6c70; line-height: 1.6; margin-bottom: 14px; }
.sheet input { width: 100%; padding: 12px 14px; border: 1.5px solid #d1d1d6;
               border-radius: 12px; font-size: 14px; outline: none; margin-bottom: 10px; }
.sheet input:focus { border-color: #fb7299; }
.sheet button { width: 100%; padding: 14px; background: #fb7299; color: #fff;
                border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
header { position: sticky; top: 0; z-index: 100;
         background: rgba(255,255,255,.92); backdrop-filter: blur(12px);
         -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid #e5e5ea;
         padding: 12px 14px 10px; }
.header-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.logo { font-size: 16px; font-weight: 700; flex: 1; color: #fb7299; }
.cfg { background: none; border: none; font-size: 20px; cursor: pointer; padding: 2px; }
.search-row { display: flex; gap: 8px; }
.search-row input { flex: 1; padding: 10px 16px; border: 1.5px solid #d1d1d6;
                    border-radius: 24px; font-size: 15px; outline: none; background: #f2f2f7; }
.search-row input:focus { border-color: #fb7299; background: #fff; }
.search-row button { padding: 10px 18px; background: #fb7299; color: #fff;
                     border: none; border-radius: 24px; font-size: 15px;
                     font-weight: 600; cursor: pointer; white-space: nowrap; }
.search-row button:disabled { opacity: .45; }
.status { padding: 10px 14px; font-size: 13px; color: #8e8e93; min-height: 36px; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 10px 30px; }
.card { background: #fff; border-radius: 14px; overflow: hidden;
        box-shadow: 0 1px 4px rgba(0,0,0,.08); cursor: pointer; }
.card img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; background: #eee; }
.card .info { padding: 8px 10px 10px; }
.card .cap { font-size: 13px; line-height: 1.4; overflow: hidden;
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card .meta { font-size: 11px; color: #aeaeb2; margin-top: 4px; }
.card .open { display: inline-block; margin-top: 6px; font-size: 12px;
              color: #fb7299; text-decoration: none; }
.spinner { display: inline-block; width: 16px; height: 16px;
           border: 2px solid #e5e5ea; border-top-color: #fb7299;
           border-radius: 50%; animation: spin .7s linear infinite;
           vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
#player-modal { display: none; position: fixed; inset: 0; z-index: 300;
                background: #000; flex-direction: column; }
#player-modal.open { display: flex; }
#player-bar { display: flex; align-items: center; padding: 10px 14px;
              background: #111; flex-shrink: 0; }
#player-bar span { color: #fff; font-size: 14px; flex: 1;
                   overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#player-bar button { background: none; border: none; color: #fb7299;
                     font-size: 15px; font-weight: 600; cursor: pointer;
                     padding: 4px 10px; flex-shrink: 0; }
#player-frame { flex: 1; width: 100%; border: none; }
</style>
</head>
<body>

<div class="overlay" id="overlay" style="display:none">
  <div class="sheet">
    <h2>设置后端地址</h2>
    <p>填入 Railway / Render 部署好的服务地址，结尾不加斜杠。</p>
    <input id="urlInput" type="url" placeholder="https://your-app.railway.app"
           autocapitalize="none" spellcheck="false">
    <button onclick="saveUrl()">保存</button>
  </div>
</div>

<header>
  <div class="header-row">
    <span class="logo">📺 B站搜索</span>
    <button class="cfg" onclick="openCfg()" title="设置后端地址">⚙️</button>
  </div>
  <div class="search-row">
    <input id="kw" type="search" placeholder="搜索B站视频…" enterkeyhint="search">
    <button id="btn" onclick="doSearch()">搜索</button>
  </div>
</header>
<div class="status" id="status">无需登录，直接搜索。</div>
<div class="grid" id="grid"></div>

<div id="player-modal">
  <div id="player-bar">
    <span id="player-title"></span>
    <button onclick="closePlayer()">✕ 关闭</button>
  </div>
  <iframe id="player-frame" src="" allowfullscreen
          allow="autoplay; fullscreen"></iframe>
</div>

<script>
const KEY = "bili_backend";
const DEFAULT_URL = "https://kuaishou-production.up.railway.app";
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function getBase() {
  return (localStorage.getItem(KEY) || DEFAULT_URL).replace(/\/+$/, "");
}

function openCfg() {
  document.getElementById("urlInput").value = localStorage.getItem(KEY) || DEFAULT_URL;
  document.getElementById("overlay").style.display = "flex";
}

function saveUrl() {
  const v = document.getElementById("urlInput").value.trim().replace(/\/+$/, "");
  if (v) localStorage.setItem(KEY, v);
  document.getElementById("overlay").style.display = "none";
}

document.getElementById("overlay").addEventListener("click", function(e) {
  if (e.target === this) this.style.display = "none";
});

function openPlayer(bvid, title) {
  document.getElementById("player-title").textContent = title || "";
  document.getElementById("player-frame").src =
    "https://player.bilibili.com/player.html?bvid=" + bvid + "&autoplay=1&danmaku=0&high_quality=1";
  document.getElementById("player-modal").classList.add("open");
}

function closePlayer() {
  document.getElementById("player-frame").src = "";
  document.getElementById("player-modal").classList.remove("open");
}

document.getElementById("kw").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); doSearch(); }
});

async function doSearch() {
  const kw = document.getElementById("kw").value.trim();
  if (!kw) return;
  const btn = document.getElementById("btn");
  const status = document.getElementById("status");
  const grid = document.getElementById("grid");
  btn.disabled = true; grid.innerHTML = "";
  status.innerHTML = '<span class="spinner"></span>搜索中…';
  try {
    const res = await fetch(getBase() + "/api/search?keyword=" + encodeURIComponent(kw));
    const data = await res.json();
    if (!data.ok) { status.textContent = "出错：" + (data.error || JSON.stringify(data)); return; }
    status.textContent = data.count > 0 ? "找到 " + data.count + " 条结果" : "未找到结果";
    for (const v of data.results) {
      const card = document.createElement("div");
      card.className = "card";
      card.onclick = () => openPlayer(v.id, v.caption);
      const playNum = typeof v.play === "number" ? v.play.toLocaleString() + " 播放" : "";
      card.innerHTML =
        (v.cover ? '<img src="' + esc(v.cover) + '" referrerpolicy="no-referrer" loading="lazy">'
                 : '<div style="aspect-ratio:16/10;background:#eee"></div>') +
        '<div class="info">' +
          '<div class="cap">' + esc(v.caption || "(无标题)") + '</div>' +
          '<div class="meta">' + esc(v.author || "") +
            (playNum ? " · " + playNum : "") +
            (v.duration ? " · " + esc(v.duration) : "") + '</div>' +
          (v.pageUrl ? '<a class="open" href="' + esc(v.pageUrl) + '" target="_blank">去B站看 ↗</a>' : '') +
        '</div>';
      grid.appendChild(card);
    }
  } catch(e) {
    status.textContent = "出错：" + e.message;
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
