// ═══ src/combat_core.js ═══
// ─── combat_core.js ───────────────────────────────────────────────────────────
// 战斗单位层：模型加载、骨骼网格克隆、单位生成/动画/伤害/生死。
//
// 骨骼网格不能 mesh.clone()（骨骼引用会指向原骨架）——cloneSkinned() 为
// SkeletonUtils.clone 的精简实现：克隆节点树后按映射重绑骨架。
// 武器为静态 GLB，挂到 KayKit 骨架的 handslot.r / handslot.l 空节点上。

var combatUnits = [];        // 全部活动单位（含尸体，DEAD 超时后移除）
var _armyGltf = {};          // model 名 → gltf（含动画）
var _armyLoaded = false;
var _unitSeq = 1;

// ── 模型加载（首次开战时调用，含武器）─────────────────────────────────────────
function loadArmyModels(onDone, onProgress) {
  var models = {};
  var seen = {}, mounts = {};
  var names = [], k, t;
  for (k in UNIT_TYPES) {
    t = UNIT_TYPES[k];
    if (!seen[t.model]) { seen[t.model] = 1; names.push(t.model); }
    if (t.mount && !seen[t.mount]) { seen[t.mount] = 1; names.push(t.mount); mounts[t.mount] = 1; }
    if (t.wpnR && !seen[t.wpnR]) { seen[t.wpnR] = 1; names.push(t.wpnR); }
    if (t.wpnL && !seen[t.wpnL]) { seen[t.wpnL] = 1; names.push(t.wpnL); }
  }
  if (!seen['arrow']) names.push('arrow');
  var done = 0, total = names.length;
  names.forEach(function (n) {
    // 坐骑从 assets/models/ 加载，其余兵装从 assets/models/army/
    var path = mounts[n] ? 'assets/models/' + n + '.glb' : 'assets/models/army/' + n + '.glb';
    gltfLoader.load(path, function (g) {
      _armyGltf[n] = g;
      if (++done === total) { _armyLoaded = true; onDone(); }
      else if (onProgress) onProgress(done, total);
    }, undefined, function () {
      if (++done === total) { _armyLoaded = true; onDone(); }
    });
  });
}

// ── SkeletonUtils.clone 精简版 ────────────────────────────────────────────────
function _parallelTraverse(a, b, cb) {
  cb(a, b);
  for (var i = 0; i < a.children.length; i++) _parallelTraverse(a.children[i], b.children[i], cb);
}
function cloneSkinned(source) {
  var srcOf = new Map(), cloneOf = new Map();
  var clone = source.clone(true);
  _parallelTraverse(source, clone, function (s, c) { srcOf.set(c, s); cloneOf.set(s, c); });
  clone.traverse(function (node) {
    if (!node.isSkinnedMesh) return;
    var sm = srcOf.get(node);
    node.skeleton = sm.skeleton.clone();
    node.bindMatrix.copy(sm.bindMatrix);
    node.skeleton.bones = sm.skeleton.bones.map(function (b) { return cloneOf.get(b); });
    node.bind(node.skeleton, node.bindMatrix);
  });
  return clone;
}

// ── 单位生成 ──────────────────────────────────────────────────────────────────
function _attachWeapon(model, wpnName, slotName) {
  var g = _armyGltf[wpnName];
  if (!g) return;
  var slot = model.getObjectByName(slotName);
  if (!slot) return;
  slot.add(g.scene.clone(true));
}

function spawnUnit(kind, side, x, z) {
  var t = UNIT_TYPES[kind];
  var g = _armyGltf[t.model];
  if (!g) return null;

  var group = new THREE.Group();
  var model = cloneSkinned(g.scene);
  var horseMixer = null;

  if (t.cavalry) {
    // 骑兵：马在地面（2.2m 含头），骑手骑于马背（约 1.4m 处）
    _prepModel(model, 1.8);
    model.rotation.y = 0;   // KayKit 模型原生朝 +Z，_prepModel 的 π 翻转会倒着走——归零修正
    model.position.y = 1.4; // 骑手固定高度，不用 bbox 补偿
    var hg = _armyGltf[t.mount];
    if (hg) {
      var horseModel = hg.scene.clone(true);
      _prepModel(horseModel, 2.2);
      horseModel.rotation.y = 0;
      horseModel.position.y = 0; // KayKit origin 在脚底，bind-pose bbox 补偿无效
      group.add(horseModel);
      horseMixer = new THREE.AnimationMixer(horseModel);
      if (hg.animations.length > 0) {
        var hact = horseMixer.clipAction(hg.animations[0]);
        hact.setLoop(THREE.LoopRepeat, Infinity);
        hact.play();
      }
    }
  } else {
    _prepModel(model, t.h);
    model.rotation.y = 0;
    // KayKit 模型 origin 在脚底，bind-pose 包围盒补偿会因 T-pose 骨骼偏移造成悬浮，强制归零
    model.position.y = 0;
  }

  _attachWeapon(model, t.wpnR, 'handslot.r');
  if (t.wpnL) _attachWeapon(model, t.wpnL, 'handslot.l');
  group.add(model);

  var gy = _groundY(Math.floor(x), Math.floor(z));
  group.position.set(x, gy, z);
  scene.add(group);

  var mixer = new THREE.AnimationMixer(model);
  var anims = {}, i, c;
  for (i = 0; i < g.animations.length; i++) {
    c = g.animations[i];
    anims[c.name] = mixer.clipAction(c);
  }

  // 地面阴影圆饼（随 group 移动，不受 group 旋转影响）
  var shadowR = t.cavalry ? 0.85 : 0.55;
  var blobShadow = new THREE.Mesh(
    new THREE.CircleGeometry(shadowR, 10),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.30, depthWrite: false })
  );
  blobShadow.rotation.x = -Math.PI * 0.5;
  blobShadow.position.y = 0.03;
  group.add(blobShadow);

  var u = {
    id: _unitSeq++, side: side, kind: kind, t: t,
    x: x, y: gy, z: z, yaw: 0,
    vx: 0, vz: 0, speed: 0,
    hp: t.hp, atkCd: 0, actT: 0,
    state: side === 0 ? 'FOLLOW' : (t.cavalry ? 'SCAN' : 'SEEK'),
    stateT: 0, target: null, nextDecide: 0, nextScore: 0,
    deadT: 0, cheering: false, cheerT: 0,
    chargeFrom: null, breakDir: null, regroupT: 0,
    group: group, model: model, mixer: mixer, anims: anims, curAnim: '',
    horseMixer: horseMixer, hpBar: null, blobShadow: blobShadow,
    // 平民字段（战斗单位忽略这些字段）
    isCivilian: t.isCivilian || false,
    homeX: x, homeZ: z,
    wanderT: Math.random() * 3,
    wanderYaw: Math.random() * Math.PI * 2,
    wanderStop: false,
  };
  if (typeof initMorale === 'function') initMorale(u);   // 注入士气/恐惧/纪律
  playAnim(u, ANIM.idle, 0);
  makeHpBar(u);
  combatUnits.push(u);
  return u;
}

// 生成村民（side=1 友方，不参与战斗 AI）
function spawnVillager(kind, x, z) {
  return spawnUnit(kind, 1, x, z);
}

// 每帧更新村民漫游（在 game.js 主循环调用）
function updateVillagers(dt) {
  var i, u, nx, nz, dx, dz, ang;
  for (i = 0; i < combatUnits.length; i++) {
    u = combatUnits[i];
    if (!u.isCivilian || u.dead) continue;

    u.wanderT -= dt;
    if (u.wanderT <= 0) {
      u.wanderT = 2 + Math.random() * 3;
      u.wanderStop = Math.random() < 0.25;
      if (!u.wanderStop) {
        // 朝家方向加随机偏角漫游
        ang = Math.atan2(u.homeX - u.x, u.homeZ - u.z);
        u.wanderYaw = ang + (Math.random() - 0.5) * Math.PI * 1.2;
      }
    }

    if (!u.wanderStop) {
      nx = u.x - Math.sin(u.wanderYaw) * u.t.spd * dt;
      nz = u.z - Math.cos(u.wanderYaw) * u.t.spd * dt;
      dx = nx - u.homeX; dz = nz - u.homeZ;
      if (dx * dx + dz * dz < 144) {
        u.x = nx; u.z = nz;
      } else {
        u.wanderYaw = Math.atan2(u.homeX - u.x, u.homeZ - u.z);
      }
      u.group.rotation.y = u.wanderYaw;
      playAnim(u, ANIM.walk);
    } else {
      playAnim(u, ANIM.idle);
    }
    u.group.position.set(u.x, _groundY(u.x, u.z), u.z);
    // 更新动画混合器
    if (u.mixer) u.mixer.update(dt);
  }
}

// ── 动画切换（同名去重 + crossFade；once=true 播完即停留末帧）──────────────────
function playAnim(u, name, fade, once) {
  if (u.curAnim === name) return;
  var next = u.anims[name];
  if (!next) return;
  var prev = u.anims[u.curAnim];
  u.curAnim = name;
  next.reset();
  if (once) {
    next.setLoop(THREE.LoopOnce, 1);
    next.clampWhenFinished = true;
  } else {
    next.setLoop(THREE.LoopRepeat, Infinity);
  }
  if (prev && fade) {
    next.crossFadeFrom(prev, fade, false);
  }
  next.play();
}

// ── 伤害与死亡 ────────────────────────────────────────────────────────────────
function damageUnit(u, dmg, fromUnit) {
  if (u.isTower) {
    if (typeof damageTower === 'function' && u.towerRef && !u.towerRef.dead)
      damageTower(u.towerRef, dmg, fromUnit);
    return;
  }
  if (u.state === 'DEAD') return;
  u.passive = false;   // 被攻击后解除被动，开始自主反击
  // 盾牌格挡：持盾兵种 30% 概率减半伤害（自己攻击动作中举不起盾）
  var blocked = false;
  if (u.t.shield && u.actT <= 0 && Math.random() < 0.3) {
    blocked = true;
    dmg = Math.max(1, Math.ceil(dmg / 2));
  }
  u.hp -= dmg;
  battleSfx(blocked || !u.t.ranged ? 'atk_clang' : 'atk_hit');
  if (!blocked) battleSfx('enemy_hurt');
  updateHpBar(u);
  dmgFloat(u, dmg, fromUnit && fromUnit.isPlayer, blocked);
  if (u.hp <= 0) { killUnit(u); return; }
  if (blocked) {
    playAnim(u, ANIM.block, 0.06, true);
    u.actT = 0.4;
  } else if (u.actT <= 0) {
    // 受击硬直（攻击动作中不打断）
    playAnim(u, ANIM.hit, 0.08, true);
    u.actT = 0.45;
  }
  // 近战命中击退 0.5m（远程不击退；_tryShift 校验，不会推进墙/坠崖）
  if (fromUnit && !blocked) {
    var kx = u.x - fromUnit.x, kz = u.z - fromUnit.z;
    var kd = Math.sqrt(kx * kx + kz * kz);
    if (kd > 0.01 && kd < 4) _tryShift(u, (kx / kd) * 0.5, (kz / kd) * 0.5);
  }
  // 被单位打必还手；玩家免伤——被玩家打不转火（打不到玩家，追了也白追）
  if (fromUnit && !fromUnit.isPlayer && u.target !== fromUnit) u.target = fromUnit;
}

function killUnit(u) {
  if (typeof onUnitDeath === 'function') onUnitDeath(u);
  u.state = 'DEAD';
  u.deadT = 0;
  u.target = null;
  u.routing = false;
  playAnim(u, ANIM.death, 0.12, true);
  if (u.hpBar)     { u.group.remove(u.hpBar);     u.hpBar = null; }
  if (u.moraleBar) { u.group.remove(u.moraleBar); u.moraleBar = null; }
  battleSfx('enemy_death');
}

function _removeUnit(u) {
  scene.remove(u.group);
  u.model.traverse(function (n) {
    if (n.geometry && n.isSkinnedMesh) { /* 几何体共享自 gltf，不 dispose */ }
  });
  var i = combatUnits.indexOf(u);
  if (i >= 0) combatUnits.splice(i, 1);
}

// 阵营存活统计
function countAlive(side) {
  var n = 0, i;
  for (i = 0; i < combatUnits.length; i++) {
    if (combatUnits[i].side === side && combatUnits[i].state !== 'DEAD') n++;
  }
  return n;
}


// ═══ src/combat_steer.js ═══
// ─── combat_steer.js ──────────────────────────────────────────────────────────
// 转向层：朝目标移动 + 体素避障 + 单位分离（防互相堵塞，需求文档 §5/§8）。
//
// 避障：候选方向（目标向 + ±35°/±75°）逐个测试，取第一个 2.5m 内无实心方块的；
//   全堵则原方向减速蹭行。每个候选 5 次 getBlock 查表，开销可忽略。
// 上下坡：跟随地形列高度，差 ≤1 格直接走上（体素世界天然台阶）。

// ── 领地结界系统 ──────────────────────────────────────────────────────────────
// 每块领地石放置时创建 R=25m 圆形穹顶保护圈；敌方无法进入。
// 半球形穹顶：内壁半透明 + 经纬线框 + 底部圆环，整体按周期自发光呼吸。

var _territoryList = [];   // [{cx,cz,r,mesh,meshOut,ring}]
var _territoryTime = 0;

function _addTerritory(bx, by, bz) {
  var R = 25;
  var cx = bx + 0.5, cz = bz + 0.5;

  var geoInner = new THREE.SphereGeometry(R, 48, 24, 0, Math.PI * 2, 0, Math.PI * 0.5);
  var matInner = new THREE.MeshBasicMaterial({
    color: 0x9333ea, transparent: true, opacity: 0.07,
    side: THREE.BackSide, depthWrite: false
  });
  var meshInner = new THREE.Mesh(geoInner, matInner);
  meshInner.position.set(cx, by, cz);
  scene.add(meshInner);

  var geoWire = new THREE.SphereGeometry(R * 1.005, 18, 9, 0, Math.PI * 2, 0, Math.PI * 0.5);
  var matWire = new THREE.LineBasicMaterial({ color: 0xc084fc, transparent: true, opacity: 0.45 });
  var meshWire = new THREE.LineSegments(new THREE.WireframeGeometry(geoWire), matWire);
  meshWire.position.set(cx, by, cz);
  scene.add(meshWire);

  var geoRing = new THREE.TorusGeometry(R, 0.08, 6, 72);
  var matRing = new THREE.MeshBasicMaterial({ color: 0xc084fc, transparent: true, opacity: 0.6 });
  var meshRing = new THREE.Mesh(geoRing, matRing);
  meshRing.rotation.x = Math.PI * 0.5;
  meshRing.position.set(cx, by + 0.12, cz);
  scene.add(meshRing);

  _territoryList.push({ cx: cx, cz: cz, r: R,
    mesh: meshInner, meshOut: meshWire, ring: meshRing });
}

function _removeTerritory(bx, by, bz) {
  var cx = bx + 0.5, cz = bz + 0.5, i;
  for (i = _territoryList.length - 1; i >= 0; i--) {
    var t = _territoryList[i];
    if (Math.abs(t.cx - cx) < 0.5 && Math.abs(t.cz - cz) < 0.5) {
      scene.remove(t.mesh);    t.mesh.geometry.dispose();    t.mesh.material.dispose();
      scene.remove(t.meshOut); t.meshOut.geometry.dispose(); t.meshOut.material.dispose();
      if (t.ring) { scene.remove(t.ring); t.ring.geometry.dispose(); t.ring.material.dispose(); }
      _territoryList.splice(i, 1);
      return;
    }
  }
}

// 每帧动画（combat_ai.js combatUpdate 调用）
// 穹顶整体呼吸发光：慢速正弦 → 内壁/线框/底圈同步亮暗，感觉像在充放能量。
function updateTerritoryFx(dt) {
  _territoryTime += dt;
  var i, t, glow;
  for (i = 0; i < _territoryList.length; i++) {
    t = _territoryList[i];
    // 主呼吸：周期 ~3s（慢），相位随索引错开，感觉每个结界独立跳动
    glow = (Math.sin(_territoryTime * 2.1 + i * 1.9) + 1) * 0.5;   // 0→1→0
    t.mesh.material.opacity    = 0.03 + 0.12 * glow;    // 内壁：暗时几乎透明，亮时明显
    t.meshOut.material.opacity = 0.18 + 0.45 * glow;    // 线框：变化范围更大
    if (t.ring) t.ring.material.opacity = 0.35 + 0.55 * glow;  // 底圈：最亮时几乎不透明
  }
}

// 判断 (x,z) 是否在任意领地保护范围内（圆形精确判定）
function _inTerritory(x, z) {
  var i, t, dx, dz;
  for (i = 0; i < _territoryList.length; i++) {
    t = _territoryList[i];
    dx = x - t.cx; dz = z - t.cz;
    if (dx * dx + dz * dz <= t.r * t.r) return true;
  }
  return false;
}

// ── 空间哈希网格（O(n²)→O(n·邻居)，支撑大规模战场分离/碰撞）──────────────────
// 每帧重建一次：把活动单位按 2.5m 网格分桶。邻域查询只扫 3×3 桶，避免全表遍历。
var _CELL = 2.5;
var _grid = {};
var _nbrBuf = [];   // 复用缓冲，避免每次查询分配数组/闭包（GC 抖动是密集战场掉帧主因）

function _rebuildGrid() {
  _grid = {};
  var i, u, k;
  for (i = 0; i < combatUnits.length; i++) {
    u = combatUnits[i];
    if (u.state === 'DEAD') continue;
    k = Math.floor(u.x / _CELL) + ',' + Math.floor(u.z / _CELL);
    if (_grid[k]) _grid[k].push(u); else _grid[k] = [u];
  }
}

// 填充 _nbrBuf 为 (x,z) 半径内所有单位（含调用者自身，调用方自行排除），返回该缓冲
function _queryNeighbors(x, z, radius) {
  _nbrBuf.length = 0;
  var c = Math.ceil(radius / _CELL); if (c < 1) c = 1;
  var bx = Math.floor(x / _CELL), bz = Math.floor(z / _CELL), gx, gz, arr, i;
  for (gx = -c; gx <= c; gx++) for (gz = -c; gz <= c; gz++) {
    arr = _grid[(bx + gx) + ',' + (bz + gz)];
    if (!arr) continue;
    for (i = 0; i < arr.length; i++) _nbrBuf.push(arr[i]);
  }
  return _nbrBuf;
}

// ── 地形可走性（台阶感知）─────────────────────────────────────────────────────
// 从 fromY 出发，目标列 (nx,nz) 是否可站立：
//   抬升 ≤1 格可上（台阶），下落 ≤4 格可下（再深算悬崖不走），且站立格+头顶格无实心。
// 返回可站立的地面高度；不可走返回 null。
function _walkHeight(nx, nz, fromY) {
  var gx = Math.floor(nx), gz = Math.floor(nz);
  var gy = _groundY(gx, gz);
  if (gy - fromY > 1.05) return null;     // 高于 1 格：当墙挡住
  if (fromY - gy > 4) return null;        // 落差 >4 格：当悬崖不走
  var b0 = getBlock(gx, gy, gz);          // 站立格（脚部）
  var b1 = getBlock(gx, gy + 1, gz);      // 头顶格
  if ((b0 !== AIR && b0 !== WATER) || (b1 !== AIR && b1 !== WATER)) return null;
  return gy;
}

// 方向可走探测：沿 (dx,dz) 探 3 步，台阶高度逐步累进（楼梯可连续攀爬）
function _dirClear(x, y, z, dx, dz) {
  var i, gy, fromY = y;
  for (i = 1; i <= 3; i++) {
    gy = _walkHeight(x + dx * i * 0.6, z + dz * i * 0.6, fromY);
    if (gy === null) return false;
    fromY = gy;
  }
  return true;
}

// 朝 (tx,tz) 移动；返回本帧是否真的位移。
// 含：空间哈希分离力 + 台阶感知避障 + 绕行侧迟滞（贴墙绕路）+ 卡死检测与脱困。
var _STEER_OFF = [0, 0.5, 1.0, 1.6, 2.2, 2.8];   // 偏转角档位（绝对值，按 sign 取侧）

function steerMove(u, tx, tz, spd, dt) {
  var dx = tx - u.x, dz = tz - u.z;
  var d = Math.sqrt(dx * dx + dz * dz);
  if (d < 0.05) return false;
  dx /= d; dz /= d;

  // 分离力：3×3 桶邻域排斥（平方反比近似），仅扫附近单位
  var nbrs = _queryNeighbors(u.x, u.z, BTL.sepR), i, o, ox, oz, od, w;
  for (i = 0; i < nbrs.length; i++) {
    o = nbrs[i];
    if (o === u || o.state === 'DEAD') continue;
    ox = u.x - o.x; oz = u.z - o.z; od = ox * ox + oz * oz;
    if (od < BTL.sepR * BTL.sepR && od > 0.0001) {
      od = Math.sqrt(od); w = (1 - od / BTL.sepR) * 1.3;
      dx += (ox / od) * w; dz += (oz / od) * w;
    }
  }
  var dl = Math.sqrt(dx * dx + dz * dz);
  if (dl < 0.0001) { dx = (tx - u.x); dz = (tz - u.z); dl = Math.sqrt(dx*dx+dz*dz) || 1; }
  dx /= dl; dz /= dl;

  // 脱困绕行：被卡时强制走存储的垂直逃逸方向一小段
  if ((u._detourT || 0) > 0) { u._detourT -= dt; dx = u._detourDx; dz = u._detourDz; }

  // 避障：先直行，再按"上次成功绕行侧"优先逐档偏转，找第一个可走方向（贴墙绕路）
  var sign = u._turnSign || 1;
  var best = null, chosenA = 0, k, a, ca, sa, ndx, ndz, ti, tries;
  for (k = 0; k < _STEER_OFF.length; k++) {
    tries = (_STEER_OFF[k] === 0) ? [0] : [_STEER_OFF[k] * sign, -_STEER_OFF[k] * sign];
    for (ti = 0; ti < tries.length; ti++) {
      a = tries[ti]; ca = Math.cos(a); sa = Math.sin(a);
      ndx = dx * ca - dz * sa; ndz = dx * sa + dz * ca;
      if (_dirClear(u.x, u.y, u.z, ndx, ndz)) { best = [ndx, ndz]; chosenA = a; break; }
    }
    if (best) break;
  }

  var moved = false;
  if (best) {
    if (chosenA !== 0) u._turnSign = chosenA > 0 ? 1 : -1;   // 记住绕行侧，下帧延续
    var mv = Math.min(spd * dt, d);
    var nx = u.x + best[0] * mv, nz = u.z + best[1] * mv;
    // 领地结界：敌方不得进入（停在边界外）；否则按台阶高度落地，y 直接吸附地面
    if (!(u.side === 1 && _inTerritory(nx, nz))) {
      var gy = _walkHeight(nx, nz, u.y);
      if (gy !== null) { u.x = nx; u.z = nz; u.y = gy; moved = true; }
    }
    var tyaw = Math.atan2(best[0], best[1]);
    var dy = tyaw - u.yaw;
    while (dy > Math.PI)  dy -= Math.PI * 2;
    while (dy < -Math.PI) dy += Math.PI * 2;
    u.yaw += dy * Math.min(1, 10 * dt);
  }

  // 卡死检测：本帧推进 < 期望的 30% 累计停滞，>0.7s 触发一次垂直绕行脱困
  if (u._lastX === undefined) { u._lastX = u.x; u._lastZ = u.z; }
  var mdx = u.x - u._lastX, mdz = u.z - u._lastZ;
  var need = spd * dt * 0.3;
  if (mdx * mdx + mdz * mdz < need * need) u._stuckT = (u._stuckT || 0) + dt;
  else u._stuckT = 0;
  u._lastX = u.x; u._lastZ = u.z;
  if ((u._stuckT || 0) > 0.7 && (u._detourT || 0) <= 0) {
    u._stuckT = 0; u._detourT = 0.5;
    var s = (Math.random() < 0.5) ? 1 : -1;
    u._turnSign = s;
    var gx = tx - u.x, gz = tz - u.z, gl = Math.sqrt(gx * gx + gz * gz) || 1;
    gx /= gl; gz /= gl;
    u._detourDx = -gz * s; u._detourDz = gx * s;   // 垂直于目标方向，随机一侧
  }

  return moved;
}

// ── 硬碰撞解算（每帧，AI 移动之后、渲染同步之前）────────────────────────────
// 软分离力只在移动时生效；站定攻击的单位靠这里保证不重叠：
//   单位↔单位：圆形（半径 UNIT_R）两两推挤，各退一半
//   单位↔玩家：只推单位（不干扰玩家操作手感）
//   推挤不得进入实心方块/跌落悬崖（_tryShift 校验后才生效）
var UNIT_R = 0.45;

function _tryShift(u, sx, sz) {
  var nx = u.x + sx, nz = u.z + sz;
  var gy = _walkHeight(nx, nz, u.y);
  if (gy === null) return;        // 推进墙里/推下悬崖：不推
  u.x = nx; u.z = nz; u.y = gy;   // 地面直接吸附（与移动一致，杜绝悬浮/抖动）
}

// 硬碰撞解算：空间哈希 3×3 邻域逐对推挤（O(n·邻居)），单帧推力封顶抑制密集抖动
function resolveUnitCollisions() {
  _rebuildGrid();
  var n = combatUnits.length, i, a, b, nbrs, k, dx, dz, d2, d, push;
  var min = UNIT_R * 2, mm = min * min;
  for (i = 0; i < n; i++) {
    a = combatUnits[i];
    if (a.state === 'DEAD') continue;

    nbrs = _queryNeighbors(a.x, a.z, min);
    for (k = 0; k < nbrs.length; k++) {
      b = nbrs[k];
      if (b === a || b.state === 'DEAD' || b.id <= a.id) continue;   // 每对仅算一次（id 去重）
      dx = b.x - a.x; dz = b.z - a.z; d2 = dx * dx + dz * dz;
      if (d2 >= mm) continue;
      if (d2 < 0.0001) { dx = 0.02 * (a.id - b.id); dz = 0.017; d2 = dx * dx + dz * dz; }
      d = Math.sqrt(d2);
      push = (min - d) * 0.5;
      if (push > 0.25) push = 0.25;   // 单帧推力上限：防止爆冲来回弹（鬼畜）
      dx /= d; dz /= d;
      _tryShift(a, -dx * push, -dz * push);
      _tryShift(b,  dx * push,  dz * push);
    }

    // 与玩家推挤（单方向：推单位）
    dx = a.x - player.x; dz = a.z - player.z; d2 = dx * dx + dz * dz;
    var pm = UNIT_R + 0.42;
    if (d2 < pm * pm && d2 > 0.0001) {
      d = Math.sqrt(d2);
      push = pm - d; if (push > 0.3) push = 0.3;
      _tryShift(a, (dx / d) * push, (dz / d) * push);
    }
  }
}

// 面向某点（站立攻击时用）
function faceTo(u, tx, tz, dt) {
  var tyaw = Math.atan2(tx - u.x, tz - u.z);
  var dy = tyaw - u.yaw;
  while (dy > Math.PI)  dy -= Math.PI * 2;
  while (dy < -Math.PI) dy += Math.PI * 2;
  u.yaw += dy * Math.min(1, 12 * dt);
}


// ═══ src/combat_morale.js ═══
// ─── combat_morale.js ─────────────────────────────────────────────────────────
// 士气层（士气=战争的"隐藏物理引擎"）。在 物理/战斗 之后、渲染 之前更新，
// 形成闭环：被冲锋/队友阵亡/被包围 → 士气↓ → morale<阈值 进入 ROUT 溃逃 →
//           溃逃者向邻近队友传播恐惧 → 一个跑→一片跑→连锁崩溃。
//
// 每单位三维心理量（spawnUnit 时 initMorale 注入）：
//   morale 士气 0-100   fear 恐惧 0-100   discipline 纪律（兵种固定，抗崩溃）
//
// 关键：AI 不直接判断"我要逃"，只读 u.routing 标志（updateMorale 写入）。

// 状态阈值（需求文档 §6.1）
var MORALE_ROUT = 20, MORALE_PRESSURE = 40, MORALE_UNEASY = 60, MORALE_CONFIDENT = 80;

// 士气更新节流 ~10Hz（需求文档 §10.3：Morale 10-20Hz）
var _moraleAccum = 0;
var _MORALE_IV = 0.1;

function _clampM(v) { return v < 0 ? 0 : (v > 100 ? 100 : v); }

// ── 士气条可视化 ──────────────────────────────────────────────────────────────
var _MORALE_COL = {
  CONFIDENT:        '#22c55e',  // 绿：高昂
  NORMAL:           '#84cc16',  // 草绿：正常
  UNEASY:           '#f59e0b',  // 橙：不安
  RETREAT_PRESSURE: '#ef4444',  // 红：压力后退
  ROUT:             '#a855f7',  // 紫：溃逃
};

function makeMoraleBar(u) {
  if (!u.group) return;
  var cv = document.createElement('canvas');
  cv.width = 48; cv.height = 4;
  var tex = new THREE.CanvasTexture(cv);
  var spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  spr.scale.set(0.90, 0.08, 1);
  spr.position.y = u.t.h + 0.14;   // HP 条下方 0.21 世界单位
  spr.renderOrder = 10;
  u.group.add(spr);
  u.moraleBar = spr;
  u._moraleCv = cv; u._moraleTex = tex;
  _updateMoraleBar(u);
}

function _updateMoraleBar(u) {
  if (!u.moraleBar || u.morale === undefined) return;
  // 数值（取整 1%）与状态都没变则跳过重绘——避免每 tick 重传纹理（与血条同策略）
  var sig = (u.moraleState || 'NORMAL') + '|' + (u.morale | 0);
  if (u._mDraw === sig) return;
  u._mDraw = sig;
  var ctx = u._moraleCv.getContext('2d');
  var w = 48, h = 4, r = u.morale / 100;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(0,0,0,0.40)';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = _MORALE_COL[u.moraleState] || '#84cc16';
  ctx.fillRect(0, 0, w * r, h);
  u._moraleTex.needsUpdate = true;
}

// 初始化（combat_core.spawnUnit 调用）
function initMorale(u) {
  u.discipline  = (DISCIPLINE[u.kind] !== undefined) ? DISCIPLINE[u.kind] : 60;
  u.morale      = 70 + Math.random() * 20;   // 70~90
  u.fear        = 10 + Math.random() * 20;   // 10~30
  u.moraleState = 'NORMAL';
  u.routing     = false;
  makeMoraleBar(u);
}

// 士气数值 → 状态分层
function _moraleStateOf(m) {
  if (m >= MORALE_CONFIDENT) return 'CONFIDENT';
  if (m >= MORALE_UNEASY)    return 'NORMAL';
  if (m >= MORALE_PRESSURE)  return 'UNEASY';
  if (m >= MORALE_ROUT)      return 'RETREAT_PRESSURE';
  return 'ROUT';
}

// ── 事件钩子 ──────────────────────────────────────────────────────────────────

// 骑兵冲锋冲击（combat_ai CHARGE 命中时调用）：直击目标 + 命中点周围一片震慑
function onCavalryImpact(target, impact) {
  if (target.fear !== undefined) {
    target.fear   = _clampM(target.fear + impact * 0.8);
    target.morale = _clampM(target.morale - impact * 0.6);
  }
  // 冲击波及命中点 5m 内同阵营敌军（"骑兵冲一次 → 一片后退"）
  var i, o, dx, dz;
  for (i = 0; i < combatUnits.length; i++) {
    o = combatUnits[i];
    if (o === target || o.state === 'DEAD' || o.morale === undefined) continue;
    if (target.side !== undefined && o.side !== target.side) continue;
    dx = o.x - target.x; dz = o.z - target.z;
    if (dx * dx + dz * dz > 25) continue;
    o.fear   = _clampM(o.fear + impact * 0.3);
    o.morale = _clampM(o.morale - impact * 0.25);
  }
}

// 单位阵亡（combat_core.killUnit 调用）：10m 内同阵营士气↓恐惧↑，纪律高者抗性强
function onUnitDeath(dead) {
  if (dead.side === undefined) return;
  var i, o, dx, dz, d2, R2 = 100, k, resist;
  for (i = 0; i < combatUnits.length; i++) {
    o = combatUnits[i];
    if (o === dead || o.side !== dead.side || o.state === 'DEAD' || o.morale === undefined) continue;
    dx = o.x - dead.x; dz = o.z - dead.z; d2 = dx * dx + dz * dz;
    if (d2 > R2) continue;
    k = 1 - Math.sqrt(d2) / 10;                   // 越近影响越大
    resist = o.discipline / 100;
    o.morale = _clampM(o.morale - (3 + 5 * k) * (1.2 - resist * 0.5));
    o.fear   = _clampM(o.fear + (2 + 3 * k));
  }
}

// ── 溃逃移动（AI 在 u.routing 时调用，覆盖正常 FSM；不再扣计时器，FSM 已扣）──
function moraleFlee(u, dt) {
  var cx = 0, cz = 0, n = 0, i, o, dx, dz;
  for (i = 0; i < combatUnits.length; i++) {
    o = combatUnits[i];
    if (o.side === u.side || o.state === 'DEAD') continue;
    dx = o.x - u.x; dz = o.z - u.z;
    if (dx * dx + dz * dz < 900) { cx += dx; cz += dz; n++; }   // 30m 内敌军重心
  }
  var tx, tz;
  if (n > 0) { tx = u.x - (cx / n) * 8; tz = u.z - (cz / n) * 8; }
  else       { tx = u.x; tz = u.z + 8; }
  steerMove(u, tx, tz, u.t.spd * 1.05, dt);        // 逃跑略快于常速
  if (u.actT <= 0) playAnim(u, ANIM.run, 0.2);
}

// ── 每帧更新（combat_ai.combatUpdate 调用，节流 10Hz）────────────────────────
function updateMorale(dt) {
  _moraleAccum += dt;
  if (_moraleAccum < _MORALE_IV) return;
  var step = _moraleAccum;       // 实际经过时间（用于积分）
  _moraleAccum = 0;

  var i, u, j, o, dx, dz, d2, allies, enemies, dM, ns;

  // 和平期快路径：任一阵营全灭即无战斗，跳过 O(n²) 邻居统计。
  // 仅做恢复/衰减——招兵后大量友军站桩时不再每 tick 付出二次方代价。
  if (countAlive(0) === 0 || countAlive(1) === 0) {
    for (i = 0; i < combatUnits.length; i++) {
      u = combatUnits[i];
      if (u.morale === undefined || u.state === 'DEAD') continue;
      u.morale = _clampM(u.morale + 8 * step);    // 脱战快速回士气
      u.fear   = _clampM(u.fear - 8 * step);      // 恐惧消退
      if (u.routing && u.morale > MORALE_ROUT + 12) u.routing = false;
      u.moraleState = _moraleStateOf(u.morale);
      _updateMoraleBar(u);   // 仅在数值/状态变化时真正重绘
    }
    return;
  }

  // 第一轮：环境因素 + 恐惧衰减 + 状态分层
  for (i = 0; i < combatUnits.length; i++) {
    u = combatUnits[i];
    if (u.morale === undefined || u.state === 'DEAD') continue;

    allies  = _countNear(u, 8, u.side);
    enemies = _countNear(u, 8, 1 - u.side);

    dM = 0;
    dM += allies * 0.6 * step;             // 身边友军壮胆（§4.1）
    dM -= enemies * 0.8 * step;            // 被包围怯场（§4.2）
    if (enemies === 0) dM += 5 * step;     // 脱战恢复
    if (u.hp / u.t.hp < 0.35) dM -= 3 * step;   // 残血压力

    u.morale = _clampM(u.morale + dM);
    u.fear   = _clampM(u.fear - 5 * step);      // 恐惧自然衰减
    if (u.fear > 50) u.morale = _clampM(u.morale - (u.fear - 50) * 0.1 * step);

    ns = _moraleStateOf(u.morale);
    if (ns === 'ROUT' && !u.routing) {
      u.routing = true;
      u.target = null;
      if (typeof spawnBurst === 'function')   // 溃逃瞬间：白色恐惧气泡
        spawnBurst(u.x, u.y + u.t.h * 0.6, u.z,
          { count: 10, color: 0xe5e5e5, speed: 2, size: 0.12, life: 0.7, up: 0.9 });
    } else if (u.routing && u.morale > MORALE_ROUT + 12) {
      u.routing = false;       // 回血迟滞（+12 缓冲），避免在阈值处抖动
    }
    u.moraleState = ns;
    _updateMoraleBar(u);   // 每 10Hz tick 刷新进度 + 颜色
  }

  // 第二轮：溃逃者向 10m 内同阵营传播恐惧（连锁崩溃，§8.2）
  // 单独成轮，避免本轮新崩的单位在同一遍里二次级联放大
  for (i = 0; i < combatUnits.length; i++) {
    u = combatUnits[i];
    if (u.morale === undefined || u.state === 'DEAD' || u.moraleState !== 'ROUT') continue;
    for (j = 0; j < combatUnits.length; j++) {
      o = combatUnits[j];
      if (o === u || o.side !== u.side || o.state === 'DEAD' || o.morale === undefined) continue;
      dx = o.x - u.x; dz = o.z - u.z; d2 = dx * dx + dz * dz;
      if (d2 > 100) continue;
      o.morale = _clampM(o.morale - 10 * step);
      o.fear   = _clampM(o.fear + u.fear * 0.15 * step);
    }
  }
}


// ═══ src/combat_fx.js ═══
// ─── combat_fx.js ─────────────────────────────────────────────────────────────
// 表现层：箭矢抛物线、血条 sprite、伤害飘字、战斗音效。
// 玩家完全免伤（指挥官模式）：敌方不索敌玩家、箭矢穿过玩家、无玩家 HP。

// ── 战斗音效（复用 audio.js 的 _playSfx 管线，组名在 audio.js _SFX 注册）──────
function battleSfx(group) {
  if (typeof _playSfx === 'function') _playSfx(group, 0.55, 0.9, 1.1);
}

// ── 血条（canvas sprite，仅血量变化时重绘）────────────────────────────────────
function makeHpBar(u) {
  var cv = document.createElement('canvas');
  cv.width = 64; cv.height = 8;
  var tex = new THREE.CanvasTexture(cv);
  var spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  spr.scale.set(1.1, 0.14, 1);
  spr.position.y = u.t.h + 0.35;
  spr.renderOrder = 10;
  u.group.add(spr);
  u.hpBar = spr;
  u._hpCv = cv; u._hpTex = tex;
  updateHpBar(u);
}

function updateHpBar(u) {
  if (!u.hpBar) return;
  var ctx = u._hpCv.getContext('2d');
  var w = 64, h = 8, r = Math.max(0, u.hp / u.t.hp);
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = u.side === 0 ? '#4ade80' : '#ef4444';
  ctx.fillRect(1, 1, (w - 2) * r, h - 2);
  u._hpTex.needsUpdate = true;
}

// ── 箭矢（对象池 + 重力抛物线，按飞行时间预瞄）─────────────────────────────────
var _arrows = [];
function shootArrow(u, tgt) {
  battleSfx('atk_bow');
  var g = _armyGltf['arrow'];
  var mesh;
  if (g) {
    mesh = g.scene.clone(true);
    mesh.scale.setScalar(1.4);
  } else {
    // 箭杆（细圆柱，Y 轴为长轴，旋转后对齐飞行方向）
    var arrowGrp = new THREE.Group();
    var shaft = new THREE.Mesh(
      new THREE.CylinderGeometry(0.025, 0.025, 0.65, 4),
      new THREE.MeshBasicMaterial({ color: 0x8a6a3a })
    );
    // 箭头（小圆锥，Y+ 向上即为箭头方向）
    var head = new THREE.Mesh(
      new THREE.ConeGeometry(0.055, 0.15, 4),
      new THREE.MeshBasicMaterial({ color: 0x4a4a2a })
    );
    head.position.y = 0.4;
    arrowGrp.add(shaft);
    arrowGrp.add(head);
    mesh = arrowGrp;
  }
  var sx = u.x, sy = u.y + u.t.h * 0.75, sz = u.z;
  var dx = tgt.x - sx, dz = tgt.z - sz;
  var dist = Math.sqrt(dx * dx + dz * dz);
  var ft = dist / BTL.arrowSpd;                      // 飞行时间
  var ty = (tgt.isPlayer ? tgt.y + 1.2 : tgt.y + tgt.t.h * 0.6);
  var G = 14;
  var vx = dx / ft, vz = dz / ft;
  var vy = (ty - sy) / ft + 0.5 * G * ft;            // 抛物线补偿
  scene.add(mesh);
  _arrows.push({
    mesh: mesh, x: sx, y: sy, z: sz, vx: vx, vy: vy, vz: vz,
    t: 0, life: ft + 0.4, dmg: u.t.dmg, side: u.side, from: u,
  });
}

function updateArrows(dt) {
  var G = 14, i, a, j, o, dx, dy, dz;
  for (i = _arrows.length - 1; i >= 0; i--) {
    a = _arrows[i];
    a.t += dt;
    a.vy -= G * dt;
    a.x += a.vx * dt; a.y += a.vy * dt; a.z += a.vz * dt;
    a.mesh.position.set(a.x, a.y, a.z);
    // 箭杆默认 Y 轴为长轴，旋转使 Y+ 朝向飞行方向 (vx,vy,vz)
    var _sxz = Math.sqrt(a.vx * a.vx + a.vz * a.vz);
    a.mesh.rotation.order = 'YXZ';
    a.mesh.rotation.y = Math.atan2(a.vx, a.vz);
    a.mesh.rotation.x = Math.PI / 2 - Math.atan2(a.vy, _sxz);

    var hit = false;
    // 命中敌对单位（半径 0.7）。玩家免伤：箭矢直接穿过玩家
    for (j = 0; j < combatUnits.length; j++) {
      o = combatUnits[j];
      if (o.side === a.side || o.state === 'DEAD') continue;
      dx = o.x - a.x; dy = (o.y + o.t.h * 0.5) - a.y; dz = o.z - a.z;
      if (dx * dx + dy * dy + dz * dz < 0.5) { damageUnit(o, a.dmg, a.from); hit = true; break; }
    }
    // 入地/超时
    if (hit || a.t > a.life || getBlock(Math.floor(a.x), Math.floor(a.y), Math.floor(a.z)) !== AIR) {
      scene.remove(a.mesh);
      _arrows.splice(i, 1);
    }
  }
}

// ── 伤害飘字（canvas sprite，命中点上方升起渐隐）──────────────────────────────
var _floats = [];
function dmgFloat(u, dmg, byPlayer, blocked) {
  var cv = document.createElement('canvas');
  cv.width = 96; cv.height = 40;
  var ctx = cv.getContext('2d');
  ctx.font = 'bold 28px monospace';
  ctx.textAlign = 'center';
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(0,0,0,.85)';
  ctx.fillStyle = blocked ? '#c4b5fd' : '#ef4444';   // 格挡淡紫，普通伤害红色（LoL 风格）
  var txt = (blocked ? '⊡' : '') + dmg;
  ctx.strokeText(txt, 48, 30);
  ctx.fillText(txt, 48, 30);
  var spr = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(cv), depthTest: false, transparent: true,
  }));
  spr.scale.set(1.2, 0.5, 1);
  spr.position.set(u.x, u.y + u.t.h + 0.6, u.z);
  spr.renderOrder = 11;
  scene.add(spr);
  _floats.push({ spr: spr, t: 0 });
}

function updateFloats(dt) {
  var i, f;
  for (i = _floats.length - 1; i >= 0; i--) {
    f = _floats[i];
    f.t += dt;
    f.spr.position.y += dt * 1.2;
    f.spr.material.opacity = 1 - f.t / 0.8;
    if (f.t > 0.8) {
      scene.remove(f.spr);
      f.spr.material.map.dispose();
      f.spr.material.dispose();
      _floats.splice(i, 1);
    }
  }
}

// ── 玩家挥剑攻击：范围内最近敌人（game.js 破坏键调用，命中则不挖方块）──────
// 不做朝向限制——只要在 playerReach 半径内即可命中，手机操作不精准需要宽容度。
// side !== 1 保证绝对不会打中友军。
function tryPlayerAttack() {
  if (!combatUnits.length) return false;
  var best = null, bd = BTL.playerReach, i, u, dx, dz, d;
  for (i = 0; i < combatUnits.length; i++) {
    u = combatUnits[i];
    if (u.side !== 1 || u.state === 'DEAD') continue;   // 只打敌方，绝不打友军
    dx = u.x - player.x; dz = u.z - player.z;
    d = Math.sqrt(dx * dx + dz * dz);
    if (d < bd) { bd = d; best = u; }
  }
  if (!best) return false;
  damageUnit(best, BTL.playerDmg, _playerProxy());
  battleSfx('atk_swing');
  return true;
}

// 玩家伪单位（敌方 AI 与还手逻辑统一接口用）
var _playerProxyObj = { isPlayer: true, x: 0, y: 0, z: 0 };
function _playerProxy() {
  _playerProxyObj.x = player.x; _playerProxyObj.y = player.y; _playerProxyObj.z = player.z;
  return _playerProxyObj;
}

// ── 提示浮层 ──────────────────────────────────────────────────────────────────

  _toastEl.style.opacity = '1';

  _toastTimer = setTimeout(function () { _toastEl.style.opacity = '0'; }, 2200);
}


// ═══ src/combat_ai.js ═══
// ─── combat_ai.js ─────────────────────────────────────────────────────────────
// 决策层：步兵/弓手 FSM + 总入口 combatUpdate(dt, now)。
// 状态：IDLE / FOLLOW / SEEK / FIGHT / HOLD / DEAD（P1，骑兵九状态见 P2）。
// 决策节流 0.2s（需求文档 §2）；移动/动画/攻击判定每帧。
//
// 我方命令（combat_cmd.js 写入 playerOrder）：
//   follow → FOLLOW 跟随玩家   charge → SEEK 自由索敌
//   hold   → HOLD 原地驻守     retreat → FOLLOW 且脱战（不再选目标）

var playerOrder = 'follow';

// 敌我目标选择。玩家完全免伤——敌方永不索敌玩家。
// 敌方（side=1）优先攻击防御塔（_towers 由 combat_tower.js 提供）。
function _pickTarget(u, anyRange) {
  var i, o, dx, dz, d;
  var detectR2 = anyRange ? Infinity : BTL.detectR * BTL.detectR;

  // 敌方：优先选最近的防御塔
  if (u.side === 1 && typeof _towers !== 'undefined' && _towers.length > 0) {
    var bestTw = null, btd = detectR2 * 1.5;   // 塔感知范围稍大
    for (i = 0; i < _towers.length; i++) {
      var tw = _towers[i];
      if (tw.dead) continue;
      dx = tw.x - u.x; dz = tw.z - u.z; d = dx*dx + dz*dz;
      if (d < btd) { btd = d; bestTw = tw; }
    }
    if (bestTw) {
      return { isTower:true, towerRef:bestTw, side:0,
        x:bestTw.x, y:bestTw.y, z:bestTw.z,
        t:{ h:4, hp:bestTw.maxHp, range:2.2, ranged:false },
        state:'HOLD', hp:bestTw.hp, kind:'tower' };
    }
  }

  var best = null, bd = detectR2;
  for (i = 0; i < combatUnits.length; i++) {
    o = combatUnits[i];
    if (o.side === u.side || o.state === 'DEAD') continue;
    dx = o.x - u.x; dz = o.z - u.z; d = dx * dx + dz * dz;
    if (d < bd) { bd = d; best = o; }
  }
  return best;
}

// 集火：全军攻当前血量百分比最低的敌方单位
function _getFocusTarget() {
  var best = null, bestRatio = Infinity, i, o, r;
  for (i = 0; i < combatUnits.length; i++) {
    o = combatUnits[i];
    if (o.side === 0 || o.state === 'DEAD') continue;
    r = o.hp / o.t.hp;
    if (r < bestRatio) { bestRatio = r; best = o; }
  }
  return best;
}

// 包围：分配给每个盟友一个围绕敌方重心的角度位置
function _getSurroundPos(u) {
  var ex = 0, ez = 0, en = 0, i, o;
  for (i = 0; i < combatUnits.length; i++) {
    o = combatUnits[i];
    if (o.side === 0 || o.state === 'DEAD') continue;
    ex += o.x; ez += o.z; en++;
  }
  if (en === 0) return null;
  ex /= en; ez /= en;
  var allies = [], rank = 0, total;
  for (i = 0; i < combatUnits.length; i++) {
    o = combatUnits[i];
    if (o.side === 0 && o.state !== 'DEAD') allies.push(o.id);
  }
  allies.sort(function (a, b) { return a - b; });
  rank = allies.indexOf(u.id);
  total = Math.max(1, allies.length);
  var angle = (rank / total) * Math.PI * 2;
  var radius = 4 + total * 0.25;
  return { x: ex + Math.sin(angle) * radius, z: ez + Math.cos(angle) * radius,
           tx: ex, tz: ez };
}

// 命中朝向判定：攻击者必须面向目标 ±70°，被碰撞推得转了身就挥空
function _facingTo(u, t) {
  var dy = Math.atan2(t.x - u.x, t.z - u.z) - u.yaw;
  while (dy > Math.PI)  dy -= Math.PI * 2;
  while (dy < -Math.PI) dy += Math.PI * 2;
  return Math.abs(dy) < 1.22;
}

function _distTo(u, t) {
  var dx = t.x - u.x, dz = t.z - u.z;
  return Math.sqrt(dx * dx + dz * dz);
}

// 方队跟随：所有待命盟友按矩形方阵站位（玩家身后），各有专属格子不扎堆。
// rangedFront 命令时，远程单位排在前排（较小 row），近战排后排。
function _followFormation(u, dt) {
  var allies = [], i, o;
  for (i = 0; i < combatUnits.length; i++) {
    o = combatUnits[i];
    if (o.side === 0 && o.state !== 'DEAD') allies.push(o);
  }
  // 弓手前移：远程单位先排（前排），近战后排
  if (playerOrder === 'rangedFront') {
    allies.sort(function (a, b) {
      var ar = a.t.ranged ? 0 : 1, br = b.t.ranged ? 0 : 1;
      return ar !== br ? ar - br : a.id - b.id;
    });
  } else {
    allies.sort(function (a, b) { return a.id - b.id; });
  }
  var ids = [];
  for (i = 0; i < allies.length; i++) ids.push(allies[i].id);
  var rank = ids.indexOf(u.id), total = allies.length;

  var cols = Math.max(1, Math.ceil(Math.sqrt(total)));
  var col  = rank % cols;
  var row  = Math.floor(rank / cols);
  var sep  = u.t.cavalry ? 2.8 : 2.2;   // 骑兵间距更大
  var localX = (col - (cols - 1) * 0.5) * sep;
  var localZ = (row + 1) * sep + 2.5;   // 跟在玩家身后

  // 旋转到玩家朝向的"身后"方向
  var sinY = Math.sin(player.yaw), cosY = Math.cos(player.yaw);
  // 玩家前向 F = (sinY, cosY)，右向 R = (cosY, -sinY)
  // 身后偏移 = -localZ * F + localX * R
  var wx = player.x - localZ * sinY + localX * cosY;
  var wz = player.z - localZ * cosY - localX * sinY;

  var dx = wx - u.x, dz = wz - u.z, d = Math.sqrt(dx * dx + dz * dz);
  if (d > 0.9) {
    steerMove(u, wx, wz, d > 6 ? u.t.spd : u.t.spd * 0.5, dt);
    if (u.actT <= 0) playAnim(u, d > 6 ? ANIM.run : ANIM.walk, 0.2);
  } else {
    faceTo(u, player.x + sinY * 5, player.z + cosY * 5, dt);  // 面朝玩家前方
    if (u.actT <= 0) playAnim(u, u.cheering ? ANIM.cheer : ANIM.idle, 0.2);
  }
}

// ── 骑兵辅助函数 ──────────────────────────────────────────────────────────────

// 统计半径内指定阵营单位数（side 为 undefined 时统计所有）
function _countNear(u, radius, side) {
  var n = 0, i, o, dx, dz, r2 = radius * radius;
  for (i = 0; i < combatUnits.length; i++) {
    o = combatUnits[i];
    if (o === u || o.state === 'DEAD') continue;
    if (side !== undefined && o.side !== side) continue;
    dx = o.x - u.x; dz = o.z - u.z;
    if (dx * dx + dz * dz < r2) n++;
  }
  return n;
}

// 骑兵目标评分（需求文档 §4.3）
function _scoreTarget(u, enemy) {
  var score = SCORE_ENEMY[enemy.kind] || 40;
  var dx = enemy.x - u.x, dz = enemy.z - u.z;
  var dist = Math.sqrt(dx * dx + dz * dz);
  if (dist < 20) score += 20;
  else if (dist < 50) score += 10;
  else score -= 20;
  // 侧背加成：我方位于敌方背后/侧翼得分更高
  var toUs = Math.atan2(u.x - enemy.x, u.z - enemy.z);
  var rel = toUs - enemy.yaw;
  while (rel > Math.PI)  rel -= Math.PI * 2;
  while (rel < -Math.PI) rel += Math.PI * 2;
  var abs = Math.abs(rel);
  if (abs > Math.PI * 0.75)      score += 50;  // 背刺
  else if (abs > Math.PI * 0.3)  score += 30;  // 侧翼
  else                           score -= 30;  // 正面
  return score;
}

// 评分选最优目标（骑兵专用，替代 _pickTarget 的近距优先逻辑）
function _pickBestTarget(u, anyRange) {
  var best = null, bestScore = -Infinity;
  var detectR2 = anyRange ? Infinity : BTL.detectR * BTL.detectR;
  var i, o, dx, dz, score;
  for (i = 0; i < combatUnits.length; i++) {
    o = combatUnits[i];
    if (o.side === u.side || o.state === 'DEAD') continue;
    dx = o.x - u.x; dz = o.z - u.z;
    if (dx * dx + dz * dz > detectR2) continue;
    score = _scoreTarget(u, o);
    if (score > bestScore) { bestScore = score; best = o; }
  }
  return best;
}

// 计算冲锋起始位置：目标侧背方 25~40m，偏向我方当前位置
function _pickChargePos(u, tgt) {
  var angles = [Math.PI, Math.PI * 0.75, -Math.PI * 0.75, Math.PI * 0.5, -Math.PI * 0.5, 0];
  var dist = CAV.chargeGoodDist;
  var best = null, bestScore = -Infinity;
  var i, a, px, pz, score, dx, dz;
  for (i = 0; i < angles.length; i++) {
    a = tgt.yaw + angles[i];
    px = tgt.x + Math.sin(a) * dist;
    pz = tgt.z + Math.cos(a) * dist;
    score = (5 - i) * 15;   // 靠后角度优先
    dx = px - u.x; dz = pz - u.z;
    score -= Math.sqrt(dx * dx + dz * dz) * 0.4;  // 距我方越近越好
    if (score > bestScore) { bestScore = score; best = { x: px, z: pz }; }
  }
  return best;
}

// 计算撤离方向：选敌军最少的方向
function _calcBreakDir(u) {
  var best = { x: 0, z: 1 }, minEn = Infinity;
  var i, a, dirx, dirz, score, j, o, ex, ez;
  for (i = 0; i < 8; i++) {
    a = (i / 8) * Math.PI * 2;
    dirx = Math.sin(a); dirz = Math.cos(a);
    score = 0;
    for (j = 0; j < combatUnits.length; j++) {
      o = combatUnits[j];
      if (o.side === u.side || o.state === 'DEAD') continue;
      ex = o.x - u.x; ez = o.z - u.z;
      if (ex * dirx + ez * dirz > 0) score++;
    }
    if (score < minEn) { minEn = score; best = { x: dirx, z: dirz }; }
  }
  return best;
}

// ── 骑兵九状态 FSM（需求文档 §3）────────────────────────────────────────────
function _aiCavalry(u, dt, now) {
  u.stateT += dt;
  if (u.atkCd > 0) u.atkCd -= dt;
  if (u.actT > 0)  u.actT -= dt;
  if (u.cheering) {
    u.cheerT -= dt;
    if (u.cheerT <= 0) { u.cheering = false; if (u.side === 0) u.state = 'FOLLOW'; }
  }

  if (u.state === 'DEAD') {
    u.deadT += dt;
    if (u.deadT > BTL.corpseT) _removeUnit(u);
    return;
  }

  // 士气溃逃：骑兵同样会崩（纪律高，较少触发）
  if (u.routing && typeof moraleFlee === 'function') { moraleFlee(u, dt); return; }

  // 待结算伤害（同步 MELEE 帧判定）
  if (u._pendHit && u.actT <= u._pendHitAt) {
    var tg = u._pendHit; u._pendHit = null;
    // 判定帧三重检查：目标存活、仍在攻击距离内、攻击者面向目标（±70°）
    if (!tg.isPlayer && tg.state !== 'DEAD' &&
        _distTo(u, tg) < u.t.range + 0.6 && _facingTo(u, tg)) {
      damageUnit(tg, u.t.dmg, u);
    }
  }

  var t = u.t, tgt = u.target, d;

  // 0.2s 决策节流
  if (now >= u.nextDecide) {
    u.nextDecide = now + CAV.scanIv * 0.4;  // 0.2s
    if (u.target && !u.target.isPlayer && u.target.state === 'DEAD') { u.target = null; tgt = null; }

    // 触发撤退（§4.7）
    if (u.state !== 'RETREAT' && u.state !== 'DEAD') {
      var hpRatio = u.hp / t.hp;
      var nearEn = _countNear(u, 12, 1 - u.side);
      if (hpRatio <= CAV.retreatHp || (nearEn >= CAV.retreatOutnum && hpRatio < 0.5)) {
        u.state = 'RETREAT'; u.stateT = 0; u.target = null;
        return;
      }
    }

    // 我方命令（骑兵版）
    if (u.side === 0) {
      if (playerOrder === 'hold') {
        if (u.state !== 'HOLD') { u.state = 'HOLD'; u.target = null; }
      } else if (playerOrder === 'retreat') {
        u.state = 'FOLLOW'; u.target = null;
      } else if (playerOrder === 'rally') {
        u.target = null; tgt = null;
        if (u.state !== 'FOLLOW') u.state = 'FOLLOW';
      } else if (playerOrder === 'focus') {
        if (u.state === 'HOLD') { u.state = 'FOLLOW'; u.target = null; }
        var ftc = _getFocusTarget();
        if (ftc) { u.target = ftc; tgt = ftc; }
        if (u.target && (u.state === 'FOLLOW' || u.state === 'IDLE')) u.state = 'SCAN';
        else if (!u.target && (u.state === 'SCAN' || u.state === 'POSITION')) u.state = 'FOLLOW';
      } else {
        if (u.state === 'HOLD') { u.state = 'FOLLOW'; u.target = null; }
        if (!u.target) { u.target = _pickBestTarget(u, playerOrder === 'charge'); tgt = u.target; }
        if (u.target && (u.state === 'FOLLOW' || u.state === 'IDLE')) u.state = 'SCAN';
        else if (!u.target && (u.state === 'SCAN' || u.state === 'POSITION')) u.state = 'FOLLOW';
      }
    } else {
      if (!u.target) { u.target = _pickBestTarget(u); tgt = u.target; }
      if (u.target && u.state === 'IDLE') u.state = 'SCAN';
    }
  }

  // 0.5s 评分刷新
  if (now >= u.nextScore) {
    u.nextScore = now + CAV.scanIv;
    if (u.state === 'SCAN' || u.state === 'POSITION') {
      var nb = _pickBestTarget(u);
      if (nb) { u.target = nb; tgt = nb; }
    }
  }

  switch (u.state) {

    case 'FOLLOW':
      _followFormation(u, dt);
      break;

    case 'SCAN':
      if (!tgt) { u.target = _pickBestTarget(u); tgt = u.target; }
      if (!tgt) { u.state = u.side === 0 ? 'FOLLOW' : 'IDLE'; break; }
      // 目标太近凑不出冲锋助跑距离：直接近战，不绕去 40m 外起跑（观感像抗命）
      if (_distTo(u, tgt) < CAV.chargeMinDist) {
        u.state = 'MELEE'; u.stateT = 0;
      } else {
        u.chargeFrom = _pickChargePos(u, tgt);
        u.state = 'POSITION'; u.stateT = 0;
      }
      break;

    case 'POSITION':
      if (!tgt || tgt.state === 'DEAD') { u.state = 'SCAN'; u.chargeFrom = null; break; }
      if (!u.chargeFrom) u.chargeFrom = _pickChargePos(u, tgt);
      d = Math.sqrt((u.chargeFrom.x - u.x) * (u.chargeFrom.x - u.x) + (u.chargeFrom.z - u.z) * (u.chargeFrom.z - u.z));
      if (d < 4) {
        u.state = 'CHARGE'; u.stateT = 0; u.chargeFrom = null;
      } else {
        steerMove(u, u.chargeFrom.x, u.chargeFrom.z, t.spd * 0.75, dt);
        if (u.actT <= 0) playAnim(u, ANIM.run, 0.2);
      }
      break;

    case 'CHARGE':
      if (!tgt || tgt.state === 'DEAD') { u.state = 'SCAN'; u.vx = 0; u.vz = 0; break; }
      d = _distTo(u, tgt);
      // 加速冲向目标
      u.speed = Math.min(t.spd, (u.speed || 0) + t.spd * dt * 3);
      var ctx = tgt.x - u.x, ctz = tgt.z - u.z, cdd = Math.sqrt(ctx * ctx + ctz * ctz);
      if (cdd > 0.01) { u.vx = (ctx / cdd) * u.speed; u.vz = (ctz / cdd) * u.speed; }
      // 地形跟随移动；撞墙/悬崖累积停滞时间，>0.8s 判冲锋失败（需求文档 §4.4 速度跌破阈值）
      var cnx = u.x + u.vx * dt, cnz = u.z + u.vz * dt;
      var cgy = _walkHeight(cnx, cnz, u.y);
      if (cgy !== null) {
        u.x = cnx; u.z = cnz; u.y = cgy;   // 地面直接吸附（与步兵一致）
        u._stallT = 0;
      } else {
        u._stallT = (u._stallT || 0) + dt;
        if (u._stallT > 0.8) {
          u._stallT = 0; u.vx = 0; u.vz = 0; u.speed = 0;
          u.state = d < 8 ? 'MELEE' : 'SCAN'; u.stateT = 0;
          break;
        }
      }
      faceTo(u, tgt.x, tgt.z, dt);
      if (u.actT <= 0) playAnim(u, ANIM.run, 0.1);
      // 接触：冲锋伤害（速度越高伤害越大）
      if (d < t.range + 1.2) {
        var _impact = (t.chargeDmg || t.dmg * 2) * (u.speed / t.spd);
        if (tgt.state !== 'DEAD') {
          damageUnit(tgt, Math.round(_impact), u);
          // 冲锋心理冲击：直击恐惧 + 命中点一片震慑（士气层）
          if (typeof onCavalryImpact === 'function') onCavalryImpact(tgt, _impact);
        }
        battleSfx('atk_clang');
        // 冲锋撞击火花
        if (typeof spawnBurst === 'function')
          spawnBurst(tgt.x, tgt.y + (tgt.t ? tgt.t.h * 0.5 : 1), tgt.z,
            { count: 22, color: 0xffae42, speed: 6, size: 0.18, life: 0.5, up: 0.5 });
        u.state = 'MELEE'; u.stateT = 0;
        u.vx = 0; u.vz = 0; u.speed = 0;
      }
      break;

    case 'MELEE':
      if (!tgt || tgt.state === 'DEAD') { u.state = 'SCAN'; break; }
      // 持续时间/包围判定 → BREAKAWAY
      if (u.stateT > CAV.meleeMaxT || _countNear(u, 5, 1 - u.side) >= CAV.meleeCrowd) {
        u.state = 'BREAKAWAY'; u.stateT = 0;
        u.breakDir = _calcBreakDir(u); break;
      }
      d = _distTo(u, tgt);
      if (d > t.range * 1.8) {
        steerMove(u, tgt.x, tgt.z, t.spd * 0.6, dt);
        if (u.actT <= 0) playAnim(u, ANIM.run, 0.2);
      } else {
        faceTo(u, tgt.x, tgt.z, dt);
        if (u.atkCd <= 0 && u.actT <= 0) {
          playAnim(u, Math.random() < 0.5 ? ANIM.atk1 : ANIM.atk2, 0.08, true);
          u.actT = 0.9; u.atkCd = t.atkCd;
          u._pendHit = tgt; u._pendHitAt = 0.9 - BTL.meleeDmgDelay;
          battleSfx('atk_swing');
        } else if (u.actT <= 0) {
          playAnim(u, ANIM.idle, 0.2);
        }
      }
      break;

    case 'BREAKAWAY':
      if (!u.breakDir) u.breakDir = _calcBreakDir(u);
      var bx = u.x + u.breakDir.x * CAV.breakFarDist;
      var bz = u.z + u.breakDir.z * CAV.breakFarDist;
      steerMove(u, bx, bz, t.spd, dt);
      if (u.actT <= 0) playAnim(u, ANIM.run, 0.1);
      if (u.stateT * t.spd > CAV.breakDist) {
        u.state = 'REGROUP'; u.stateT = 0; u.regroupT = 0; u.breakDir = null;
      }
      break;

    case 'REGROUP':
      u.regroupT += dt;
      if (u.actT <= 0) playAnim(u, ANIM.idle, 0.25);
      if (u.regroupT > CAV.regroupMaxT || _countNear(u, 20, u.side) >= 2) {
        u.target = null; u.state = 'SCAN'; u.stateT = 0;
      }
      break;

    case 'RETREAT':
      var re = _countNear(u, BTL.detectR, 1 - u.side);
      if (re === 0) { u.state = 'REGROUP'; u.stateT = 0; u.regroupT = 0; break; }
      // 朝远离重心方向全速逃跑
      var rcx = 0, rcz = 0, ri, ro;
      for (ri = 0; ri < combatUnits.length; ri++) {
        ro = combatUnits[ri];
        if (ro.side === u.side || ro.state === 'DEAD') continue;
        rcx += ro.x - u.x; rcz += ro.z - u.z;
      }
      if (re > 0) {
        steerMove(u, u.x - rcx / re * 10, u.z - rcz / re * 10, t.spd, dt);
      }
      if (u.actT <= 0) playAnim(u, ANIM.run, 0.1);
      break;

    case 'HOLD':
      if (tgt && _distTo(u, tgt) > t.range * 1.5) { u.target = null; tgt = null; }
      if (!tgt && now >= u.nextDecide - CAV.scanIv * 0.4 * 0.5) {
        u.target = _pickBestTarget(u); tgt = u.target;
      }
      if (tgt) {
        d = _distTo(u, tgt);
        faceTo(u, tgt.x, tgt.z, dt);
        if (d <= t.range && u.atkCd <= 0 && u.actT <= 0) {
          playAnim(u, Math.random() < 0.5 ? ANIM.atk1 : ANIM.atk2, 0.08, true);
          u.actT = 0.9; u.atkCd = t.atkCd;
          u._pendHit = tgt; u._pendHitAt = 0.9 - BTL.meleeDmgDelay;
          battleSfx('atk_swing');
        } else if (u.actT <= 0) { playAnim(u, ANIM.idle, 0.2); }
      } else if (u.actT <= 0) { playAnim(u, ANIM.idle, 0.25); }
      break;

    default:   // IDLE
      if (u.actT <= 0) playAnim(u, u.cheering ? ANIM.cheer : ANIM.idle, 0.25);
  }
}

// ── 单位 FSM ─────────────────────────────────────────────────────────────────
function _aiUnit(u, dt, now) {
  // 骑兵走专属九状态 FSM
  if (u.t.cavalry) { _aiCavalry(u, dt, now); return; }
  u.stateT += dt;
  if (u.atkCd > 0) u.atkCd -= dt;
  if (u.actT > 0)  u.actT -= dt;
  // 胜利欢呼限时，结束后恢复跟随（否则永远站在原地）
  if (u.cheering) {
    u.cheerT -= dt;
    if (u.cheerT <= 0) { u.cheering = false; if (u.side === 0) u.state = 'FOLLOW'; }
  }

  // 死亡：动画播完保留尸体几秒后移除
  if (u.state === 'DEAD') {
    u.deadT += dt;
    if (u.deadT > BTL.corpseT) _removeUnit(u);
    return;
  }

  // 士气溃逃：morale<20 时 AI 只会逃跑、无视命令、不攻击（士气层写入 u.routing）
  if (u.routing && typeof moraleFlee === 'function') { moraleFlee(u, dt); return; }

  // 攻击动作中：判定帧结算伤害（_pendHit 由 FIGHT 设置）
  if (u._pendHit && u.actT <= u._pendHitAt) {
    var tg = u._pendHit; u._pendHit = null;
    // 判定帧三重检查：目标存活、仍在攻击距离内、攻击者面向目标（±70°）
    if (!tg.isPlayer && tg.state !== 'DEAD' &&
        _distTo(u, tg) < u.t.range + 0.6 && _facingTo(u, tg)) {
      damageUnit(tg, u.t.dmg, u);
    }
  }

  // 0.2s 决策节流：目标有效性检查 + 状态切换
  if (now >= u.nextDecide) {
    u.nextDecide = now + BTL.decideIv;
    if (u.target && !u.target.isPlayer && u.target.state === 'DEAD') u.target = null;

    if (u.side === 0) {
      if (playerOrder === 'hold') {
        if (u.state !== 'HOLD') { u.state = 'HOLD'; u.target = null; }
      } else if (playerOrder === 'retreat') {
        u.state = 'FOLLOW'; u.target = null;
      } else if (playerOrder === 'rally') {
        u.target = null;
        if (u.state !== 'FOLLOW' && u.state !== 'IDLE') u.state = 'FOLLOW';
      } else if (playerOrder === 'focus') {
        if (u.state === 'HOLD') { u.state = 'FOLLOW'; u.target = null; }
        var ft = _getFocusTarget();
        if (ft) u.target = ft;
        if (u.target) { if (u.state === 'FOLLOW' || u.state === 'IDLE') u.state = 'SEEK'; }
        else if (u.state === 'SEEK' || u.state === 'FIGHT') u.state = 'FOLLOW';
      } else {
        // follow / charge / surround / rangedFront 使用同一决策逻辑，行为层区分
        if (u.state === 'HOLD') { u.state = 'FOLLOW'; u.target = null; }
        if (!u.target) u.target = _pickTarget(u, playerOrder === 'charge');
        if (u.target) { if (u.state === 'FOLLOW' || u.state === 'IDLE') u.state = 'SEEK'; }
        else if (u.state === 'SEEK' || u.state === 'FIGHT') u.state = 'FOLLOW';
      }
    } else {
      if (!u.target) {
        if (u.passive) {
          // 守卫模式：玩家或友军进入领主石 20 格内，全体激活
          if (typeof _enemyStrongholdPos !== 'undefined' && _enemyStrongholdPos) {
            var _ldx = player.x - _enemyStrongholdPos.x;
            var _ldz = player.z - _enemyStrongholdPos.z;
            if (_ldx * _ldx + _ldz * _ldz < 400) {  // 20m 半径
              u.passive = false;
              u.target = _pickTarget(u);
            }
          }
        } else {
          u.target = _pickTarget(u);
        }
      }
      u.state = u.target ? 'SEEK' : 'IDLE';
    }
  }

  // 行为执行（每帧）
  var t = u.t, tgt = u.target, d;
  switch (u.state) {

    case 'FOLLOW':
      // 包围命令：移动到围绕敌军重心的分配角度位置
      if (playerOrder === 'surround' && u.side === 0) {
        var sp = _getSurroundPos(u);
        if (sp) {
          var sdx = sp.x - u.x, sdz = sp.z - u.z, sdd = Math.sqrt(sdx*sdx+sdz*sdz);
          if (sdd > 2) {
            steerMove(u, sp.x, sp.z, u.t.spd, dt);
            if (u.actT <= 0) playAnim(u, sdd > 5 ? ANIM.run : ANIM.walk, 0.2);
          } else {
            faceTo(u, sp.tx, sp.tz, dt);
            if (!tgt) { u.target = _pickTarget(u, true); tgt = u.target; }
            if (tgt) u.state = 'SEEK';
            else if (u.actT <= 0) playAnim(u, ANIM.idle, 0.2);
          }
          break;
        }
      }
      _followFormation(u, dt);
      break;

    case 'SEEK':
      // 敌方：优先趋向防御塔
      if (u.side === 1 && typeof _towers !== 'undefined' && _towers.length > 0) {
        var ntw = null, ntd = BTL.detectR * BTL.detectR * 1.5;
        var ti, twObj, tdx, tdz, td;
        for (ti = 0; ti < _towers.length; ti++) {
          twObj = _towers[ti]; if (twObj.dead) continue;
          tdx = twObj.x - u.x; tdz = twObj.z - u.z; td = tdx*tdx+tdz*tdz;
          if (td < ntd) { ntd = td; ntw = twObj; }
        }
        if (ntw) {
          var twd = Math.sqrt((ntw.x-u.x)*(ntw.x-u.x)+(ntw.z-u.z)*(ntw.z-u.z));
          if (twd > 2.2) {
            var twMoved = steerMove(u, ntw.x, ntw.z, t.spd, dt);
            if (u.actT <= 0) playAnim(u, twMoved ? ANIM.run : ANIM.idle, 0.2);
          } else {
            faceTo(u, ntw.x, ntw.z, dt);
            if (u.atkCd <= 0 && u.actT <= 0) {
              playAnim(u, Math.random() < 0.5 ? ANIM.atk1 : ANIM.atk2, 0.08, true);
              u.actT = 0.9; u.atkCd = t.atkCd;
              battleSfx('atk_clang');
            } else if (u.actT <= 0) { playAnim(u, ANIM.idle, 0.2); }
          }
          break;
        }
      }
      if (!tgt) { u.state = u.side === 0 ? 'FOLLOW' : 'IDLE'; break; }
      // 塔代理目标：如目标是塔且已死，清除目标
      if (tgt.isTower && tgt.towerRef && tgt.towerRef.dead) { u.target = null; u.state = 'IDLE'; break; }
      d = _distTo(u, tgt);
      if (t.ranged) {
        // 弓手：保持距离带，太近后撤、太远逼近，带内射击
        if (d > BTL.rangedFar)      { steerMove(u, tgt.x, tgt.z, t.spd, dt); if (u.actT <= 0) playAnim(u, ANIM.run, 0.2); }
        else if (d < BTL.rangedNear){ steerMove(u, u.x * 2 - tgt.x, u.z * 2 - tgt.z, t.spd, dt); if (u.actT <= 0) playAnim(u, ANIM.walk, 0.2); }
        else {
          faceTo(u, tgt.x, tgt.z, dt);
          if (u.actT <= 0) playAnim(u, ANIM.aim, 0.15);
          if (u.atkCd <= 0 && u.actT <= 0) {
            playAnim(u, ANIM.shoot, 0.1, true);
            u.actT = 0.8; u.atkCd = t.atkCd;
            shootArrow(u, tgt);
          }
        }
      } else {
        if (d > t.range) {
          var skMoved = steerMove(u, tgt.x, tgt.z, t.spd, dt);
          if (u.actT <= 0) playAnim(u, skMoved ? ANIM.run : ANIM.idle, 0.2);
        } else {
          u.state = 'FIGHT';
        }
      }
      break;

    case 'FIGHT':
      if (!tgt) { u.state = u.side === 0 ? 'FOLLOW' : 'IDLE'; break; }
      d = _distTo(u, tgt);
      if (d > t.range * 1.4) { u.state = 'SEEK'; break; }
      faceTo(u, tgt.x, tgt.z, dt);
      if (u.atkCd <= 0 && u.actT <= 0) {
        playAnim(u, Math.random() < 0.5 ? ANIM.atk1 : ANIM.atk2, 0.08, true);
        u.actT = 0.9; u.atkCd = t.atkCd;
        u._pendHit = tgt; u._pendHitAt = 0.9 - BTL.meleeDmgDelay;   // 起手 0.45s 后结算
        battleSfx('atk_swing');
      } else if (u.actT <= 0) {
        playAnim(u, ANIM.idle, 0.2);
      }
      break;

    case 'HOLD':
      // 驻守：不移动，打进入射程的敌人（索敌走 0.2s 决策节流，不每帧扫）
      if (tgt && _distTo(u, tgt) > (t.ranged ? BTL.rangedFar : t.range * 1.2)) {
        u.target = null; tgt = null;
      }
      if (!tgt && now >= u.nextDecide - BTL.decideIv * 0.5) {
        u.target = _pickTarget(u);
        tgt = u.target;
      }
      if (tgt) {
        d = _distTo(u, tgt);
        faceTo(u, tgt.x, tgt.z, dt);
        if (t.ranged && d <= BTL.rangedFar && u.atkCd <= 0 && u.actT <= 0) {
          playAnim(u, ANIM.shoot, 0.1, true);
          u.actT = 0.8; u.atkCd = t.atkCd;
          shootArrow(u, tgt);
        } else if (!t.ranged && d <= t.range && u.atkCd <= 0 && u.actT <= 0) {
          playAnim(u, Math.random() < 0.5 ? ANIM.atk1 : ANIM.atk2, 0.08, true);
          u.actT = 0.9; u.atkCd = t.atkCd;
          u._pendHit = tgt; u._pendHitAt = 0.9 - BTL.meleeDmgDelay;
          battleSfx('atk_swing');
        } else if (u.actT <= 0) {
          playAnim(u, t.ranged ? ANIM.aim : ANIM.idle, 0.2);
        }
      } else if (u.actT <= 0) {
        playAnim(u, ANIM.idle, 0.25);
      }
      break;

    default:   // IDLE
      if (u.actT <= 0) playAnim(u, u.cheering ? ANIM.cheer : ANIM.idle, 0.25);
  }
}

// ── 总入口 ────────────────────────────────────────────────────────────────────
function combatUpdate(dt, now) {
  updateTerritoryFx(dt);  // 结界动画（combat_steer.js）
  if (typeof updateTowers === 'function') updateTowers(dt);  // 塔防（combat_tower.js）
  if (typeof updateParticles === 'function') updateParticles(dt);  // 粒子特效（combat_particles.js）
  battleProgress();   // 胜负判定
  updateFloats(dt);   // 伤害飘字
  if (!combatUnits.length) return;
  var i, u;
  // 空间哈希重建：AI 移动中的分离力查询用（碰撞解算内部会再建一次反映移动后位置）
  if (typeof _rebuildGrid === 'function') _rebuildGrid();
  // 第一段：AI 决策与移动（可能更新 x/z）
  for (i = combatUnits.length - 1; i >= 0; i--) {
    _aiUnit(combatUnits[i], dt, now);
  }
  // 第二段：硬碰撞解算（单位↔单位、单位↔玩家，combat_steer.js）
  resolveUnitCollisions();
  // 士气反馈：必须在物理/战斗之后（AI→Formation→Physics→Combat→Morale）
  if (typeof updateMorale === 'function') updateMorale(dt);
  // 第三段：同步渲染（碰撞修正后的最终位置）
  for (i = 0; i < combatUnits.length; i++) {
    u = combatUnits[i];
    u.group.position.set(u.x, u.y, u.z);
    u.group.rotation.y = u.yaw;
    u.mixer.update(dt);
    if (u.horseMixer) u.horseMixer.update(dt);
  }
  updateArrows(dt);
}


// ═══ src/combat_cmd.js ═══
// ─── combat_cmd.js ────────────────────────────────────────────────────────────
// 指挥层：两个折叠面板（招兵 + 军令）+ 胜负判定。
//
// 左侧两个图标按钮：⚔️ 招兵、📋 军令，点击展开/收起对应面板。
// 招兵面板：8 个兵种按钮 + 1 个魔法塔，点一下招 6 个同类兵。
// 军令面板：8 条命令，当前命令高亮。

var _cmdWrap = null;
var _recruitPanel = null, _orderPanel = null;
var _recruitOpen = false, _orderOpen = false;
var _hadEnemies = false;
var _castleCourtyard = null;  // 城堡广场中心，placeSimpleCastle 设定后生效
var _castleGatePos   = null;  // 城堡南门外集结点，招兵时在门外生成（避免卡在城堡内）

// 魔法塔已移到背包作为可放置道具（TOWER_ITEM），不再在招兵面板。
var _RECRUIT = [
  ['🛡️', 'knight'],
  ['🪓', 'barbarian'],
  ['🏹', 'ranger'],
  ['🐎', 'cavalry'],
  ['💀', 'skel_war'],
  ['☠️', 'skel_min'],
  ['🎯', 'skel_rog'],
];

function buildBattleUI() {
  var ui = document.getElementById('ui');
  if (!ui || _cmdWrap) return;

  _cmdWrap = document.createElement('div');
  _cmdWrap.style.cssText = 'position:absolute;left:8px;top:60px;display:flex;' +
    'flex-direction:column;gap:6px;z-index:112';
  ui.appendChild(_cmdWrap);

  var recToggle = _mkIconBtn('⚔️', '招兵', function () {
    _recruitOpen = !_recruitOpen;
    _recruitPanel.style.display = _recruitOpen ? 'flex' : 'none';
    if (_recruitOpen) { _orderOpen = false; _orderPanel.style.display = 'none'; }
  });
  var ordToggle = _mkIconBtn('📋', '军令', function () {
    _orderOpen = !_orderOpen;
    _orderPanel.style.display = _orderOpen ? 'flex' : 'none';
    if (_orderOpen) { _recruitOpen = false; _recruitPanel.style.display = 'none'; }
  });
  _cmdWrap.appendChild(recToggle);
  _cmdWrap.appendChild(ordToggle);

  // 招兵面板（触发按钮右侧弹出，2列排布防止高度溢出）
  _recruitPanel = document.createElement('div');
  _recruitPanel.style.cssText = 'position:absolute;left:68px;top:60px;display:none;' +
    'flex-direction:row;flex-wrap:wrap;gap:4px;width:88px;z-index:112;' +
    'background:rgba(0,0,0,.6);padding:5px 6px;border-radius:10px';
  ui.appendChild(_recruitPanel);
  var i;
  for (i = 0; i < _RECRUIT.length; i++) {
    (function (r) {
      var ally = r[1].indexOf('skel_') !== 0;
      var b = _mkSmallBtn(r[0], UNIT_TYPES[r[1]].name, function () {
        spawnKind(r[1], 6);
        _recruitOpen = false; _recruitPanel.style.display = 'none';
      });
      b.style.borderColor = ally ? 'rgba(74,222,128,.5)' : 'rgba(239,68,68,.5)';
      _recruitPanel.appendChild(b);
    }(_RECRUIT[i]));
  }

  // 军令面板（2列，避免高度溢出）
  _orderPanel = document.createElement('div');
  _orderPanel.style.cssText = 'position:absolute;left:68px;top:116px;display:none;' +
    'flex-direction:row;flex-wrap:wrap;gap:4px;width:88px;z-index:112;' +
    'background:rgba(0,0,0,.6);padding:5px 6px;border-radius:10px';
  ui.appendChild(_orderPanel);
  var orders = [
    ['🏃', '跟随',   'follow'],
    ['🗡️', '冲锋',   'charge'],
    ['🛡️', '驻守',   'hold'],
    ['🚩', '撤退',   'retreat'],
    ['🎯', '集火',   'focus'],
    ['⭕', '包围',   'surround'],
    ['📣', '整队',   'rally'],
    ['🏹', '弓前',   'rangedFront'],
  ];
  for (i = 0; i < orders.length; i++) {
    (function (o) {
      var b = _mkSmallBtn(o[0], o[1], function () {
        playerOrder = o[2]; _hiliteOrder();
        battleToast('命令：' + o[1]);
        _orderOpen = false; _orderPanel.style.display = 'none';
      });
      b.id = 'cmd-' + o[2];
      _orderPanel.appendChild(b);
    }(orders[i]));
  }
  _hiliteOrder();
}

function _mkIconBtn(ic, label, onTap) {
  var b = document.createElement('button');
  b.className = 'btn';
  b.style.cssText = 'width:52px;height:52px;font-size:8px';
  b.innerHTML = '<span style="font-size:20px;display:block">' + ic + '</span>' + label;
  b.addEventListener('touchstart', function (e) { e.preventDefault(); onTap(); }, { passive: false });
  b.addEventListener('click', function () { onTap(); });
  return b;
}

function _mkSmallBtn(ic, label, onTap) {
  var b = document.createElement('button');
  b.className = 'btn';
  b.style.cssText = 'width:40px;height:40px;font-size:7px;border-radius:7px;' +
    'background:rgba(0,0,0,.65);border:1.5px solid rgba(255,255,255,.25)';
  b.innerHTML = '<span style="font-size:15px;display:block">' + ic + '</span>' + label;
  b.addEventListener('touchstart', function (e) { e.preventDefault(); onTap(); }, { passive: false });
  b.addEventListener('click', function () { onTap(); });
  return b;
}

function _hiliteOrder() {
  var ids = ['follow','charge','hold','retreat','focus','surround','rally','rangedFront'];
  var i, el;
  for (i = 0; i < ids.length; i++) {
    el = document.getElementById('cmd-' + ids[i]);
    if (el) el.style.borderColor = playerOrder === ids[i] ?
      'rgba(250,204,21,.9)' : 'rgba(255,255,255,.25)';
  }
}

// ── 招兵（每次召唤 count 个，默认 6）──────────────────────────────────────────
function spawnKind(kind, count) {
  count = count || 1;
  if (!_armyLoaded) {
    var tog = _cmdWrap ? _cmdWrap.firstChild : null;
    function _restoreBtn() { if (tog) { tog.disabled = false; tog.lastChild.textContent = '招兵'; } }
    if (tog) { tog.disabled = true; tog.lastChild.textContent = '加载…'; }
    // 20s 超时兜底：网络慢/资源失败时按钮不会永久卡住
    var _safeTid = setTimeout(_restoreBtn, 20000);
    loadArmyModels(function () {
      clearTimeout(_safeTid);
      _restoreBtn();
      spawnKind(kind, count);
    }, function (done, total) {
      if (tog) tog.lastChild.textContent = done + '/' + total;
    });
    return;
  }

  var t = UNIT_TYPES[kind];
  var side = kind.indexOf('skel_') === 0 ? 1 : 0;
  var spawned = 0, n, a, r, x, z, u;

  for (n = 0; n < count; n++) {
    if (side === 0) {
      if (_castleGatePos && _inTerritory(player.x, player.z)) {
        // 在城堡南门外集结，避免单位被城墙困住
        a = Math.random() * Math.PI * 2;
        r = 1.2 + Math.random() * 3;
        x = _castleGatePos.x + Math.sin(a) * r;
        z = _castleGatePos.z + Math.cos(a) * r;
      } else {
        a = Math.random() * Math.PI * 2;
        r = 2 + Math.random() * 2.5;
        x = player.x + Math.sin(a) * r;
        z = player.z + Math.cos(a) * r;
      }
    } else {
      a = player.yaw + (Math.random() - 0.5) * 1.2;
      r = 9 + Math.random() * 6;
      x = player.x - Math.sin(a) * r;
      z = player.z - Math.cos(a) * r;
    }
    u = spawnUnit(kind, side, x, z);
    if (u) spawned++;
  }
  if (spawned > 0) battleToast((side === 0 ? '我方 ' : '敌方 ') +
    t.name + (spawned > 1 ? ' ×' + spawned : '') + ' 入场');
}

// 每帧胜负检查（combat_ai.js combatUpdate 调用）
function battleProgress() {
  var en = countAlive(1);
  if (en > 0) { _hadEnemies = true; return; }
  if (!_hadEnemies) return;
  _hadEnemies = false;
  var i, u;
  for (i = 0; i < combatUnits.length; i++) {
    u = combatUnits[i];
    if (u.side === 0 && u.state !== 'DEAD') {
      u.cheering = true; u.cheerT = 3; u.target = null; u.state = 'IDLE';
    }
  }
  battleSfx('atk_clang');
  battleToast('🎉 敌人已肃清！');
}


// ═══ src/combat_tower.js ═══
// ─── combat_tower.js ──────────────────────────────────────────────────────────
// 塔防系统：领地内可放置魔法塔。
// 敌方优先向塔移动并攻击；塔闪电束瞬发伤害范围内敌人；塔有 HP 可被摧毁。

var _towers = [];          // 活动防御塔列表
var _lightningBeams = [];  // 淡出中的闪电束 [{line,t,life}]
var _towerTime = 0;        // 动画累计时间

// 塔配置
var TOWER_CFG = {
  hp:      350,
  range:   22,      // 攻击半径（米）
  dmg:     15,
  atkCd:   1.5,     // 攻击间隔（秒）
  orbSpd:  14,
  h:       7.5,
};

// ── 程序化魔法塔 ──────────────────────────────────────────────────────────────
function _makeProcTower() {
  var grp = new THREE.Group();
  var matStone = new THREE.MeshPhongMaterial({ color: 0x6b7280, shininess: 28, specular: 0x222222 });
  var matDark  = new THREE.MeshPhongMaterial({ color: 0x4b5563, shininess: 18, specular: 0x111111 });
  var matPurple = new THREE.MeshBasicMaterial({ color: 0x9333ea });
  var matLilac  = new THREE.MeshBasicMaterial({ color: 0xc084fc });

  function cyl(rt, rb, h, seg, mat, y) {
    var m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
    m.position.y = y; return m;
  }

  grp.add(cyl(1.20, 1.55, 1.50, 32, matDark,  0.75));
  grp.add(cyl(1.28, 1.28, 0.22, 32, matStone, 1.55));
  grp.add(cyl(0.98, 1.22, 2.20, 32, matStone, 2.75));
  grp.add(cyl(1.06, 1.06, 0.22, 32, matDark,  3.86));
  grp.add(cyl(1.12, 1.00, 1.40, 32, matStone, 4.66));
  grp.add(cyl(1.28, 1.14, 0.50, 32, matDark,  5.61));

  // 12 个雉堞
  var bi, ba;
  for (bi = 0; bi < 12; bi++) {
    ba = (bi / 12) * Math.PI * 2;
    var cr = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.44, 0.22), matStone);
    cr.position.set(Math.cos(ba) * 1.12, 6.12, Math.sin(ba) * 1.12);
    grp.add(cr);
  }

  // 双锥菱形水晶：两锥底面对齐在 y=6.30，完全消除交叉穿模
  // ConeGeometry 底面在本地 y=-h/2，顶在 y=+h/2；基于此推导中心偏移
  var JUNC = 6.30;                         // 两锥底面交汇高度
  var crystalTop = new THREE.Mesh(new THREE.ConeGeometry(0.38, 0.92, 6), matPurple);
  crystalTop.position.y = JUNC + 0.46;    // 底面在 JUNC，尖端在 JUNC+0.92
  var crystalBot = new THREE.Mesh(new THREE.ConeGeometry(0.38, 0.92, 6), matLilac);
  crystalBot.rotation.x = Math.PI;        // 翻转：底面朝上，尖端朝下
  crystalBot.position.y = JUNC - 0.46;   // 底面在 JUNC，尖端在 JUNC-0.92
  grp.add(crystalTop);
  grp.add(crystalBot);

  // 大水平光环（绕水晶中腰旋转，缩小到雉堞内侧）
  var ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.72, 0.10, 8, 48),
    new THREE.MeshBasicMaterial({ color: 0xc084fc })
  );
  ring.rotation.x = Math.PI * 0.5;
  ring.position.y = JUNC;                 // 水晶腰部
  grp.add(ring);

  // 小倾斜光环（进动）
  var ring2 = new THREE.Mesh(
    new THREE.TorusGeometry(0.62, 0.08, 6, 32),
    new THREE.MeshBasicMaterial({ color: 0x9333ea })
  );
  ring2.rotation.z = Math.PI / 3.5;
  ring2.position.y = JUNC;
  grp.add(ring2);

  // 水晶外发光球（加法混合，避免 BackSide 白雾感）
  var glowSph = new THREE.Mesh(
    new THREE.SphereGeometry(0.50, 10, 8),
    new THREE.MeshBasicMaterial({ color: 0xc084fc, transparent: true, opacity: 0.22,
      depthWrite: false, blending: THREE.AdditiveBlending })
  );
  glowSph.position.y = JUNC;
  grp.add(glowSph);

  grp.userData.crystal  = crystalTop;
  grp.userData.crystal2 = crystalBot;
  grp.userData.ring     = ring;
  grp.userData.ring2    = ring2;
  grp.userData.glow     = glowSph;
  return grp;
}

// ── 放置防御塔 ────────────────────────────────────────────────────────────────
function placeTower(tx, tz, silent) {
  var grp = _makeProcTower();
  var gy = _groundY(Math.floor(tx), Math.floor(tz));
  grp.position.set(tx, gy, tz);
  scene.add(grp);

  var tower = {
    x: tx, y: gy, z: tz,
    hp: TOWER_CFG.hp, maxHp: TOWER_CFG.hp,
    atkCd: Math.random() * TOWER_CFG.atkCd,
    group: grp, dead: false,
    hpBar: null, _hpCv: null, _hpTex: null,
    _sparkT: 0, _spkPts: null, _spkPos: null, _spkVel: null, _spkAge: null, _spkN: 0, _spkHead: 0,
  };
  _makeTowerHpBar(tower);
  _makeTowerSparkle(tower);
  _towers.push(tower);
  if (!silent) {
    battleToast('⚗️ 魔法塔已建立！');
    if (typeof saveGame === 'function') saveGame();
  }
  return tower;
}

// ── 塔粒子（常驻循环槽，不分配 GPU 缓冲区）──────────────────────────────────────
function _makeTowerSparkle(tower) {
  var n = 6, i;
  var pos = new Float32Array(n * 3);
  var vel = new Float32Array(n * 3);
  var age = new Float32Array(n);
  for (i = 0; i < n; i++) pos[i * 3 + 1] = -999;   // 沉入地下（初始不可见）
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  var mat = new THREE.PointsMaterial({
    color: 0xc084fc, size: 0.12, transparent: true, opacity: 1.0,
    depthWrite: false, sizeAttenuation: true,
  });
  var pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  scene.add(pts);
  tower._spkPts = pts; tower._spkPos = pos; tower._spkVel = vel;
  tower._spkAge = age; tower._spkN = n;
}

// ── 塔血条 ────────────────────────────────────────────────────────────────────
function _makeTowerHpBar(tower) {
  var cv = document.createElement('canvas');
  cv.width = 64; cv.height = 8;
  var tex = new THREE.CanvasTexture(cv);
  var spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  spr.scale.set(1.4, 0.18, 1);
  spr.position.y = TOWER_CFG.h + 0.6;
  spr.renderOrder = 10;
  tower.group.add(spr);
  tower.hpBar = spr;
  tower._hpCv = cv; tower._hpTex = tex;
  _updateTowerHpBar(tower);
}

function _updateTowerHpBar(tower) {
  if (!tower.hpBar) return;
  var ctx = tower._hpCv.getContext('2d');
  var w = 64, h = 8, r = Math.max(0, tower.hp / tower.maxHp);
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#a855f7';
  ctx.fillRect(1, 1, (w - 2) * r, h - 2);
  tower._hpTex.needsUpdate = true;
}

// ── 闪电束攻击（瞬发伤害 + 0.12s 淡出线条）────────────────────────────────────
function _shootLightning(tower, tgt) {
  battleSfx('tower_magic');

  // 瞬发伤害
  damageUnit(tgt, TOWER_CFG.dmg, null);

  var sx = tower.x, sy = tower.y + TOWER_CFG.h * 0.90, sz = tower.z;
  var ex = tgt.x, ey = tgt.y + (tgt.t ? tgt.t.h * 0.5 : 1), ez = tgt.z;

  // 命中粒子迸溅
  if (typeof spawnBurst === 'function') {
    spawnBurst(ex, ey, ez, { count: 16, color: 0xc084fc, speed: 5, size: 0.18, life: 0.5, up: 0.4 });
  }

  // 闪电线条（淡紫色）
  var pts = [new THREE.Vector3(sx, sy, sz), new THREE.Vector3(ex, ey, ez)];
  var geo = new THREE.BufferGeometry().setFromPoints(pts);
  var mat = new THREE.LineBasicMaterial({ color: 0xc084fc, transparent: true, opacity: 1.0 });
  var line = new THREE.Line(geo, mat);
  scene.add(line);
  _lightningBeams.push({ line: line, t: 0, life: 0.12 });
}

// ── 塔受伤 ────────────────────────────────────────────────────────────────────
function damageTower(tower, dmg) {
  if (tower.dead) return;
  tower.hp -= dmg;
  _updateTowerHpBar(tower);
  dmgFloat({ x: tower.x, y: tower.y, z: tower.z, t: { h: TOWER_CFG.h } }, dmg, false, false);
  battleSfx('atk_hit');
  if (tower.hp <= 0) {
    tower.dead = true;
    scene.remove(tower.group);
    if (tower._spkPts) {
      scene.remove(tower._spkPts);
      tower._spkPts.geometry.dispose();
      tower._spkPts.material.dispose();
      tower._spkPts = null;
    }
    var i = _towers.indexOf(tower);
    if (i >= 0) _towers.splice(i, 1);
    if (typeof spawnBurst === 'function') {
      spawnBurst(tower.x, tower.y + 2.5, tower.z, { count: 40, color: 0x9333ea, speed: 8, size: 0.3, life: 1.0, up: 0.4 });
      spawnBurst(tower.x, tower.y + 1.2, tower.z, { count: 30, color: 0x6b7280, speed: 5, size: 0.25, life: 1.2, up: 0.2 });
    }
    battleToast('🏚️ 魔法塔被摧毁！');
    if (typeof saveGame === 'function') saveGame();
  }
}

// ── 每帧更新（combat_ai.js combatUpdate 调用）────────────────────────────────
function updateTowers(dt) {
  _towerTime += dt;
  var i, j, tower, u, dx, dz, d2, best, bd;

  for (i = 0; i < _towers.length; i++) {
    tower = _towers[i];
    if (tower.dead) continue;
    // 水晶/光环动效
    if (tower.group.userData.crystal)  tower.group.userData.crystal.rotation.y  += dt * 1.5;
    if (tower.group.userData.crystal2) tower.group.userData.crystal2.rotation.y += dt * 1.5;
    if (tower.group.userData.ring)     tower.group.userData.ring.rotation.z     += dt * 0.8;
    if (tower.group.userData.ring2)    tower.group.userData.ring2.rotation.y    += dt * 2.2;
    // 发光球脉冲
    if (tower.group.userData.glow) {
      tower.group.userData.glow.material.opacity = 0.15 + 0.15 * Math.sin(_towerTime * 3.5 + i * 1.7);
    }
    // 水晶常驻粒子（循环 6 槽；直接写已有 GPU 缓冲区，不分配新几何体）
    tower._sparkT += dt;
    if (tower._sparkT > 0.35) {
      tower._sparkT = 0;
      var sy0 = tower.y + TOWER_CFG.h * 0.88, sa, si;
      for (var sp = 0; sp < 3; sp++) {
        si = tower._spkHead++ % tower._spkN;
        sa = Math.random() * Math.PI * 2;
        tower._spkPos[si*3]   = tower.x + Math.cos(sa) * 0.2;
        tower._spkPos[si*3+1] = sy0;
        tower._spkPos[si*3+2] = tower.z + Math.sin(sa) * 0.2;
        tower._spkVel[si*3]   = (Math.random() - 0.5) * 0.7;
        tower._spkVel[si*3+1] = 1.0 + Math.random() * 1.2;
        tower._spkVel[si*3+2] = (Math.random() - 0.5) * 0.7;
        tower._spkAge[si] = 0.7;
      }
    }
    if (tower._spkPts) {
      for (var sk = 0; sk < tower._spkN; sk++) {
        if (tower._spkAge[sk] > 0) {
          tower._spkAge[sk] -= dt;
          if (tower._spkAge[sk] <= 0) { tower._spkPos[sk*3+1] = -999; continue; }
          tower._spkPos[sk*3]   += tower._spkVel[sk*3]   * dt;
          tower._spkPos[sk*3+1] += tower._spkVel[sk*3+1] * dt;
          tower._spkPos[sk*3+2] += tower._spkVel[sk*3+2] * dt;
          tower._spkVel[sk*3+1] -= 9 * dt;
        }
      }
      tower._spkPts.geometry.attributes.position.needsUpdate = true;
    }
    tower.atkCd -= dt;
    if (tower.atkCd <= 0) {
      best = null; bd = TOWER_CFG.range * TOWER_CFG.range;
      for (j = 0; j < combatUnits.length; j++) {
        u = combatUnits[j];
        if (u.side !== 1 || u.state === 'DEAD') continue;
        dx = u.x - tower.x; dz = u.z - tower.z;
        d2 = dx * dx + dz * dz;
        if (d2 < bd) { bd = d2; best = u; }
      }
      if (best) { _shootLightning(tower, best); tower.atkCd = TOWER_CFG.atkCd; }
    }
  }

  // 敌方近战打塔
  for (j = 0; j < combatUnits.length; j++) {
    u = combatUnits[j];
    if (u.side !== 1 || u.state === 'DEAD') continue;
    if ((u._towerAtkCd || 0) > 0) { u._towerAtkCd -= dt; continue; }
    for (i = 0; i < _towers.length; i++) {
      tower = _towers[i]; if (tower.dead) continue;
      dx = tower.x - u.x; dz = tower.z - u.z;
      if (dx * dx + dz * dz < 5.0) {
        damageTower(tower, u.t.dmg);
        u._towerAtkCd = u.t.atkCd * 0.9;
        if (u.actT <= 0) {
          playAnim(u, Math.random() < 0.5 ? ANIM.atk1 : ANIM.atk2, 0.1, true);
          u.actT = 0.8;
          battleSfx('atk_clang');
        }
        break;
      }
    }
  }

  // 闪电束淡出
  for (i = _lightningBeams.length - 1; i >= 0; i--) {
    var b = _lightningBeams[i];
    b.t += dt;
    b.line.material.opacity = 1.0 - b.t / b.life;
    if (b.t >= b.life) {
      scene.remove(b.line);
      b.line.geometry.dispose();
      b.line.material.dispose();
      _lightningBeams.splice(i, 1);
    }
  }
}


// ═══ src/combat_particles.js ═══
// ─── combat_particles.js ──────────────────────────────────────────────────────
// 轻量粒子特效：基于 THREE.Points + BufferGeometry（Three.js r147 原生，零外部依赖）。
//
// 设计取舍：调研的 Partykals 等库要么需要 npm 打包，要么其运行时 API 无法在本项目
// 的 r147 UMD 环境中验证；为保证稳定，这里用原生 Points 自实现一个够用的爆发系统。
// spawnBurst() 在某点喷出一簇粒子（半球向上 + 重力 + 渐隐），updateParticles() 每帧推进。

var _bursts = [];   // 活动粒子簇

// 在 (x,y,z) 喷出一簇粒子。opts: {count,color,speed,size,life,gravity,up}
function spawnBurst(x, y, z, opts) {
  if (typeof scene === 'undefined') return;
  opts = opts || {};
  var n     = opts.count   || 18;
  var color = opts.color   != null ? opts.color   : 0x9333ea;
  var spd   = opts.speed   || 4;
  var size  = opts.size    || 0.22;
  var life  = opts.life    || 0.7;
  var grav  = opts.gravity != null ? opts.gravity : 10;
  var up    = opts.up      != null ? opts.up      : 0.3;   // 额外向上初速比例

  var positions = new Float32Array(n * 3);
  var vel = new Float32Array(n * 3);
  var i, a, b, sp;
  for (i = 0; i < n; i++) {
    positions[i*3] = x; positions[i*3+1] = y; positions[i*3+2] = z;
    a  = Math.random() * Math.PI * 2;          // 方位角
    b  = Math.random() * Math.PI * 0.5;         // 仰角 0~90°（半球向上）
    sp = spd * (0.4 + Math.random() * 0.6);
    vel[i*3]   = Math.cos(a) * Math.cos(b) * sp;
    vel[i*3+1] = Math.sin(b) * sp + spd * up;
    vel[i*3+2] = Math.sin(a) * Math.cos(b) * sp;
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  var mat = new THREE.PointsMaterial({
    color: color, size: size, transparent: true, opacity: 1,
    depthWrite: false, sizeAttenuation: true,
  });
  var pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  scene.add(pts);
  _bursts.push({ pts: pts, vel: vel, t: 0, life: life, grav: grav, n: n, _sz: size });
}

// 每帧推进所有粒子簇（combat_ai.js combatUpdate 调用）
function updateParticles(dt) {
  var i, b, pos, j, k;
  for (i = _bursts.length - 1; i >= 0; i--) {
    b = _bursts[i];
    b.t += dt;
    pos = b.pts.geometry.attributes.position.array;
    for (j = 0; j < b.n; j++) {
      k = j * 3;
      b.vel[k+1] -= b.grav * dt;
      pos[k]   += b.vel[k]   * dt;
      pos[k+1] += b.vel[k+1] * dt;
      pos[k+2] += b.vel[k+2] * dt;
    }
    b.pts.geometry.attributes.position.needsUpdate = true;
    var frac = Math.max(0, 1 - b.t / b.life);
    b.pts.material.opacity = frac;
    b.pts.material.size    = b._sz * (0.25 + 0.75 * frac);
    if (b.t >= b.life) {
      scene.remove(b.pts);
      b.pts.geometry.dispose();
      b.pts.material.dispose();
      _bursts.splice(i, 1);
    }
  }
}

// 把 RLE 结构放进世界
function placeStructure(s, ox, baseY, oz) {
  var dirty = {};
  function ec(cx, cz) {
    var k = ckey(cx, cz);
    if (!chunks[k]) chunks[k] = { data: genTerrain(cx, cz), mesh: null };
  }
  function raw(wx, wy, wz, id) {
    if (wy < 0 || wy >= CHUNK_H) return;
    var cx = Math.floor(wx / CHUNK_W);
    var cz = Math.floor(wz / CHUNK_D);
    ec(cx, cz);
    var ch = chunks[ckey(cx, cz)];
    var lx = ((wx % CHUNK_W) + CHUNK_W) % CHUNK_W;
    var lz = ((wz % CHUNK_D) + CHUNK_D) % CHUNK_D;
    ch.data[lx + wy * CHUNK_W + lz * CHUNK_W * CHUNK_H] = id;
    dirty[ckey(cx, cz)] = [cx, cz];
    if (lx === 0)         { ec(cx-1,cz); dirty[ckey(cx-1,cz)] = [cx-1,cz]; }
    if (lx === CHUNK_W-1) { ec(cx+1,cz); dirty[ckey(cx+1,cz)] = [cx+1,cz]; }
    if (lz === 0)         { ec(cx,cz-1); dirty[ckey(cx,cz-1)] = [cx,cz-1]; }
    if (lz === CHUNK_D-1) { ec(cx,cz+1); dirty[ckey(cx,cz+1)] = [cx,cz+1]; }
  }
  var oy = baseY - s.groundY;
  var i, j, id, n, x = 0, z = 0, y = 0;
  var rle = s.rle;
  for (i = 0; i < rle.length; i += 2) {
    id = rle[i]; n = rle[i+1];
    for (j = 0; j < n; j++) {
      if (!(id === AIR && y < s.groundY)) raw(ox + x, oy + y, oz + z, id);
      x++; if (x === s.w) { x = 0; z++; if (z === s.d) { z = 0; y++; } }
    }
  }
  var k, cd;
  for (k in dirty) { cd = dirty[k]; rebuildChunk(cd[0], cd[1]); }
}
