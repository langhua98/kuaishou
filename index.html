          raw(ox+tx+x, BY+y, oz+tz+z, y < 6 ? COBBLE : GRAY_BRICK);
        }
      }
    }
    // 塔顶：GRAY_ROOF 尖顶 + 四角小垛口
    raw(ox+tx+1, BY+TOWER_H,   oz+tz+1, GRAY_ROOF);  // 中心尖顶
    raw(ox+tx,   BY+TOWER_H,   oz+tz,   COBBLE);
    raw(ox+tx+2, BY+TOWER_H,   oz+tz,   COBBLE);
    raw(ox+tx,   BY+TOWER_H,   oz+tz+2, COBBLE);
    raw(ox+tx+2, BY+TOWER_H,   oz+tz+2, COBBLE);
  }

  // ── 北侧主楼（10×7，双层，白石上层，灰屋顶尖）────────────────────────────
  var kox = ox+6, koz = oz+2;
  // 下层（STONE 外墙 + PLANKS 地板），高 5
  for (y = 0; y < 5; y++) {
    for (x = 0; x < 10; x++) {
      for (z = 0; z < 7; z++) {
        if (x === 0 || x === 9 || z === 0 || z === 6) raw(kox+x, BY+y, koz+z, STONE);
      }
    }
  }
  for (x = 1; x < 9; x++) {
    for (z = 1; z < 6; z++) raw(kox+x, BY, koz+z, PLANKS);
  }
  // 上层（WHITE_STONE 外墙），高 3
  for (y = 5; y < 8; y++) {
    for (x = 0; x < 10; x++) {
      for (z = 0; z < 7; z++) {
        if (x === 0 || x === 9 || z === 0 || z === 6) raw(kox+x, BY+y, koz+z, WHITE_STONE);
      }
    }
  }
  // 楼顶 GRAY_BRICK 封顶 + 中央 GRAY_ROOF 尖顶两块
  for (x = 0; x < 10; x++) {
    for (z = 0; z < 7; z++) raw(kox+x, BY+8, koz+z, GRAY_BRICK);
  }
  raw(kox+4, BY+9, koz+3, GRAY_ROOF);
  raw(kox+5, BY+9, koz+3, GRAY_ROOF);
  // 主楼南面门洞（3 宽 4 高，面向广场）
  for (y = 0; y < 4; y++) {
    raw(kox+4, BY+y, koz+6, AIR);
    raw(kox+5, BY+y, koz+6, AIR);
    raw(kox+6, BY+y, koz+6, AIR);
  }
  // 门口两侧 RED_PILLAR 柱
  for (y = 0; y < 5; y++) {
    raw(kox+3, BY+y, koz+6, RED_PILLAR);
    raw(kox+7, BY+y, koz+6, RED_PILLAR);
  }

  // ── 广场中心水井（5×5 WHITE_STONE 圈，高 1）──────────────────────────────
  for (x = 8; x <= 13; x++) {
    raw(ox+x, BY+1, oz+14, WHITE_STONE);
    raw(ox+x, BY+1, oz+18, WHITE_STONE);
  }
  for (z = 15; z <= 17; z++) {
    raw(ox+8,  BY+1, oz+z, WHITE_STONE);
    raw(ox+13, BY+1, oz+z, WHITE_STONE);
  }

  // ── 广场四盏石柱路灯（城门内侧两侧 + 主楼门口两侧）────────────────────────
  raw(ox+7,  BY+1, oz+W-3, RED_PILLAR);
  raw(ox+14, BY+1, oz+W-3, RED_PILLAR);
  raw(ox+7,  BY+1, oz+9,   RED_PILLAR);
  raw(ox+14, BY+1, oz+9,   RED_PILLAR);

  // ── 城堡广场中心 + 南门外集结点（供招兵系统使用）──────────────────────────
  _castleCourtyard = { x: ox + 11, z: oz + 15 };
  _castleGatePos   = { x: ox + 10.5, z: oz + W + 2 };  // 南门外 2 格

  // 领地石放于广场中心，激活 R=25 结界
  raw(ox+11, BY+1, oz+11, TERRITORY_STONE);
  if (typeof _addTerritory === 'function') _addTerritory(ox+11, BY+1, oz+11);

  var k, cd;
  for (k in dirty) { cd = dirty[k]; rebuildChunk(cd[0], cd[1]); }
}

// 敌人要塞：16×16 围墙院落，中心放置领主石（OBSIDIAN）
var _enemyStrongholdPos = null;

function placeEnemyStronghold(ox, oz) {
  var flatY = SEA + 2;  // 目标地表高度 = 14
  var W = 16, H = 4;
  var x, z, y;
  var dirty = {};

  function ec(cx, cz) {
    var k = ckey(cx, cz);
    if (!chunks[k]) chunks[k] = { data: genTerrain(cx, cz), mesh: null };
  }
  function raw(wx, wy, wz, id) {
    if (wy < 0 || wy >= CHUNK_H) return;
    var cx = Math.floor(wx / CHUNK_W), cz = Math.floor(wz / CHUNK_D);
    ec(cx, cz);
    var ch = chunks[ckey(cx, cz)];
    var lx = ((wx % CHUNK_W) + CHUNK_W) % CHUNK_W;
    var lz = ((wz % CHUNK_D) + CHUNK_D) % CHUNK_D;
    ch.data[lx + wy * CHUNK_W + lz * CHUNK_W * CHUNK_H] = id;
    dirty[ckey(cx, cz)] = [cx, cz];
    if (lx === 0)         { ec(cx-1,cz); dirty[ckey(cx-1,cz)] = [cx-1,cz]; }
    if (lx === CHUNK_W-1) { ec(cx+1,cz); dirty[ckey(cx+1,cz)] = [cx+1,cz]; }
    if (lz === 0)         { ec(cx,cz-1); dirty[ckey(cx,cz-1)] = [cx,cz-1]; }
    if (lz === CHUNK_D-1) { ec(cx,cz+1); dirty[ckey(cx,cz+1)] = [cx,cz+1]; }
  }

  // 平整地形（含 2 格边距）
  for (x = ox - 2; x < ox + W + 2; x++) {
    for (z = oz - 2; z < oz + W + 2; z++) {
      for (y = flatY + 1; y < flatY + 24; y++) raw(x, y, z, AIR); // 削山
      for (y = flatY - 6; y < flatY; y++) {                         // 填谷
        if (getBlock(x, y, z) === AIR) raw(x, y, z, DIRT);
      }
      raw(x, flatY, z, GRASS);  // 统一地表
    }
  }

  // 地面铺 GRAY_BRICK
  for (x = ox; x < ox + W; x++) {
    for (z = oz; z < oz + W; z++) {
      raw(x, flatY, z, GRAY_BRICK);
    }
  }

  // 四面围墙（COBBLE，高 H 格），南面留 2 格入口
  for (x = ox; x < ox + W; x++) {
    for (y = 1; y <= H; y++) {
      raw(x, flatY + y, oz, COBBLE);
      if (x < ox + 7 || x > ox + 8) raw(x, flatY + y, oz + W - 1, COBBLE);
    }
  }
  for (z = oz; z < oz + W; z++) {
    for (y = 1; y <= H; y++) {
      raw(ox,         flatY + y, z, COBBLE);
      raw(ox + W - 1, flatY + y, z, COBBLE);
    }
  }

  // 四角塔楼（STONE，高 H+2）
  var corners = [[ox,oz],[ox+W-2,oz],[ox,oz+W-2],[ox+W-2,oz+W-2]];
  corners.forEach(function(c) {
    for (y = 1; y <= H + 2; y++) {
      raw(c[0],   flatY + y, c[1],   STONE);
      raw(c[0]+1, flatY + y, c[1],   STONE);
      raw(c[0],   flatY + y, c[1]+1, STONE);
      raw(c[0]+1, flatY + y, c[1]+1, STONE);
    }
  });

  // 中心领主石（OBSIDIAN，高出地面 2 格，3×3 台座）
  var lcx = ox + 7, lcz = oz + 7;
  for (x = lcx - 1; x <= lcx + 1; x++) {
    for (z = lcz - 1; z <= lcz + 1; z++) {
      raw(x, flatY + 1, z, STONE);
    }
  }
  raw(lcx, flatY + 2, lcz, OBSIDIAN);

  // 守卫岗位（约 55 个固定站位）
  var posts = [], ri, rj;
  for (ri = 2; ri <= 13; ri += 2) { posts.push([1, ri]); posts.push([14, ri]); }  // 西+东墙内侧 12
  for (ri = 2; ri <= 13; ri += 2) posts.push([ri, 1]);                            // 北墙 6
  for (ri = 2; ri <= 13; ri += 2) { if (ri < 6 || ri > 9) posts.push([ri, 14]); }// 南墙（跳过门）4
  posts.push([6,13]); posts.push([7,13]); posts.push([8,13]); posts.push([9,13]); // 城门口 4
  posts.push([1,1]); posts.push([14,1]); posts.push([1,14]); posts.push([14,14]); // 四角 4
  for (ri = 5; ri <= 9; ri++) { posts.push([ri, 5]); posts.push([ri, 9]); }       // 领主石外环 10
  for (ri = 6; ri <= 8; ri++) { posts.push([5, ri]); posts.push([9, ri]); }       // 领主石侧环 6
  for (ri = 3; ri <= 11; ri += 4) {                                                // 内部网格 9
    for (rj = 3; rj <= 11; rj += 4) posts.push([ri, rj]);
  }
  // 总计 55 岗位

  // 重建区块网格（批量，每块只重建一次）
  var k, cd; for (k in dirty) { cd = dirty[k]; rebuildChunk(cd[0], cd[1]); }

  _enemyStrongholdPos = { x: lcx, y: flatY + 2, z: lcz, ox: ox, oz: oz, posts: posts };
}

// ── MC 风格村庄生成 ───────────────────────────────────────────────────────────
// 在 (ox, oz) 处生成一个 36×36 格的 MC 风格村庄
// 包含：4 栋建筑（小屋×2、大屋、铁匠铺）+ 中心水井 + 十字路 + 村民 NPC
function placeVillage(ox, oz) {
  var dirty = {};
  function ec(cx, cz) {
    var k = ckey(cx, cz);
    if (!chunks[k]) chunks[k] = { data: genTerrain(cx, cz), mesh: null };
    dirty[k] = [cx, cz];
  }
  function raw(wx, wy, wz, id) {
    if (wy < 0 || wy >= CHUNK_H) return;
    var cx = Math.floor(wx / CHUNK_W), cz = Math.floor(wz / CHUNK_D);
    ec(cx, cz);
    var lx = ((wx % CHUNK_W) + CHUNK_W) % CHUNK_W;
    var lz = ((wz % CHUNK_D) + CHUNK_D) % CHUNK_D;
    chunks[ckey(cx, cz)].data[lx + wy * CHUNK_W + lz * CHUNK_W * CHUNK_H] = id;
  }

  var baseY = SEA + 2;  // 14
  var x, z, y;

  // 1. 整平地形（36×36 范围清空地表以上，地面填 GRASS）
  for (x = ox; x < ox + 36; x++) {
    for (z = oz; z < oz + 36; z++) {
      for (y = baseY + 1; y < baseY + 14; y++) raw(x, y, z, AIR);
      raw(x, baseY, z, GRASS);
    }
  }

  // 2. 十字形主路（2 格宽，COBBLE 铺面）
  for (x = ox; x < ox + 36; x++) {
    raw(x, baseY, oz + 17, COBBLE);
    raw(x, baseY, oz + 18, COBBLE);
  }
  for (z = oz; z < oz + 36; z++) {
    raw(ox + 17, baseY, z, COBBLE);
    raw(ox + 18, baseY, z, COBBLE);
  }

  // 3. 中心水井（路口处，3×3 外环 COBBLE，2 格高，四角 WOOD 柱）
  var wcx = ox + 17, wcz = oz + 17;
  var wdx, wdz;
  for (wdx = wcx - 1; wdx <= wcx + 1; wdx++) {
    for (wdz = wcz - 1; wdz <= wcz + 1; wdz++) {
      if (wdx === wcx && wdz === wcz) continue;  // 中心留空（井口）
      raw(wdx, baseY + 1, wdz, COBBLE);
      raw(wdx, baseY + 2, wdz, COBBLE);
    }
  }
  // 四角 OAK_LOG 立柱
  raw(wcx - 1, baseY + 3, wcz - 1, WOOD);
  raw(wcx + 1, baseY + 3, wcz - 1, WOOD);
  raw(wcx - 1, baseY + 3, wcz + 1, WOOD);
  raw(wcx + 1, baseY + 3, wcz + 1, WOOD);

  // ── 内联建筑器（避免 ES5 全局函数命名冲突）──
  // 放置一栋房子：hx/hz 为西南角，hw×hd 为宽深（含外墙）
  // isSmith=true 时放置铁匠铺内饰（FURNACE + CRAFTING_TABLE）
  function _house(hx, hz, hw, hd, isSmith) {
    var hx2 = hx + hw - 1, hz2 = hz + hd - 1;
    var fx, fz, wy2;
    // 地基（COBBLE）+ 地板（PLANKS）
    for (fx = hx; fx <= hx2; fx++) {
      for (fz = hz; fz <= hz2; fz++) {
        raw(fx, baseY,     fz, COBBLE);
        raw(fx, baseY + 1, fz, PLANKS);
      }
    }
    // 四面墙（PLANKS，高 3 格）
    for (wy2 = baseY + 2; wy2 <= baseY + 4; wy2++) {
      for (fx = hx; fx <= hx2; fx++) {
        raw(fx, wy2, hz,  PLANKS);
        raw(fx, wy2, hz2, PLANKS);
      }
      for (fz = hz + 1; fz <= hz2 - 1; fz++) {
        raw(hx,  wy2, fz, PLANKS);
        raw(hx2, wy2, fz, PLANKS);
      }
    }
    // 玻璃窗（中间高度 baseY+3，每侧 1 格）
    raw(hx,  baseY + 3, hz + Math.floor(hd * 0.5), GLASS);
    raw(hx2, baseY + 3, hz + Math.floor(hd * 0.5), GLASS);
    raw(hx  + Math.floor(hw * 0.5), baseY + 3, hz,  GLASS);
    // 南面门洞（2 格高，中间位置）
    var doorX = hx + Math.floor(hw * 0.5);
    raw(doorX, baseY + 2, hz2, AIR);
    raw(doorX, baseY + 3, hz2, AIR);
    // 屋顶：外框 OAK_LOG，内部 PLANKS
    for (fx = hx; fx <= hx2; fx++) {
      for (fz = hz; fz <= hz2; fz++) {
        var isEdge = (fx === hx || fx === hx2 || fz === hz || fz === hz2);
        raw(fx, baseY + 5, fz, isEdge ? WOOD : PLANKS);
      }
    }
    // 铁匠铺内饰
    if (isSmith) {
      raw(hx + 1, baseY + 2, hz + 1, FURNACE);
      raw(hx + 2, baseY + 2, hz + 1, CRAFTING_TABLE);
    }
  }

  // 4. 四栋建筑（各象限）
  _house(ox + 3,  oz + 3,  10, 9,  false);   // 西北小屋
  _house(ox + 22, oz + 3,  10, 9,  false);   // 东北小屋
  _house(ox + 3,  oz + 22, 11, 11, true);    // 西南铁匠铺
  _house(ox + 22, oz + 22, 11, 11, false);   // 东南大屋（多放 BOOKSHELF）

  // 东南大屋书架
  raw(ox + 23, baseY + 2, oz + 23, BOOKSHELF);
  raw(ox + 24, baseY + 2, oz + 23, BOOKSHELF);

  // 5. 重建所有脏区块
  var k, cd;
  for (k in dirty) { cd = dirty[k]; rebuildChunk(cd[0], cd[1]); }

  // 6. 生成村民 NPC（建筑放置完才能保证地形正确）
  if (typeof spawnVillager === 'function') {
    spawnVillager('farmer',   ox + 8,  oz + 8);
    spawnVillager('merchant', ox + 27, oz + 8);
    spawnVillager('guard',    ox + 18, oz + 18);
    spawnVillager('farmer',   ox + 8,  oz + 27);
  }
}

    grp.add(body);
    var stem = new THREE.Mesh(
      new THREE.CylinderGeometry(0.028, 0.04, 0.13, 5),
      new THREE.MeshLambertMaterial({ color: 0x6b3d10 })
    );
    stem.position.y = 0.44 * 0.72 + 0.065;
    grp.add(stem);
  } else if (typeId === FURNITURE_PUMPKIN) {
    // 南瓜：6 瓣橙球 + 绿色瓜蒂
    var pmat = new THREE.MeshLambertMaterial({ color: 0xe07010 });
    for (var li = 0; li < 6; li++) {
      var la = (li / 6) * Math.PI * 2;
      var lobe = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 6), pmat);
      lobe.position.set(Math.cos(la) * 0.14, 0, Math.sin(la) * 0.14);
      lobe.scale.set(0.95, 0.80, 0.95);
      grp.add(lobe);
    }
    var pstem = new THREE.Mesh(
      new THREE.CylinderGeometry(0.035, 0.055, 0.18, 6),
      new THREE.MeshLambertMaterial({ color: 0x4a7a30 })
    );
    pstem.position.y = 0.28 * 0.80 + 0.08;
    grp.add(pstem);
  }
  // 脚底对齐（bbox.min.y → 0）
  grp.updateMatrixWorld(true);
  var bb = new THREE.Box3().setFromObject(grp);
  var dy = -bb.min.y;
  for (var ci = 0; ci < grp.children.length; ci++) {
    grp.children[ci].position.y += dy;
  }
  grp.userData.fHeight = bb.max.y - bb.min.y;
  return grp;
}

// 克隆并脚底对齐模型（placeFurniture 与幽灵共用）
function _cloneFurnitureModel(def) {
  if (def.procedural) return _makeProceduralModel(def.id);
  var g = _furnitureGltf[def.file];
  if (!g) return null;
  var model = g.scene.clone(true);
  model.scale.setScalar(def.scale);
  if (def.flip) model.rotation.x = Math.PI;  // 架子 GLB 桌面朝下，翻转修正
  model.updateMatrixWorld(true);
  var bbox = new THREE.Box3().setFromObject(model);
  model.position.y = -bbox.min.y;
  model.userData.fHeight = bbox.max.y - bbox.min.y;  // 模型高度（灯泡/光源定位用）
  return model;
}

// 加载所有家具 GLTF（首次放置或启动时调）
function loadFurnitureModels(onDone) {
  if (_furnitureLoaded) { if (onDone) onDone(); return; }
  var names = [], seen = {}, i;
  for (i = 0; i < FURNITURE_DEFS.length; i++) {
    var fn = FURNITURE_DEFS[i].file;
    if (!fn || FURNITURE_DEFS[i].procedural) continue;  // 程序化模型无需加载 GLB
    if (!seen[fn]) { seen[fn] = 1; names.push(fn); }
  }
  var done = 0, total = names.length;
  if (total === 0) { _furnitureLoaded = true; if (onDone) onDone(); return; }
  names.forEach(function (name) {
    gltfLoader.load('assets/models/furniture/' + name + '.glb', function (g) {
      _furnitureGltf[name] = g;
      if (++done === total) { _furnitureLoaded = true; if (onDone) onDone(); }
    }, undefined, function () {
      if (++done === total) { _furnitureLoaded = true; if (onDone) onDone(); }
    });
  });
}

// 在世界坐标放置一件家具（wx/wy/wz = 方块坐标，yaw 可选）
function placeFurniture(typeId, wx, wy, wz, yaw) {
  var def = _furnitureDefById(typeId);
  if (!def) return null;
  var model = _cloneFurnitureModel(def);
  if (!model) return null;

  if (yaw === undefined) {
    yaw = (typeof player !== 'undefined') ? player.yaw + Math.PI : 0;
  }

  var group = new THREE.Group();
  group.add(model);
  group.position.set(wx + 0.5, wy, wz + 0.5);
  group.rotation.y = yaw;
  scene.add(group);

  // 落地灯 / 台灯：伪造暖光（发光灯泡 + 地面暖光圈 + 点光源）
  var glow = null;
  if (isFurnitureLamp(typeId)) {
    // 灯泡/光源高度跟随模型实际高度的 85%（落地灯高、台灯矮，灯泡都落在灯罩处）
    var lampH = model.userData.fHeight || 2.0;
    var bulbY = lampH * 0.85;
    glow = new THREE.Group();
    // 发光灯泡（BasicMaterial 不受昼夜亮度影响，夜里自然醒目）
    var bulb = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xfff0c0 })
    );
    bulb.position.set(0, bulbY, 0);
    glow.add(bulb);
    // 地面暖光圈（半透明叠加，像一圈光池）
    var pool = new THREE.Mesh(
      new THREE.CircleGeometry(1.2, 16),
      new THREE.MeshBasicMaterial({ color: 0xfff0c0, transparent: true, opacity: 0.18, depthWrite: false })
    );
    pool.rotation.x = -Math.PI / 2;
    pool.position.y = 0.02;
    glow.add(pool);
    // 点光源（作用于受光的家具/角色模型）
    var ptLight = new THREE.PointLight(0xfff0c0, 1.8, 8);
    ptLight.position.set(0, bulbY, 0);
    glow.add(ptLight);
    group.add(glow);
  }

  // 计算旋转后世界 AABB 占据格（地毯/极扁家具不阻挡）
  group.updateMatrixWorld(true);
  var wbox = new THREE.Box3().setFromObject(group);
  var cells = [];
  var _hgt = wbox.max.y - wbox.min.y;
  var _isRug = (typeId === FURNITURE_RUG || typeId === FURNITURE_RUG_OVAL || typeId === FURNITURE_RUG_B);
  if (!_isRug && _hgt >= 0.4) {
    for (var _cx = Math.floor(wbox.min.x); _cx <= Math.floor(wbox.max.x - 0.001); _cx++)
      for (var _cz = Math.floor(wbox.min.z); _cz <= Math.floor(wbox.max.z - 0.001); _cz++)
        for (var _cy = Math.floor(wbox.min.y); _cy <= Math.floor(wbox.max.y - 0.001); _cy++)
          cells.push(_cx + ',' + _cy + ',' + _cz);
  }

  var entry = {
    id: _furnitureSeq++, typeId: typeId,
    x: wx, y: wy, z: wz, yaw: yaw,
    group: group, glow: glow, on: true, cells: cells
  };
  _furniturePlaced.push(entry);
  _markFurnitureSolid(entry, true);
  return entry;
}

// 开关落地灯（切换暖光子组显隐 + 状态）
function toggleLamp(entry) {
  if (!entry) return;
  entry.on = !entry.on;
  if (entry.glow) entry.glow.visible = entry.on;
}

// ── 摆放幽灵预览 ────────────────────────────────────────────────────────────────
// 选中家具时显示半透明幽灵，跟随准星，🔄 按钮旋转，📦 确认放置
function rotateFurnitureGhost() {
  _ghostYaw += Math.PI / 2;
  if (_ghostYaw >= Math.PI * 2) _ghostYaw -= Math.PI * 2;
}

function disposeFurnitureGhost() {
  if (!_furnitureGhost) return;
  scene.remove(_furnitureGhost);
  _furnitureGhost.traverse(function (o) {
    if (o.isMesh) {
      if (o.geometry) o.geometry.dispose();
      if (o.material) o.material.dispose();
    }
  });
  _furnitureGhost = null;
  _ghostTypeId = 0;
}

// 每帧调用：typeId 变化才重建克隆，否则只更新位置/朝向
function updateFurnitureGhost(typeId, wx, wy, wz, yaw, visible) {
  if (!visible || !typeId) {
    if (_furnitureGhost) _furnitureGhost.visible = false;
    return;
  }
  var def = _furnitureDefById(typeId);
  var _modelReady = def && (def.procedural || !!_furnitureGltf[def.file]);
  if (!_modelReady) {
    // 模型未就绪 → 隐藏，待 GLB 加载完下帧自然出现
    if (_furnitureGhost) _furnitureGhost.visible = false;
    return;
  }
  if (typeId !== _ghostTypeId) {
    disposeFurnitureGhost();
    var model = _cloneFurnitureModel(def);
    if (!model) return;
    // 克隆每个 mesh 材质后改半透明（不能共享，否则污染真实家具材质）
    model.traverse(function (o) {
      if (o.isMesh && o.material) {
        o.material = o.material.clone();
        o.material.transparent = true;
        o.material.opacity = 0.45;
        o.material.depthWrite = false;
      }
    });
    var grp = new THREE.Group();
    grp.add(model);
    scene.add(grp);
    _furnitureGhost = grp;
    _ghostTypeId = typeId;
  }
  _furnitureGhost.position.set(wx + 0.5, wy, wz + 0.5);
  _furnitureGhost.rotation.y = yaw;
  _furnitureGhost.visible = true;
}

// 按记录 id 移除家具
function removeFurnitureById(fid) {
  for (var i = _furniturePlaced.length - 1; i >= 0; i--) {
    if (_furniturePlaced[i].id === fid) {
      _markFurnitureSolid(_furniturePlaced[i], false);
      scene.remove(_furniturePlaced[i].group);
      _furniturePlaced.splice(i, 1);
      return true;
    }
  }
  return false;
}

// 序列化供 save.js 调用
function serializeFurniture() {
  return _furniturePlaced.map(function (f) {
    return { typeId: f.typeId, x: f.x, y: f.y, z: f.z, yaw: f.yaw, on: f.on };
  });
}

// 反序列化（读档时调用，需先 loadFurnitureModels）
function deserializeFurniture(arr) {
  if (!arr || !arr.length) return;
  arr.forEach(function (f) {
    var en = placeFurniture(f.typeId, f.x, f.y, f.z, f.yaw);
    if (en && f.on === false) toggleLamp(en);   // 旧档无 on → 默认开，向后兼容
  });
}

// ── 3D Billboard 倒计时标签 ───────────────────────────────────────────────────
function _makeTimerSprite(text, isMature) {
  var c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  var ctx = c.getContext('2d');
  ctx.fillStyle = isMature ? 'rgba(40,180,60,0.90)' : 'rgba(0,0,0,0.70)';
  if (ctx.roundRect) {
    ctx.beginPath();
    ctx.roundRect(4, 12, 248, 40, 14);
    ctx.fill();
  } else {
    ctx.fillRect(4, 12, 248, 40);
  }
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 24px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 32);
  var tex = new THREE.CanvasTexture(c);
  var mat = new THREE.SpriteMaterial({ map: tex, depthTest: false });
  var sp = new THREE.Sprite(mat);
  sp.scale.set(2.0, 0.5, 1);
  return sp;
}

function _getSpriteText(entry) {
  var def = CROP_DEFS[entry.typeId];
  var maxStage = def.stages.length - 1;
  if (entry.stage >= maxStage) return { text: '✅ 成熟', mature: true };
  var stageDur = def.growTime / maxStage;
  var rem = Math.ceil(stageDur - entry.elapsed);
  var stageName = entry.stage === 0 ? '🌱幼苗' : '🌿生长';
  return { text: stageName + ' · ' + rem + 's', mature: false };
}

function _updateEntrySprite(key, entry) {
  var def = CROP_DEFS[entry.typeId];
  var parts = key.split(',');
  var wx = +parts[0], wy = +parts[1], wz = +parts[2];
  var labelY = wy + def.targetH + 0.6;

  var info = _getSpriteText(entry);

  if (entry.sprite) {
    // 复用 sprite，只重绘纹理
    var mat = entry.sprite.material;
    var c = mat.map.image;
    var ctx = c.getContext('2d');
    ctx.clearRect(0, 0, 256, 64);
    ctx.fillStyle = info.mature ? 'rgba(40,180,60,0.90)' : 'rgba(0,0,0,0.70)';
    if (ctx.roundRect) {
      ctx.beginPath();
      ctx.roundRect(4, 12, 248, 40, 14);
      ctx.fill();
    } else {
      ctx.fillRect(4, 12, 248, 40);
    }
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(info.text, 128, 32);
    mat.map.needsUpdate = true;
    entry.sprite.position.set(wx + 0.5, labelY, wz + 0.5);
  } else {
    var sp = _makeTimerSprite(info.text, info.mature);
    sp.position.set(wx + 0.5, labelY, wz + 0.5);
    entry.sprite = sp;
    if (scene) scene.add(sp);
  }
}

function _removeEntrySprite(entry) {
  if (!entry.sprite) return;
  if (scene) scene.remove(entry.sprite);
  entry.sprite.material.map.dispose();
  entry.sprite.material.dispose();
  entry.sprite = null;
}

// ── GLB 加载 ──────────────────────────────────────────────────────────────────
function _loadCropModel(filename, cb) {
  if (_cropGltf[filename]) { cb(); return; }
  gltfLoader.load('assets/models/crops/' + filename + '.glb', function (g) {
    _cropGltf[filename] = g.scene;

    // 成熟阶段（_4）加载时根据 BBox 计算 def.scale = targetH / 模型高度
    if (filename.slice(-2) === '_4') {
      var bb = new THREE.Box3().setFromObject(g.scene);
      var h = bb.max.y - bb.min.y;
      if (h > 0.01) {
        for (var tid in CROP_DEFS) {
          if (!CROP_DEFS.hasOwnProperty(tid)) continue;
          var d = CROP_DEFS[tid];
          if (d.stages && d.stages[d.stages.length - 1] === filename) {
            d.scale = d.targetH / h;
            break;
          }
        }
      }
    }
    cb();
  });
}

// 双色调材质：按 mesh 中心 Y 占模型总高的比例决定用顶色还是底色。
// GLTF 原始颜色不可用（obj2gltf 颜色空间问题导致全黑），改用 _CROP_2COL 表。
function _makeCropModel(typeId, filename) {
  var src = _cropGltf[filename];
  if (!src) return null;
  var def = CROP_DEFS[typeId];
  var model = src.clone(true);

  var sc = def.scale || (def.targetH > 1.5 ? 0.50 : 0.85);
  model.scale.setScalar(sc);

  var pal = _CROP_2COL[typeId];
  var topColor = pal ? new THREE.Color(pal[0]) : new THREE.Color(BCOL[typeId][0], BCOL[typeId][1], BCOL[typeId][2]);
  var botColor = pal ? new THREE.Color(pal[1]) : topColor;

  // 先算整体包围盒（已缩放后）
  var bb = new THREE.Box3().setFromObject(model);
  var totalH = bb.max.y - bb.min.y;
  var minY   = bb.min.y;

  model.traverse(function (child) {
    if (!child.isMesh) return;
    var meshBB = new THREE.Box3().setFromObject(child);
    var centerY = (meshBB.min.y + meshBB.max.y) * 0.5;
    var relY = totalH > 0.01 ? (centerY - minY) / totalH : 0.5;
    var col = (relY < 0.30) ? botColor.clone() : topColor.clone();
    child.material = new THREE.MeshLambertMaterial({ color: col });
  });
  return model;
}

function _setCropStageModel(key, entry) {
  if (entry.group && scene) { scene.remove(entry.group); entry.group = null; }
  var def = CROP_DEFS[entry.typeId];
  var filename = def.stages[entry.stage];
  var parts = key.split(',');
  var wx = +parts[0], wy = +parts[1], wz = +parts[2];

  _loadCropModel(filename, function () {
    if (!_cropPlaced[key]) return;
    var model = _makeCropModel(entry.typeId, filename);
    if (!model) return;
    model.position.set(wx + 0.5, wy, wz + 0.5);
    entry.group = model;
    if (scene) scene.add(model);
  });
}

// ── 公开 API ──────────────────────────────────────────────────────────────────
function plantCrop(typeId, wx, wy, wz) {
  if (!CROP_DEFS[typeId]) return;
  var key = wx + ',' + wy + ',' + wz;
  if (_cropPlaced[key]) return;
  var entry = { typeId: typeId, stage: 0, elapsed: 0, group: null, sprite: null };
  _cropPlaced[key] = entry;
  _setCropStageModel(key, entry);
  _updateEntrySprite(key, entry);
}

var _timerT = 0;

function updateCrops(dt) {
  _timerT += dt;
  var doTimer = (_timerT >= 0.5);
  if (doTimer) _timerT = 0;

  for (var key in _cropPlaced) {
    if (!_cropPlaced.hasOwnProperty(key)) continue;
    var entry = _cropPlaced[key];
    var def = CROP_DEFS[entry.typeId];
    if (entry.stage < def.stages.length - 1) {
      entry.elapsed += dt;
      var stageDur = def.growTime / (def.stages.length - 1);
      while (entry.elapsed >= stageDur && entry.stage < def.stages.length - 1) {
        entry.elapsed -= stageDur;
        entry.stage++;
        _setCropStageModel(key, entry);
      }
    }
  }

  if (doTimer) {
    for (var k in _cropPlaced) {
      if (_cropPlaced.hasOwnProperty(k)) _updateEntrySprite(k, _cropPlaced[k]);
    }
  }
}

function nearestMatureCrop(px, py, pz, radius) {
  var best = null, bestD = radius * radius;
  for (var key in _cropPlaced) {
    if (!_cropPlaced.hasOwnProperty(key)) continue;
    var e = _cropPlaced[key];
    if (e.stage < CROP_DEFS[e.typeId].stages.length - 1) continue;
    var parts = key.split(',');
    var dx = +parts[0] + 0.5 - px, dy = +parts[1] - py, dz = +parts[2] + 0.5 - pz;
    var d2 = dx*dx + dy*dy*0.5 + dz*dz;
    if (d2 < bestD) { bestD = d2; best = key; }
  }
  return best;
}

function harvestCrop(wx, wy, wz) {
  var key = wx + ',' + wy + ',' + wz;
  var entry = _cropPlaced[key];
  if (!entry) return 0;
  var def = CROP_DEFS[entry.typeId];
  var mature = (entry.stage >= def.stages.length - 1);
  if (entry.group && scene) scene.remove(entry.group);
  _removeEntrySprite(entry);
  delete _cropPlaced[key];
  return mature ? entry.typeId : 0;
}

function isCropSeed(id) { return !!CROP_DEFS[id]; }

function serializeCrops() {
  var arr = [];
  for (var key in _cropPlaced) {
    if (!_cropPlaced.hasOwnProperty(key)) continue;
    var e = _cropPlaced[key];
    arr.push([key, e.typeId, e.stage, Math.round(e.elapsed * 100) / 100]);
  }
  return arr;
}

function deserializeCrops(arr) {
  if (!arr) return;
  for (var i = 0; i < arr.length; i++) {
    var item = arr[i];
    var key = item[0];
    var entry = { typeId: item[1], stage: item[2], elapsed: item[3] || 0, group: null, sprite: null };
    _cropPlaced[key] = entry;
    _setCropStageModel(key, entry);
    _updateEntrySprite(key, entry);
  }
}


// ═══ src/vehicles.js ═══
// ─── vehicles.js ──────────────────────────────────────────────────────────────
// 载具系统：放置/驾驶汽车（轿车/越野车/皮卡）
// GLB 文件放在 assets/models/vehicles/（可选，无文件时退化为彩色方块）

var VEH_CAR    = 301;  // 🚗轿车   → KayKit car_sedan
var VEH_TAXI   = 302;  // 🚕出租车 → KayKit car_taxi
var VEH_POLICE = 303;  // 🚓警车   → KayKit car_police

BNAMES[VEH_CAR]    = '🚗轿车';
BNAMES[VEH_TAXI]   = '🚕出租车';
BNAMES[VEH_POLICE] = '🚓警车';
BCOL[VEH_CAR]    = [0.20,0.40,0.90, 0.20,0.40,0.90, 0.20,0.40,0.90];
BCOL[VEH_TAXI]   = [0.95,0.80,0.10, 0.95,0.80,0.10, 0.95,0.80,0.10];
BCOL[VEH_POLICE] = [0.20,0.25,0.55, 0.20,0.25,0.55, 0.20,0.25,0.55];

// gltf = assets/models/vehicles/ 下的 KayKit City Builder Bits 模型（CC0）
// w/h/d = 占位方块半尺寸（格），仅在模型未加载时使用。
var _VEHICLE_DEFS = {};
_VEHICLE_DEFS[VEH_CAR]    = { name:'🚗轿车',   gltf:'car_sedan.gltf',  speed:16, turnSpd:2.0, color:0x3366cc, w:0.45, h:0.30, d:0.85, scaleW:2.0 };
_VEHICLE_DEFS[VEH_TAXI]   = { name:'🚕出租车', gltf:'car_taxi.gltf',   speed:15, turnSpd:1.9, color:0xf2cc1a, w:0.45, h:0.32, d:0.85, scaleW:2.0 };
_VEHICLE_DEFS[VEH_POLICE] = { name:'🚓警车',   gltf:'car_police.gltf', speed:17, turnSpd:2.0, color:0x33408c, w:0.45, h:0.31, d:0.85, scaleW:2.0 };

// placed vehicles: key → { typeId, key, cx, cy, cz, yaw, group }
// cx/cy/cz = world-space center (float), updated every frame while mounted
var _vehiclePlaced = {};
var _mountedVehicle = null;  // entry object from _vehiclePlaced, or null

// 驾驶按钮状态（被 drive-ui 的 touchstart/touchend 更新）
var _driveSteer     = 0;      // 模拟量 -1.0~+1.0（转向摇杆）
var _driveGas       = 0;      // 1=踩油门 0=松开
var _driveBrake     = 0;      // 1=刹车/倒车 0=松开
var _driveHandbrake = 0;      // 1=手刹按下（漂移）
var _driveAuto      = false;  // 自动驾驶（持续油门，无需按油门键）
var _driveCamYaw    = 0;      // 相机朝向（平滑跟随车头，制造"车在转"的观感）
var _driveUIBound   = false;
var _camIntro = { d: 6.0, h: 3.2 };  // 追车相机距离/高度（上车时 GSAP 缓动入场）
var _spObj = { v: 0 }, _spQuick = null;  // 速度表数字滚动（gsap.quickTo）
// _hasGsap 在 init.js 定义（全局共享）

// 按钮按下/抬起的 GSAP 缩放反馈
function _pressFX(el, down) {
  if (!_hasGsap) return;
  gsap.to(el, { scale: down ? 0.88 : 1, duration: down ? 0.08 : 0.32,
                ease: down ? 'power2.out' : 'back.out(2.2)', overwrite: true });
}

function _initDriveUI() {
  if (_driveUIBound) return;
  _driveUIBound = true;

  // ── 长按辅助（油门/刹车/手刹）──
  function hold(el, onStart, onEnd) {
    if (!el) return;
    el.addEventListener('touchstart',  function(e){ e.preventDefault(); onStart(); _pressFX(el, true);  }, { passive:false });
    el.addEventListener('touchend',    function(e){ e.preventDefault(); onEnd();   _pressFX(el, false); }, { passive:false });
    el.addEventListener('touchcancel', function(e){ e.preventDefault(); onEnd();   _pressFX(el, false); }, { passive:false });
  }
  hold(document.getElementById('d-gas'),   function(){ _driveGas       = 1; }, function(){ _driveGas       = 0; });
  hold(document.getElementById('d-brake'), function(){ _driveBrake     = 1; }, function(){ _driveBrake     = 0; });
  hold(document.getElementById('d-hb'),    function(){ _driveHandbrake = 1; }, function(){ _driveHandbrake = 0; });

  // ── 模拟转向摇杆（X 轴 = 转向，-1.0 ~ +1.0）──
  var _djRing = document.getElementById('d-steer-ring');
  var _djKnob = document.getElementById('d-steer-knob');
  var _djId = -1, _djOx = 0, _djOy = 0, _DJ_R = 36;
  function _djUpdate(cx, cy) {
    var dx = cx - _djOx, dy = cy - _djOy;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var s = dist > _DJ_R ? _DJ_R / dist : 1;
    var nx = dx * s, ny = dy * s;
    _driveSteer = nx / _DJ_R;
    if (_djKnob) {
      if (_hasGsap) gsap.to(_djKnob, { x: nx, y: ny, duration: 0.04, overwrite: true });
      else _djKnob.style.transform = 'translate(calc(-50% + ' + nx + 'px),calc(-50% + ' + ny + 'px))';
    }
  }
  function _djReset() {
    _driveSteer = 0; _djId = -1;
    if (_djKnob) {
      if (_hasGsap) gsap.to(_djKnob, { x: 0, y: 0, duration: 0.25, ease: 'elastic.out(1,0.5)', overwrite: true });
      else _djKnob.style.transform = 'translate(-50%,-50%)';
    }
  }
  if (_djRing) {
    _djRing.addEventListener('touchstart', function(e) {
      e.preventDefault();
      var t = e.changedTouches[0]; _djId = t.identifier;
      var r = _djRing.getBoundingClientRect();
      _djOx = r.left + r.width / 2; _djOy = r.top + r.height / 2;
      _djUpdate(t.clientX, t.clientY);
    }, { passive: false });
    _djRing.addEventListener('touchmove', function(e) {
      e.preventDefault();
      for (var i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === _djId)
          _djUpdate(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
      }
    }, { passive: false });
    _djRing.addEventListener('touchend',    function(e) { e.preventDefault(); _djReset(); }, { passive: false });
    _djRing.addEventListener('touchcancel', function(e) { e.preventDefault(); _djReset(); }, { passive: false });
  }

  // ── 自动驾驶切换（点击切换，持续油门）──
  var autoBtn = document.getElementById('d-auto');
  if (autoBtn) {
    autoBtn.addEventListener('touchstart', function(e) {
      e.preventDefault();
      _driveAuto = !_driveAuto;
      autoBtn.classList.toggle('active', _driveAuto);
      _pressFX(autoBtn, true);
    }, { passive: false });
    autoBtn.addEventListener('touchend', function(e) { e.preventDefault(); _pressFX(autoBtn, false); }, { passive: false });
  }

  // ── 下车按钮 ──
  var ex = document.getElementById('d-exit');
  if (ex) {
    ex.addEventListener('touchstart', function(e){ e.preventDefault(); _pressFX(ex, true); }, { passive:false });
    ex.addEventListener('touchend',   function(e){ e.preventDefault(); _pressFX(ex, false); dismountVehicle(); }, { passive:false });
  }
}

function isVehicleId(id) { return id >= 301 && id <= 303; }

// 用基本几何体拼一辆车：底盘 + 车厢 + 4 轮。返回 Group（脚部对齐 y=0）。
function _buildCarMesh(def) {
  var g = new THREE.Group();
  var bodyMat = new THREE.MeshLambertMaterial({ color: def.color });
  var darkMat = new THREE.MeshLambertMaterial({ color: 0x222228 });
  var glassMat = new THREE.MeshLambertMaterial({ color: 0x88bbdd });

  var W = def.w * 2, H = def.h * 2, D = def.d * 2;
  var wheelR = def.h * 0.45;

  // 底盘（主车身）
  var chassis = new THREE.Mesh(new THREE.BoxGeometry(W, H * 0.6, D), bodyMat);
  chassis.position.y = wheelR + H * 0.3;
  g.add(chassis);

  // 车厢（驾驶室，略窄略短，靠后）
  var cabin = new THREE.Mesh(new THREE.BoxGeometry(W * 0.8, H * 0.55, D * 0.5), glassMat);
  cabin.position.set(0, wheelR + H * 0.6 + H * 0.275, -D * 0.05);
  g.add(cabin);

  // 4 个轮子（圆柱，横向放置）
  var wheelGeo = new THREE.CylinderGeometry(wheelR, wheelR, W * 0.18, 12);
  var wx2 = W * 0.5 + W * 0.02, wz2 = D * 0.32;
  var offs = [[wx2, wz2], [-wx2, wz2], [wx2, -wz2], [-wx2, -wz2]];
  for (var i = 0; i < offs.length; i++) {
    var wh = new THREE.Mesh(wheelGeo, darkMat);
    wh.rotation.z = Math.PI / 2;
    wh.position.set(offs[i][0], wheelR, offs[i][1]);
    g.add(wh);
  }
  return g;
}

function nearestVehicle(px, py, pz, radius) {
  var best = null, bestD2 = radius * radius;
  for (var k in _vehiclePlaced) {
    var e = _vehiclePlaced[k];
    var dx = e.cx - px, dz = e.cz - pz;
    var d2 = dx * dx + dz * dz;
    if (d2 < bestD2) { bestD2 = d2; best = k; }
  }
  return best;
}

function placeVehicle(typeId, wx, wy, wz, yaw) {
  var def = _VEHICLE_DEFS[typeId];
  if (!def) return null;
  var key = wx + ',' + wy + ',' + wz;
  var grp = new THREE.Group();

  // Placeholder car shape (底盘+车厢+4轮) shown until / if GLB loads
  var body = _buildCarMesh(def);
  grp.add(body);

  grp.position.set(wx + 0.5, wy, wz + 0.5);
  grp.rotation.y = yaw || 0;
  scene.add(grp);

  var entry = { typeId: typeId, key: key, cx: wx + 0.5, cy: wy, cz: wz + 0.5,
                yaw: yaw || 0, group: grp };
  _vehiclePlaced[key] = entry;

  // Async load real KayKit model; keep textured material. Falls back to placeholder on error.
  if (typeof gltfLoader !== 'undefined' && def.gltf) {
    gltfLoader.load('assets/models/vehicles/' + def.gltf, function(gltf) {
      grp.remove(body);
      var model = gltf.scene;
      var bb = new THREE.Box3().setFromObject(model);
      var modelW = bb.max.x - bb.min.x;
      var s = (def.scaleW || 1.0) / (modelW > 0.01 ? modelW : 1);
      model.scale.setScalar(s);
      bb.setFromObject(model);
      model.position.y = -bb.min.y;          // 轮子落地
      model.rotation.y = Math.PI;            // KayKit 车头朝 +Z；游戏前进为 -Z，翻转 180°
      entry.model = model;
      grp.add(model);
    }, undefined, function() { /* asset not found – keep placeholder car shape */ });
  }
  return entry;
}

// 驾驶时需要隐藏的常规 UI（热键栏/按钮/摇杆；保留 look-zone 以支持驾驶自由视角）
function _setWalkUI(show) {
  var ids = ['btns', 'joy-zone', 'hotbar'];
  for (var i = 0; i < ids.length; i++) {
    var el = document.getElementById(ids[i]);
    if (el) el.style.display = show ? '' : 'none';
  }
}

function mountVehicle(key) {
  var entry = _vehiclePlaced[key];
  if (!entry) return;
  _mountedVehicle = entry;
  entry.speed = 0;
  _driveSteer = 0; _driveGas = 0; _driveBrake = 0; _driveHandbrake = 0; _driveAuto = false;
  _driveCamYaw = entry.yaw;
  var autoBtn = document.getElementById('d-auto');
  if (autoBtn) autoBtn.classList.remove('active');
  // Force third-person so the driving chase-cam is used
  if (typeof viewFP !== 'undefined' && viewFP && typeof toggleView === 'function') toggleView();

  _initDriveUI();
  _setWalkUI(false);
  var du = document.getElementById('drive-ui');
  if (du) du.classList.add('on');
  var sp = document.getElementById('speedo');
  if (sp) sp.classList.add('on');

  // GSAP 入场：转向摇杆从左滑入、踏板从右滑入、下车/自驾从上落下、速度表淡入
  if (_hasGsap) {
    gsap.from('#d-steer-ring', { x: -60, autoAlpha: 0, duration: 0.4, ease: 'back.out(1.7)', overwrite: true });
    gsap.from('#drive-pedals .dbtn', { x: 60, autoAlpha: 0, duration: 0.4, stagger: 0.06, ease: 'back.out(1.7)', overwrite: true });
    gsap.from('#d-exit',  { y: -40, autoAlpha: 0, duration: 0.4, ease: 'back.out(1.7)', overwrite: true });
    gsap.from('#d-auto',  { y: -30, autoAlpha: 0, duration: 0.35, ease: 'back.out(1.7)', overwrite: true, delay: 0.08 });
    if (sp) gsap.from(sp, { autoAlpha: 0, y: 10, duration: 0.3, overwrite: true });
    gsap.fromTo(_camIntro, { d: 9.5, h: 6.5 }, { d: 6.0, h: 3.2, duration: 0.7, ease: 'power3.out', overwrite: true });
  }
}

function dismountVehicle() {
  var ent = _mountedVehicle;
  _mountedVehicle = null;
  _driveSteer = 0; _driveGas = 0; _driveBrake = 0; _driveHandbrake = 0;
  _driveAuto = false;
  var _autoEl = document.getElementById('d-auto');
  if (_autoEl) _autoEl.classList.remove('active');

  // 把玩家挪到车左侧并落到地面：否则玩家留在车体内，第三人称相机被不透明车体挡住 → 黑屏
  if (ent) {
    var lx = -Math.cos(ent.yaw), lz = Math.sin(ent.yaw);  // 车体左方（与车头垂直）
    player.x = ent.cx + lx * 2.4;
    player.z = ent.cz + lz * 2.4;
    for (var gy = CHUNK_H - 1; gy >= 0; gy--) {
      if (getBlock(Math.floor(player.x), gy, Math.floor(player.z)) !== AIR) { player.y = gy + 1; break; }
    }
    player.vx = 0; player.vy = 0; player.vz = 0;
    ent.speed = 0;
    // 重置第三人称相机平滑，避免镜头从车位猛拉
    if (typeof _camDcur !== 'undefined') _camDcur = CAM_DIST;
    if (typeof _pivInit !== 'undefined') _pivInit = false;
  }

  var du = document.getElementById('drive-ui');
  var sp = document.getElementById('speedo');

  function _finish() {
    if (du) du.classList.remove('on');
    if (sp) sp.classList.remove('on');
    _setWalkUI(true);   // 恢复行走 UI → 玩家模型重新出现（game.js 控制 playerGroup 可见性）
  }
  // GSAP 退场后再恢复常规 UI
  if (_hasGsap && du) {
    gsap.to('#drive-ui .dbtn, #d-exit, #d-auto, #d-steer-ring', { autoAlpha: 0, scale: 0.6, duration: 0.22, ease: 'power2.in', overwrite: true,
      onComplete: function(){ gsap.set('#drive-ui .dbtn, #d-exit, #d-auto, #d-steer-ring', { clearProps: 'all' }); _finish(); } });
  } else {
    _finish();
  }
}

function updateVehicles(dt) {
  if (!_mountedVehicle) return;
  var def = _VEHICLE_DEFS[_mountedVehicle.typeId];
  if (!def) return;

  // 转向摇杆优先；无摇杆时 fallback 到行走摇杆（jx）
  var jx = joy.dx / JOY_R, jy = joy.dy / JOY_R;
  var jLen = Math.sqrt(jx * jx + jy * jy);
  if (jLen > 1) { jx /= jLen; jy /= jLen; }

  // 自动驾驶时视同持续按油门（手刹/倒车仍可覆盖）
  var gas   = (_driveGas || _driveAuto) ? 1 : (jy < -0.1 ? -jy : 0);   // 0..1
  var brake = _driveBrake ? 1 : (jy > 0.1 ? jy : 0);                   // 0..1
  var steer = _driveSteer || jx;                                         // -1..1

  // ── 动量模型：手刹 / 油门 / 刹车 / 滑行 ──
  var maxFwd = def.speed, maxRev = def.speed * 0.4;
  var accel  = def.speed * 1.3;
  var bDecel = def.speed * 2.4;
  var fric   = def.speed * 0.9;
  var spd = _mountedVehicle.speed || 0;

  if (_driveHandbrake) {
    // 手刹：强制快速减速，不倒车；维持高转向比以模拟漂移甩尾
    var hbFric = def.speed * 3.5;
    if (spd > 0) spd = Math.max(0, spd - hbFric * dt);
    else if (spd < 0) spd = Math.min(0, spd + hbFric * dt);
  } else if (gas) {
    spd += accel * gas * dt;
  } else if (brake) {
    if (spd > 0.3) spd -= bDecel * dt;               // 前进中先刹停
    else           spd -= accel * 0.7 * brake * dt;  // 已停 → 倒车
  } else {
    if (spd > 0) spd = Math.max(0, spd - fric * dt);
    else if (spd < 0) spd = Math.min(0, spd + fric * dt);
  }
  if (spd >  maxFwd) spd = maxFwd;
  if (spd < -maxRev) spd = -maxRev;
  _mountedVehicle.speed = spd;

  // ── 转向：手刹时维持最低 0.6 转向系数，模拟甩尾仍能大幅打方向 ──
  var speedF = Math.min(1, Math.abs(spd) / 2.5);
  if (_driveHandbrake) speedF = Math.max(0.6, speedF);
  var dir = spd >= 0 ? 1 : -1;
  _mountedVehicle.yaw -= steer * def.turnSpd * dt * speedF * dir;
  player.yaw = _mountedVehicle.yaw;

  player.vx = -Math.sin(_mountedVehicle.yaw) * spd;
  player.vz = -Math.cos(_mountedVehicle.yaw) * spd;
}

// 在 resolveAABB 之后调用：把车模型同步到玩家的权威位置，平滑相机朝向，刷新速度表
function syncMountedVehicle(dt) {
  if (!_mountedVehicle) return;
  var grp = _mountedVehicle.group;
  if (grp) {
    grp.position.set(player.x, player.y, player.z);
    grp.rotation.y = _mountedVehicle.yaw;   // 车模型立即转向 → 看得到车在转
  }
  _mountedVehicle.cx = player.x;
  _mountedVehicle.cy = player.y;
  _mountedVehicle.cz = player.z;

  // 相机朝向以最短角差平滑跟随车头（滞后 → 转弯时车体相对镜头明显旋转）
  var d = _mountedVehicle.yaw - _driveCamYaw;
  while (d >  Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  _driveCamYaw += d * Math.min(1, (dt || 0.016) * 4);

  // 速度表：用 gsap.quickTo 平滑滚动数字（适合每帧高频更新的属性）
  var spv = document.getElementById('speedo-val');
  if (spv) {
    var target = Math.sqrt(player.vx * player.vx + player.vz * player.vz) * 6;
    if (_hasGsap) {
      if (!_spQuick) {
        _spQuick = gsap.quickTo(_spObj, 'v', { duration: 0.25, ease: 'power2.out',
          onUpdate: function () { spv.textContent = Math.round(_spObj.v); } });
      }
      _spQuick(target);
    } else {
      spv.textContent = Math.round(target);
    }
  }
}


// ═══ src/train.js ═══
// ─── train.js ─────────────────────────────────────────────────────────────────
// 高铁系统：固定纵向轨道（城堡南门旁 → 道路尽头）+ 自动往返列车 + 上/下车
//
//   轨道沿 Z 轴，固定 X=RAIL_X，从 Z=RAIL_Z0（城堡站）到 Z=RAIL_Z1（南站）。
//   轨道床（STONE）由 world.js genTerrain 的 _rail 条件永久烤入地图。
//   列车（车头 + 2 节车厢）自动在两端车站之间往返，到站停靠 TRAIN_DWELL 秒。
//   玩家靠近停靠的列车时出现「🚄 上车」按钮，乘坐时跟随列车移动。
//
//   模型：Quaternius Modular Train Pack（CC0），assets/models/train/
//   对外全局：_onTrain（game.js 移动段读取，乘车时跳过行走物理）

var RAIL_X      = 12;    // 轨道固定 X（道路 wx∈[-3,8] 右侧，与道路平行）
var RAIL_Z0     =  40;   // 北端起点（城堡南门外约 25 格，避免穿城堡）
var RAIL_Z1     = 1710;  // 南端终点（铃鹿赛道中心）
var RAIL_TOP    = SEA + 3; // 轨面站立高度（轨道床顶面 y=SEA+2，+1 为地板上方）
var TRAIN_CRUISE = 30;   // 巡航速度 u/s（约 55 秒单程）
var TRAIN_ACCEL  =  8;   // 加速度 u/s²
var TRAIN_DECEL  = 10;   // 减速度 u/s²
var TRAIN_DWELL  = 20;   // 到站停靠秒数（给玩家充足时间上车）
var TRAIN_MARGIN = 12;   // 端点留白（站台范围内停车）

// ── 运行状态 ───────────────────────────────────────────────────────────────────
var _onTrain    = false;   // 玩家是否在车上（game.js 读取）
var _trainReady = false;   // 模型是否就绪
var _trainCars  = [];      // [{ group }]，index 0 = 车头
var _carSpacing = 7;       // 车厢中心间距（模型载入后按实际长度更新）
var _trainZ     = RAIL_Z0 + TRAIN_MARGIN;  // 车头当前 Z
var _trainV     = 0;       // 当前速度 u/s（正值=朝 +Z）
var _trainDir   = 1;       // +1 朝南（+Z），-1 朝北（-Z）
var _trainState = 'dwell'; // 'dwell' | 'run'
var _trainDwellT = 30;  // 初始多等 30s，让玩家有时间走到站台
var _trainBoardBtn = null;
var _trainMixers  = [];   // AnimationMixer per car

// ── 初始化（game.js boot step 9 调用）────────────────────────────────────────
function initTrain() {
  if (typeof gltfLoader === 'undefined') return;
  _buildBoardBtn();
  _buildStations();
  _buildViaduct();

  // 沿 Z 轴铺轨道瓦片
  gltfLoader.load('assets/models/train/rail_straight.glb', function (g) {
    var proto = g.scene;
    proto.updateMatrixWorld(true);
    var bb = new THREE.Box3().setFromObject(proto);
    var dx = bb.max.x - bb.min.x, dz = bb.max.z - bb.min.z;
    // 轨道需要长轴沿 Z；若模型长轴是 X 则旋转 90°
    var rotY = (dx > dz) ? Math.PI / 2 : 0;
    var segLen = Math.max(dx, dz);
    if (!(segLen > 0.3)) segLen = 2;
    var yOff = RAIL_TOP - bb.min.y;
    var n = Math.ceil((RAIL_Z1 - RAIL_Z0) / segLen) + 2;
    for (var i = 0; i < n; i++) {
      var tile = proto.clone(true);
      tile.rotation.y = rotY;
      tile.position.set(RAIL_X + 0.5, yOff, RAIL_Z0 + i * segLen + segLen / 2);
      scene.add(tile);
    }
  }, undefined, function () {});

  // 高雄轻轨：两节独立 load 确保 animations 绑定正确
  gltfLoader.load('assets/models/train/kaohsiung_lightrail.glb', function (gf) {
    _addCar(gf.scene, true, gf.animations);
    gltfLoader.load('assets/models/train/kaohsiung_lightrail.glb', function (gw) {
      _addCar(gw.scene, false, gw.animations);
      _trainReady = true;
    }, undefined, function () { _trainReady = true; });
  }, undefined, function () { _trainReady = true; });
}

var _TARGET_CAR_LEN = 35; // 每节车厢缩放目标长度（game units）

// 单节车厢：长轴对齐 Z，缩放到目标长度，脚底落轨面，播放内置动画
function _addCar(model, isFront, clips) {
  model.updateMatrixWorld(true);
  var bb = new THREE.Box3().setFromObject(model);
  var dx = bb.max.x - bb.min.x, dz = bb.max.z - bb.min.z;

  // 长轴若是 X 则旋转 90° 使长轴变 Z
  model.rotation.y = (dx > dz) ? Math.PI / 2 : 0;
  model.updateMatrixWorld(true);
  bb.setFromObject(model);

  // 缩放到目标长度
  var rawLen = bb.max.z - bb.min.z;
  if (rawLen > 0.1) {
    var s = _TARGET_CAR_LEN / rawLen;
    model.scale.multiplyScalar(s);
    model.updateMatrixWorld(true);
    bb.setFromObject(model);
  }

  // 横向/纵向居中，脚底归零
  model.position.x -= (bb.min.x + bb.max.x) / 2;
  model.position.z -= (bb.min.z + bb.max.z) / 2;
  model.position.y  = RAIL_TOP - bb.min.y;

  var carLen = bb.max.z - bb.min.z;
  if (carLen + 1 > _carSpacing) _carSpacing = carLen + 1;

  // 播放所有内置动画（保留原速度循环）
  if (clips && clips.length > 0) {
    var mixer = new THREE.AnimationMixer(model);
    for (var ci = 0; ci < clips.length; ci++) {
      mixer.clipAction(clips[ci]).play();
    }
    _trainMixers.push(mixer);
  }

  var grp = new THREE.Group();
  grp.add(model);
  scene.add(grp);
  _trainCars.push({ group: grp });
}

// 车站（Three.js 几何体）：城堡站 + 道路尽头中转站 + 铃鹿终点站
function _buildStations() {
  var stations = [
    { z: RAIL_Z0 + TRAIN_MARGIN },   // 城堡站（北）
    { z: 186 },                       // 道路尽头中转站（南 z=186）
    { z: RAIL_Z1 - TRAIN_MARGIN }    // 铃鹿赛道终点站
  ];
  for (var s = 0; s < stations.length; s++) {
    var sz = stations[s].z;
    var platMat = new THREE.MeshLambertMaterial({ color: 0xe8e0d0 });
    var postMat = new THREE.MeshLambertMaterial({ color: 0x888888 });
    var roofMat = new THREE.MeshLambertMaterial({ color: 0x4a7ab5 });
    var lineMat = new THREE.MeshLambertMaterial({ color: 0xf0c020 });

    // 月台板（4宽 × 20长）
    var plat = new THREE.Mesh(new THREE.BoxGeometry(4, 0.25, 20), platMat);
    plat.position.set(RAIL_X - 2.5, RAIL_TOP + 0.125, sz);
    scene.add(plat);

    // 安全黄线（紧靠轨道边缘）
    var line = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.05, 20), lineMat);
    line.position.set(RAIL_X - 0.6, RAIL_TOP + 0.28, sz);
    scene.add(line);

    // 遮棚立柱（6根：Z 方向每 8 格两根）
    var pz, px;
    for (pz = sz - 8; pz <= sz + 8; pz += 8) {
      for (px = 0; px < 2; px++) {
        var pc = new THREE.Mesh(new THREE.BoxGeometry(0.25, 3.2, 0.25), postMat);
        pc.position.set(RAIL_X - 1.2 - px * 2.4, RAIL_TOP + 1.85, pz);
        scene.add(pc);
      }
    }

    // 顶棚
    var roof = new THREE.Mesh(new THREE.BoxGeometry(4, 0.25, 19.5), roofMat);
    roof.position.set(RAIL_X - 2.5, RAIL_TOP + 3.375, sz);
    scene.add(roof);
  }
}

// ── 每帧主循环（game.js 每帧无条件调用）─────────────────────────────────────
function updateTrain(dt) {
  if (!_trainReady) { _updateBoardBtn(); return; }

  // 推进动画
  for (var mi = 0; mi < _trainMixers.length; mi++) _trainMixers[mi].update(dt);

  // 状态机：停靠倒计时 / 加速巡航减速进站
  if (_trainState === 'dwell') {
    _trainV = 0;
    // 玩家在候车范围内时保持停靠，不发车
    if (_canBoard() || _onTrain) {
      _trainDwellT = Math.max(_trainDwellT, 5);
    }
    _trainDwellT -= dt;
    if (_trainDwellT <= 0) _trainState = 'run';
  } else {
    var endZ   = (_trainDir > 0) ? (RAIL_Z1 - TRAIN_MARGIN) : (RAIL_Z0 + TRAIN_MARGIN);
    var remain = (endZ - _trainZ) * _trainDir;
    var stopD  = (_trainV * _trainV) / (2 * TRAIN_DECEL);
    if (remain <= stopD) {
      _trainV -= TRAIN_DECEL * dt;
      if (_trainV < 0) _trainV = 0;
    } else {
      _trainV += TRAIN_ACCEL * dt;
      if (_trainV > TRAIN_CRUISE) _trainV = TRAIN_CRUISE;
    }
    _trainZ += _trainDir * _trainV * dt;
    if (remain <= 0.4 && _trainV < 0.6) {
      _trainZ = endZ;
      _trainV = 0;
      _trainDir = -_trainDir;
      _trainState = 'dwell';
      _trainDwellT = TRAIN_DWELL;
    }
  }

  // 同步车身：车头在 _trainZ，车厢向后拖
  for (var i = 0; i < _trainCars.length; i++) {
    var carZ = _trainZ - _trainDir * i * _carSpacing;
    _trainCars[i].group.position.set(RAIL_X + 0.5, 0, carZ);
    // 朝向：+Z 行驶时车头面朝 +Z（yaw=0），-Z 行驶时翻转 180°
    _trainCars[i].group.rotation.y = (_trainDir > 0) ? Math.PI : 0;
  }

  // 乘车：把玩家锁定在车内（轨面 +1.5 高度，朝行进方向）
  if (_onTrain) {
    player.x = RAIL_X + 0.5;
    player.z = _trainZ;
    player.y = RAIL_TOP + 1.5;
    player.yaw = (_trainDir > 0) ? Math.PI : 0;
    player.vx = 0; player.vy = 0; player.vz = 0;
    // 速度表
    var spv = document.getElementById('speedo-val');
    if (spv) spv.textContent = Math.round(_trainV * 3.6);
  }

  _updateBoardBtn();
}

// ── 上/下车逻辑 ───────────────────────────────────────────────────────────────
function _canBoard() {
  if (!_trainReady || _trainState !== 'dwell') return false;
  var dx = player.x - (RAIL_X + 0.5);
  var dz = player.z - _trainZ;
  return Math.abs(dx) < 10 && Math.abs(dz) < 15;
}

function boardTrain() {
  if (_onTrain || !_canBoard()) return;
  _onTrain = true;
  if (typeof _pivInit !== 'undefined') _pivInit = false;
  if (typeof _camDcur !== 'undefined') _camDcur = CAM_DIST;
  var sp = document.getElementById('speedo'); if (sp) sp.classList.add('on');
  _updateBoardBtn();
}

function exitTrain() {
  if (!_onTrain) return;
  _onTrain = false;
  // 下到月台（X 偏左，道路侧）
  player.x = RAIL_X - 3;
  player.z = _trainZ;
  player.y = RAIL_TOP;
  player.vx = 0; player.vy = 0; player.vz = 0;
  if (typeof _pivInit !== 'undefined') _pivInit = false;
  if (typeof _camDcur !== 'undefined') _camDcur = CAM_DIST;
  var sp = document.getElementById('speedo'); if (sp) sp.classList.remove('on');
  _trainDwellT = Math.max(_trainDwellT, 5);  // 下车后至少再等 5s
  _updateBoardBtn();
}

// ── 上/下车按钮（自管 DOM，内联样式）────────────────────────────────────────
function _buildBoardBtn() {
  if (_trainBoardBtn) return;
  var b = document.createElement('div');
  b.id = 'train-board';
  b.style.cssText = [
    'position:fixed;left:50%;bottom:220px;transform:translateX(-50%);z-index:200',
    'padding:14px 32px;border-radius:28px;background:rgba(20,120,200,0.95)',
    'color:#fff;font-size:20px;font-weight:bold',
    'box-shadow:0 4px 14px rgba(0,0,0,0.5);display:none',
    'border:2px solid #fff;touch-action:none;-webkit-user-select:none;user-select:none',
    'pointer-events:auto'
  ].join(';');
  function onTap(e) { e.preventDefault(); if (_onTrain) exitTrain(); else boardTrain(); }
  b.addEventListener('touchstart', onTap, { passive: false });
  b.addEventListener('click', onTap);
  document.body.appendChild(b);
  _trainBoardBtn = b;
}

function _updateBoardBtn() {
  if (!_trainBoardBtn) return;
  if (_onTrain) {
    _trainBoardBtn.textContent = '🚄 下车';
    _trainBoardBtn.style.display = 'block';
  } else if (_canBoard()) {
    _trainBoardBtn.textContent = '🚄 上车';
    _trainBoardBtn.style.display = 'block';
  } else {
    _trainBoardBtn.style.display = 'none';
  }
}

// ── 高架桥（轨道侧边护墙 + 桥墩帽，跳过两端站台区域）────────────────────────
// RAIL_TOP=15 = 地面顶面高度（terrain block y=14 占 world y=14~15）
// 护墙从 y=RAIL_TOP 向上延伸，确保在地面以上可见
function _buildViaduct() {
  var wallMat = new THREE.MeshLambertMaterial({ color: 0xd4d0cc }); // 混凝土灰
  var capMat  = new THREE.MeshLambertMaterial({ color: 0xa8a4a0 }); // 深灰桥墩帽
  var northZ  = RAIL_Z0 + TRAIN_MARGIN + 16;  // 跳过北端站台
  var southZ  = 200;  // 赛道 z≥205 地面已平，高架桥只覆盖自然地形段
  var midZ    = (northZ + southZ) / 2;
  var segLen  = southZ - northZ;

  // 左侧护墙（x = RAIL_X - 0.6，轨道左侧紧贴）
  var bL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.4, segLen), wallMat);
  bL.position.set(RAIL_X - 0.6, RAIL_TOP + 0.7, midZ);
  scene.add(bL);

  // 右侧护墙（x = RAIL_X + 1.6，轨道右侧紧贴）
  var bR = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.4, segLen), wallMat);
  bR.position.set(RAIL_X + 1.6, RAIL_TOP + 0.7, midZ);
  scene.add(bR);

  // 桥墩帽块：每 12 格一组，突出于护墙顶部
  for (var vz = northZ + 6; vz < southZ; vz += 12) {
    var cL = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.45, 1.6), capMat);
    cL.position.set(RAIL_X - 0.65, RAIL_TOP + 1.625, vz);
    scene.add(cL);
    var cR = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.45, 1.6), capMat);
    cR.position.set(RAIL_X + 1.65, RAIL_TOP + 1.625, vz);
    scene.add(cR);
  }
}


// ═══ src/save.js ═══
// ─── save.js ──────────────────────────────────────────────────────────────────
// 本地存档：玩家方块改动 + 位置/朝向/物品栏 + 防御塔，存 localStorage。
//
// 只持久化"玩家改动"——地形、开源建筑、城堡都是确定性生成（每次启动重放），
// 无需入档；recordEdit 仅由 game.js 的破坏/放置路径调用。
// 读档在启动序列末尾（建筑放置后）执行，确保玩家改动覆盖默认建筑。

var SAVE_KEY = 'kuaishou_save_v1';
var _edits = {};            // "wx,wy,wz" -> blockId（玩家改动相对生成地形的差异）
var _autoSaveTimer = null;

// 记录一次玩家改动（破坏=AIR / 放置=方块 ID）
function recordEdit(wx, wy, wz, id) {
  _edits[wx + ',' + wy + ',' + wz] = id;
}

// 写存档（静默，失败返回 false——隐私模式/容量满时不抛错打断游戏）
function saveGame() {
  try {
    var towers = [];
    if (typeof _towers !== 'undefined') {
      for (var i = 0; i < _towers.length; i++) {
        if (!_towers[i].dead) towers.push([
          Math.round(_towers[i].x * 100) / 100,
          Math.round(_towers[i].z * 100) / 100,
        ]);
      }
    }
    var furniture = (typeof serializeFurniture === 'function') ? serializeFurniture() : [];
    var crops = (typeof serializeCrops === 'function') ? serializeCrops() : [];
    var data = {
      v: 2,
      p: { x: player.x, y: player.y, z: player.z,
           yaw: player.yaw, pitch: player.pitch, slot: player.slot },
      e: _edits,
      t: towers,
      f: furniture,
      c: crops,
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    return true;
  } catch (e) { return false; }
}

// 直接把一条改动写进区块数据（区块缺失则先生成），返回受影响区块键
function _applyEditToData(wx, wy, wz, id, dirty) {
  if (wy < 0 || wy >= CHUNK_H) return;
  var cx = Math.floor(wx / CHUNK_W), cz = Math.floor(wz / CHUNK_D);
  var k = ckey(cx, cz);
  if (!chunks[k]) chunks[k] = { data: genTerrain(cx, cz), mesh: null };
  var lx = ((wx % CHUNK_W) + CHUNK_W) % CHUNK_W;
  var lz = ((wz % CHUNK_D) + CHUNK_D) % CHUNK_D;
  chunks[k].data[lx + wy * CHUNK_W + lz * CHUNK_W * CHUNK_H] = id;
  dirty[k] = [cx, cz];
  if (lx === 0)         dirty[ckey(cx-1,cz)] = [cx-1,cz];
  if (lx === CHUNK_W-1) dirty[ckey(cx+1,cz)] = [cx+1,cz];
  if (lz === 0)         dirty[ckey(cx,cz-1)] = [cx,cz-1];
  if (lz === CHUNK_D-1) dirty[ckey(cx,cz+1)] = [cx,cz+1];
}

// 读存档并应用（启动末尾调用）。无存档则静默返回。
function loadGame() {
  var raw;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return; }
  if (!raw) return;
  var data;
  try { data = JSON.parse(raw); } catch (e) { return; }
  if (!data || data.v < 1) return;

  // 1) 重放方块改动 → 直接写数据，最后统一重建受影响区块
  var dirty = {}, key, parts, wx, wy, wz, id, terr = [];
  _edits = data.e || {};
  for (key in _edits) {
    if (!_edits.hasOwnProperty(key)) continue;
    parts = key.split(',');
    wx = +parts[0]; wy = +parts[1]; wz = +parts[2]; id = _edits[key];
    _applyEditToData(wx, wy, wz, id, dirty);
    // 结界：玩家放的领地石恢复结界；破坏(AIR)处移除可能存在的结界（覆盖城堡默认）
    if (typeof TERRITORY_STONE !== 'undefined') {
      if (id === TERRITORY_STONE) terr.push([wx, wy, wz, 1]);
      else if (id === AIR)        terr.push([wx, wy, wz, 0]);
    }
  }
  var k, cd;
  for (k in dirty) { cd = dirty[k]; if (chunks[ckey(cd[0], cd[1])]) rebuildChunk(cd[0], cd[1]); }

  // 2) 结界同步（在区块重建后，避免 _addTerritory 依赖的视觉无副作用问题）
  var ti;
  for (ti = 0; ti < terr.length; ti++) {
    if (terr[ti][3] === 1) { if (typeof _addTerritory === 'function') _addTerritory(terr[ti][0], terr[ti][1], terr[ti][2]); }
    else                   { if (typeof _removeTerritory === 'function') _removeTerritory(terr[ti][0], terr[ti][1], terr[ti][2]); }
  }

  // 3) 恢复玩家位置/朝向/物品栏
  if (data.p) {
    player.x = data.p.x; player.y = data.p.y; player.z = data.p.z;
    player.yaw = data.p.yaw; player.pitch = data.p.pitch;
    if (typeof data.p.slot === 'number') player.slot = data.p.slot;
    // 预生成落点周围区块数据：物理 resolveAABB 在 updateChunks 之前跑，
    // 缺数据会被判为 AIR 导致首帧坠落——这里先把 3×3 区块数据建好。
    var pcx = Math.floor(player.x / CHUNK_W), pcz = Math.floor(player.z / CHUNK_D), gx, gz;
    for (gx = -1; gx <= 1; gx++) {
      for (gz = -1; gz <= 1; gz++) {
        if (typeof createChunk === 'function') createChunk(pcx + gx, pcz + gz);
      }
    }
  }

  // 4) 恢复防御塔
  if (data.t && typeof placeTower === 'function') {
    for (ti = 0; ti < data.t.length; ti++) placeTower(data.t[ti][0], data.t[ti][1], true);
  }

  // 5) 恢复家具（需先加载模型，异步回调内执行）
  if (data.f && data.f.length && typeof loadFurnitureModels === 'function') {
    var _savedFurniture = data.f;
    loadFurnitureModels(function () { deserializeFurniture(_savedFurniture); });
  }

  // 6) 恢复农作物（GLB 按需加载，deserializeCrops 内部异步）
  if (data.c && data.c.length && typeof deserializeCrops === 'function') {
    deserializeCrops(data.c);
  }

  if (typeof battleToast === 'function') battleToast('💾 存档已读取');
}

// 自动存档：每 20s + 页面隐藏/关闭时（移动端切后台即触发）
function initAutoSave() {
  if (_autoSaveTimer) return;
  _autoSaveTimer = setInterval(saveGame, 20000);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') saveGame();
  });
  window.addEventListener('beforeunload', saveGame);
  window.addEventListener('pagehide', saveGame);
}

// UV 工具：把 Steve 皮肤（64×64）上的像素矩形映射到 BoxGeometry 某面
function _setFaceUV(geo, face, px, py, pw, phh) {
  var uv = geo.attributes.uv;
  var u0 = px / 64, u1 = (px + pw) / 64;
  var v1 = 1 - py / 64, v0 = 1 - (py + phh) / 64;
  var o  = face * 4;
  uv.setXY(o,   u0, v1); uv.setXY(o+1, u1, v1);
  uv.setXY(o+2, u0, v0); uv.setXY(o+3, u1, v0);
  uv.needsUpdate = true;
}

// 手持方块迷你立方体（UV 取自贴图集，与地形共用 atlasTexture）
function _makeHandCube(blockId) {
  var tex = BTEX[blockId];
  if (!tex) return null;
  var geo = new THREE.BoxGeometry(0.22, 0.22, 0.22);
  var uv  = geo.attributes.uv;
  // face 顺序：+X,-X,+Y,-Y,+Z,-Z → side,side,top,bot,side,side
  var fMap = [tex[1], tex[1], tex[0], tex[2], tex[1], tex[1]];
  for (var f = 0; f < 6; f++) {
    var ti = fMap[f];
    var tc = ti % ATLAS_COLS, tr = (ti / ATLAS_COLS) | 0;
    var u0 = tc / ATLAS_COLS + _UV_EPS_U, u1 = (tc+1) / ATLAS_COLS - _UV_EPS_U;
    var v0 = 1 - (tr+1) / ATLAS_ROWS + _UV_EPS_V, v1 = 1 - tr / ATLAS_ROWS - _UV_EPS_V;
    var o  = f * 4;
    uv.setXY(o, u0, v1); uv.setXY(o+1, u1, v1);
    uv.setXY(o+2, u0, v0); uv.setXY(o+3, u1, v0);
  }
  uv.needsUpdate = true;
  return new THREE.Mesh(geo, _handItemMat);
}

  if (isFurnitureLamp(e.typeId)) {
    toggleLamp(e);
  } else if (isFurnitureBed(e.typeId)) {
    doRest(e);

    doSit(e);

var CAM_DIST     = 4.0;

var BREAK_CD = 0.22;
var PLACE_CD = 0.30;
var _lastBreak = 0, _lastPlace = 0;

// ── 区块流加载 ───────────────────────────────────────────────────────────────────
var lastCX = null, lastCZ = null, RDIST = 3;

function updateChunks() {
  var cx = Math.floor(player.x / CHUNK_W);
  var cz = Math.floor(player.z / CHUNK_D);
  if (cx === lastCX && cz === lastCZ) return;
  lastCX = cx; lastCZ = cz;

  var dx, dz, keys, k, p2, kcx, kcz;
  for (dx = -RDIST; dx <= RDIST; dx++) {
    for (dz = -RDIST; dz <= RDIST; dz++) { createChunk(cx + dx, cz + dz); }
  }
  for (dx = -RDIST; dx <= RDIST; dx++) {
    for (dz = -RDIST; dz <= RDIST; dz++) { rebuildChunk(cx + dx, cz + dz); }
  }
  keys = Object.keys(chunks);
  for (k = 0; k < keys.length; k++) {
    p2  = keys[k].split(',');
    kcx = +p2[0]; kcz = +p2[1];

      setProgressSub('');
      renderer.render(scene, camera);
      bootSX = Math.floor(player.x / CHUNK_W);
      bootSZ = Math.floor(player.z / CHUNK_D);
      bootStep = 2; requestAnimationFrame(bootNext);

    } else if (bootStep === 2) {
      setProgress(74, '生成地形...');
      addProgressLog('生成地形噪声...');
      var dx1, dz1;
      for (dx1 = -2; dx1 <= 2; dx1++) {
        for (dz1 = -2; dz1 <= 2; dz1++) { createChunk(bootSX + dx1, bootSZ + dz1); }
      }
      addProgressLog('区块数据生成完成');
      bootStep = 3; requestAnimationFrame(bootNext);

    } else if (bootStep >= 3 && bootStep <= 7) {
      var col = bootStep - 5, dz2;
      for (dz2 = -2; dz2 <= 2; dz2++) { rebuildChunk(bootSX + col, bootSZ + dz2); }
      setProgress(78 + (bootStep - 3) * 4, '构建地形网格 ' + (bootStep - 2) + '/5...');
      addProgressLog('构建区块列 ' + (bootStep - 2) + '/5');
      bootStep++; requestAnimationFrame(bootNext);

    } else if (bootStep === 8) {
      setProgress(94, '定位出生点...');
      addProgressLog('定位出生点...');
      var y;
      for (y = CHUNK_H - 1; y >= 0; y--) {
        if (getBlock(Math.floor(player.x), y, Math.floor(player.z)) !== AIR) {
          player.y = y + 1;
          break;
        }
      }
      bootStep = 9; requestAnimationFrame(bootNext);

    } else if (bootStep === 9) {
      setProgress(97, '放置建筑...');
      addProgressLog('生成城堡与建筑...');
      placeStructures();
      placeSimpleCastle(-8, -8);
      placeVillage( 110,  70);   // 东南村庄
      placeVillage(-110,  90);   // 西南村庄
      placeVillage(  70, -130);  // 北方村庄
      if (typeof initTrain === 'function') initTrain();   // 高铁轨道 + 列车
      _loadSuzukaCircuit();                               // 铃鹿赛道（道路尽头）
      if (typeof loadGame === 'function') loadGame();
      bootStep = 10; requestAnimationFrame(bootNext);

    } else {
      setProgress(100, '完成!');
      addProgressLog('世界已就绪 — 开始游戏');
      if (loadEl) loadEl.style.display = 'none';
      if (menuEl) menuEl.style.display = 'flex';
      loadPlayerModel();
      spawnNPCs();
      loadArmyModels(function () {
        if (!_enemyStrongholdPos || !_enemyStrongholdPos.posts) return;
        var posts = _enemyStrongholdPos.posts;
        var pox = _enemyStrongholdPos.ox, poz = _enemyStrongholdPos.oz;
        var roster = [
          { k: 'skel_war', n: 20 },
          { k: 'skel_min', n: 20 },
          { k: 'skel_rog', n: 15 }
        ];
        var pi = 0;
        roster.forEach(function (r) {
          for (var i = 0; i < r.n && pi < posts.length; i++, pi++) {
            var p = posts[pi];
            var u = spawnUnit(r.k, 1, pox + p[0], poz + p[1]);
            if (u) u.passive = true;
          }
        });
      }, function () {});
    }
  } catch (e) {
    setProgress(0, '错误: ' + (e.message || String(e)));
    if (loadFill) { loadFill.style.width = '100%'; loadFill.style.background = '#f44'; }
  }
}

requestAnimationFrame(bootNext);

// 铃鹿赛道 GLB —— 全局引用供 Raycaster 碰撞使用
var _circuitModel = null;
var _circuitRC    = null;
var _circuitRCDir = new THREE.Vector3(0, -1, 0);
var _circuitRCOrg = new THREE.Vector3();

function _loadSuzukaCircuit() {
  if (typeof gltfLoader === 'undefined') return;
  gltfLoader.load('assets/models/suzuka_circuit.glb', function (g) {
    var model = g.scene;

    // 1. 缩放到目标尺寸
    model.updateMatrixWorld(true);
    var bb = new THREE.Box3().setFromObject(model);
    var maxDim = Math.max(bb.max.x - bb.min.x, bb.max.z - bb.min.z);
    if (maxDim > 0.1) {
      var s = 3000 / maxDim;
      model.scale.multiplyScalar(s);
      model.updateMatrixWorld(true);
      bb.setFromObject(model);
    }

    // 2. X/Z 居中放到 z=1710（道路尽头 z=210 再往南 1500）
    model.position.x = 0 - (bb.min.x + bb.max.x) / 2;
    model.position.z = 1710 - (bb.min.z + bb.max.z) / 2;
    model.position.y = 0;
    model.updateMatrixWorld(true);

    // 3. 自动找赛道面高度：从赛道中心上方射线向下，取第一个命中点 Y
    var floorRC = new THREE.Raycaster();
    var cx = (bb.min.x + bb.max.x) / 2 + model.position.x;  // 世界 X 中心
    var cz = 1710;
    floorRC.set(new THREE.Vector3(cx, 5000, cz), new THREE.Vector3(0, -1, 0));
    var fhits = floorRC.intersectObject(model, true);
    var trackY = fhits.length > 0 ? fhits[0].point.y : 0;
    // 把赛道面对齐 SEA+2（石头路面高度）
    model.position.y = (SEA + 2) - trackY;

    // 4. 保留 PBR 材质，注入中性灰 IBL 环境贴图（仅影响赛道 MeshStandardMaterial）
    var _pmrem = new THREE.PMREMGenerator(renderer);
    var _envScene = new THREE.Scene();
    _envScene.background = new THREE.Color(0x999999);
    var _envTex = _pmrem.fromScene(_envScene).texture;
    _pmrem.dispose();

    model.traverse(function (node) {
      if (!node.isMesh) return;
      var mats = Array.isArray(node.material) ? node.material : [node.material];
      for (var mi2 = 0; mi2 < mats.length; mi2++) {
        var m = mats[mi2];
        if (!m) continue;
        m.envMap = _envTex;
        m.envMapIntensity = 1.0;
        m.needsUpdate = true;
      }
    });

    scene.add(model);
    _circuitModel = model;
    _circuitRC    = new THREE.Raycaster();
  }, undefined, function (e) { console.warn('suzuka load failed', e); });
}

// 每帧：玩家在赛道区时向下射线打 GLB，站在模型表面
function _resolveCircuitGround() {
  if (!_circuitModel || !_circuitRC) return;
  if (player.x < -900 || player.x > 900 || player.z < 205 || player.z > 3215) return;
  _circuitRCOrg.set(player.x, player.y + 10, player.z);
  _circuitRC.set(_circuitRCOrg, _circuitRCDir);
  var hits = _circuitRC.intersectObject(_circuitModel, true);
  if (!hits.length) return;
  var sy = hits[0].point.y;
  // 玩家脚底在表面上方 0~3 格内：落到表面
  if (player.y >= sy - 0.1 && player.y <= sy + 3) {
    player.y  = sy;
    if (player.vy < 0) player.vy = 0;
    player.onGround = true;
  }
}
