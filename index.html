<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>B站搜索</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
       background: #f2f2f7; min-height: 100vh; color: #1c1c1e; }
header { position: sticky; top: 0; z-index: 100;
         background: rgba(255,255,255,.92); backdrop-filter: blur(12px);
         -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid #e5e5ea;
         padding: 12px 14px 10px; }
.header-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.logo { font-size: 16px; font-weight: 700; flex: 1; color: #fb7299; }
.search-row { display: flex; gap: 8px; }
.search-row input { flex: 1; padding: 10px 16px; border: 1.5px solid #d1d1d6;
                    border-radius: 24px; font-size: 15px; outline: none; background: #f2f2f7; }
.search-row input:focus { border-color: #fb7299; background: #fff; }
.search-row button { padding: 10px 18px; background: #fb7299; color: #fff;
                     border: none; border-radius: 24px; font-size: 15px;
                     font-weight: 600; cursor: pointer; white-space: nowrap; }
.search-row button:disabled { opacity: .45; }
.status { padding: 10px 14px; font-size: 13px; color: #8e8e93; min-height: 36px; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr);
        gap: 10px; padding: 0 10px 30px; }
.card { background: #fff; border-radius: 14px; overflow: hidden;
        box-shadow: 0 1px 4px rgba(0,0,0,.08); cursor: pointer; }
.card img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; background: #eee; }
.card .info { padding: 8px 10px 10px; }
.card .cap { font-size: 13px; line-height: 1.4; overflow: hidden;
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card .meta { font-size: 11px; color: #aeaeb2; margin-top: 4px; }
.card .open { display: inline-block; margin-top: 6px; font-size: 12px;
              color: #fb7299; text-decoration: none; }
.spinner { display: inline-block; width: 16px; height: 16px;
           border: 2px solid #e5e5ea; border-top-color: #fb7299;
           border-radius: 50%; animation: spin .7s linear infinite;
           vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <div class="header-row"><span class="logo">📺 B站搜索</span></div>
  <div class="search-row">
    <input id="kw" type="search" placeholder="搜索B站视频…" enterkeyhint="search">
    <button id="btn" onclick="doSearch()">搜索</button>
  </div>
</header>
<div class="status" id="status">无需登录，直接搜索。</div>
<div class="grid" id="grid"></div>

<script src="https://cdn.jsdelivr.net/npm/blueimp-md5@2.19.0/js/md5.min.js"></script>
<script>
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

const WBI_TAB = [
  46,47,18, 2,53, 8,23,32,15,50,10,31,58, 3,45,35,
  27,43, 5,49,33, 9,42,19,29,28,14,39,12,38,41,13,
  37,48, 7,16,24,55,40,61,26,17, 0, 1,60,51,30, 4,
  22,25,54,21,56,59, 6,63,57,62,11,36,20,34,44,52,
];

let _mixin = null;

async function getMixin() {
  if (_mixin) return _mixin;
  const r = await fetch("https://api.bilibili.com/x/web-interface/nav");
  const d = await r.json();
  const img = (d.data?.wbi_img?.img_url || "").split("/").pop().split(".")[0];
  const sub = (d.data?.wbi_img?.sub_url || "").split("/").pop().split(".")[0];
  const raw = img + sub;
  _mixin = WBI_TAB.filter(i => i < raw.length).map(i => raw[i]).join("").slice(0, 32);
  return _mixin;
}

async function signedSearch(keyword) {
  const mixin = await getMixin();
  const p = { keyword, search_type: "video", page: 1, pagesize: 20, order: "totalrank",
               wts: String(Math.floor(Date.now() / 1000)) };
  const sorted = Object.entries(p).sort(([a],[b]) => a.localeCompare(b));
  const qs = sorted.map(([k,v]) => `${k}=${String(v).replace(/[!'()*]/g,"")}`).join("&");
  p.w_rid = md5(qs + mixin);
  const params = new URLSearchParams(p).toString();
  const r = await fetch("https://api.bilibili.com/x/web-interface/search/type?" + params);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const data = await r.json();
  if (data.code !== 0) throw new Error("B站 code=" + data.code + " " + (data.message||""));
  return (data.data?.result || []).map(v => ({
    bvid:    v.bvid,
    caption: (v.title || "").replace(/<[^>]+>/g, ""),
    author:  v.author || "",
    cover:   (v.pic || "").startsWith("//") ? "https:" + v.pic : v.pic,
    play:    v.play,
    duration: v.duration || "",
    pageUrl: "https://www.bilibili.com/video/" + v.bvid,
  }));
}

document.getElementById("kw").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); doSearch(); }
});

async function doSearch() {
  const kw = document.getElementById("kw").value.trim();
  if (!kw) return;
  const btn = document.getElementById("btn");
  const status = document.getElementById("status");
  const grid = document.getElementById("grid");
  btn.disabled = true; grid.innerHTML = "";
  status.innerHTML = '<span class="spinner"></span>搜索中…';
  try {
    const results = await signedSearch(kw);
    status.textContent = results.length > 0 ? "找到 " + results.length + " 条结果" : "未找到结果";
    for (const v of results) {
      const card = document.createElement("div");
      card.className = "card";
      card.onclick = () => window.open(v.pageUrl, "_blank");
      const playNum = typeof v.play === "number" ? v.play.toLocaleString() + " 播放" : "";
      card.innerHTML =
        (v.cover ? '<img src="' + esc(v.cover) + '" referrerpolicy="no-referrer" loading="lazy">'
                 : '<div style="aspect-ratio:16/10;background:#eee"></div>') +
        '<div class="info">' +
          '<div class="cap">' + esc(v.caption || "(无标题)") + '</div>' +
          '<div class="meta">' + esc(v.author) +
            (playNum ? " · " + playNum : "") +
            (v.duration ? " · " + esc(v.duration) : "") + '</div>' +
          '<a class="open" href="' + esc(v.pageUrl) + '" target="_blank">去B站看 ↗</a>' +
        '</div>';
      grid.appendChild(card);
    }
  } catch(e) {
    status.textContent = "出错：" + e.message;
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
