<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>我的世界</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
canvas{position:fixed!important;top:0!important;left:0!important;width:100%!important;height:100%!important;z-index:1!important;display:block!important;touch-action:none}

#loading{position:fixed;inset:0;background:#0e1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:10000;gap:10px}
#loading h1{font-size:30px;color:#4ade80;font-family:monospace;letter-spacing:3px;text-shadow:0 0 20px rgba(74,222,128,.5)}
#loading-bar{width:220px;height:12px;background:#1a2a40;border-radius:6px;overflow:hidden;border:1px solid rgba(74,222,128,.2)}
#loading-fill{height:100%;background:linear-gradient(90deg,#22c55e,#4ade80);width:0%;border-radius:6px}
#loading-text{color:#7a9ab8;font-size:13px;font-family:monospace;text-align:center;padding:0 20px}
#loading-sub{color:#3a5570;font-size:11px;font-family:monospace;letter-spacing:.5px;height:15px;text-align:center}
#loading-log{color:#2a4560;font-size:10px;font-family:monospace;text-align:left;width:220px;line-height:1.7;min-height:60px}
#ver{position:absolute;bottom:10px;right:12px;color:#334;font-size:10px;font-family:monospace}

#portrait{display:none;position:fixed;inset:0;background:#0e1a2e;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:9999;color:#fff;font-family:monospace;text-align:center}
@media(orientation:portrait){#portrait{display:flex}#menu,#ui{display:none!important}}
#portrait p{font-size:18px;color:#4ade80}

#menu{position:fixed;inset:0;background:rgba(0,8,20,.82);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:500;gap:20px;backdrop-filter:blur(4px)}
#menu h1{font-size:30px;color:#4ade80;font-family:monospace;text-shadow:0 0 20px rgba(74,222,128,.5)}
#menu .tip{color:#8ab;font-size:12px;line-height:2.4;text-align:center;font-family:monospace;background:rgba(255,255,255,.04);padding:12px 24px;border-radius:10px;border:1px solid rgba(255,255,255,.08)}
#play-btn{padding:15px 56px;background:linear-gradient(135deg,#22c55e,#4ade80);color:#000;border:none;border-radius:10px;font-size:22px;font-weight:bold;cursor:pointer;font-family:monospace;box-shadow:0 4px 24px rgba(74,222,128,.4)}

#ui{position:fixed;inset:0;display:none;z-index:100}

/* 瞄准点（绿色）：第三人称=小圆点，第一人称(.fp)=十字准星 */
#xhair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;width:8px;height:8px;border-radius:50%;background:rgba(0,255,110,.85);box-shadow:0 0 0 2px rgba(0,0,0,.55)}
#xhair.fp{width:22px;height:22px;background:transparent;box-shadow:none;border-radius:0}
#xhair.fp::before,#xhair.fp::after{content:'';position:absolute;background:rgba(0,255,110,.9);box-shadow:0 0 3px rgba(0,0,0,.7)}
#xhair.fp::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
#xhair.fp::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}

#coords{position:absolute;top:10px;left:10px;color:#e0f0ff;font-size:12px;font-family:monospace;background:rgba(0,0,0,.45);padding:5px 10px;border-radius:6px;line-height:1.9;pointer-events:none;border:1px solid rgba(255,255,255,.08)}
#speedo{display:none;position:absolute;bottom:96px;left:50%;transform:translateX(-50%);color:#fff;font-family:monospace;background:rgba(0,0,0,.5);padding:6px 16px;border-radius:10px;pointer-events:none;border:1px solid rgba(255,255,255,.12);text-align:center}
#speedo.on{display:block}
#speedo-val{font-size:26px;font-weight:700}
#speedo-unit{font-size:11px;opacity:.7;margin-left:4px}
#drive-ui{display:none;position:absolute;inset:0;z-index:50;pointer-events:none}
#drive-ui.on{display:block}
#drive-steer{position:absolute;left:20px;bottom:26px;display:flex;gap:16px;pointer-events:auto}
#drive-pedals{position:absolute;right:20px;bottom:26px;display:flex;flex-direction:column;gap:14px;align-items:center;pointer-events:auto}
.dbtn{position:relative;width:92px;height:92px;border-radius:50%;border:none;color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;will-change:transform}
.dbtn>span{pointer-events:none;line-height:1;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#d-steer-ring{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.35);position:relative;touch-action:none;pointer-events:auto}
#d-steer-knob{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(160,200,255,.95),rgba(50,110,220,.92));position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 4px 14px rgba(0,40,120,.5);will-change:transform;pointer-events:none}
#d-gas{width:104px;height:104px;font-size:44px;background:radial-gradient(circle at 35% 30%,rgba(120,240,150,.96),rgba(20,150,60,.94));box-shadow:0 6px 18px rgba(0,90,30,.55),inset 0 2px 6px rgba(255,255,255,.45),inset 0 -4px 10px rgba(0,0,0,.35)}
#d-brake{width:78px;height:78px;font-size:28px;background:radial-gradient(circle at 35% 30%,rgba(255,130,130,.96),rgba(190,30,30,.94));box-shadow:0 6px 18px rgba(120,0,0,.55),inset 0 2px 6px rgba(255,255,255,.4),inset 0 -4px 10px rgba(0,0,0,.35)}
#d-hb{width:72px;height:72px;font-size:26px;background:radial-gradient(circle at 35% 30%,rgba(255,230,80,.96),rgba(200,140,0,.94));box-shadow:0 6px 18px rgba(120,80,0,.55),inset 0 2px 6px rgba(255,255,255,.45),inset 0 -4px 10px rgba(0,0,0,.35)}
#d-exit{position:absolute;left:50%;top:18px;transform:translateX(-50%);pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 18px;border:none;border-radius:14px;color:#fff;font-size:13px;font-family:inherit;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;background:linear-gradient(180deg,rgba(60,66,82,.92),rgba(28,32,44,.92));box-shadow:0 4px 14px rgba(0,0,0,.5);will-change:transform}
#d-exit .ic{font-size:22px}
#d-auto{position:absolute;left:50%;top:58px;transform:translateX(-50%);pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;border:none;border-radius:12px;color:#fff;font-size:12px;font-family:inherit;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;background:linear-gradient(180deg,rgba(40,90,60,.92),rgba(20,50,30,.92));box-shadow:0 4px 14px rgba(0,0,0,.5);will-change:transform}
#d-auto.active{background:linear-gradient(180deg,rgba(50,200,100,.92),rgba(20,140,50,.92));box-shadow:0 4px 14px rgba(0,180,60,.4)}
#d-auto .ic{font-size:18px}

/* 摇杆区占左侧 42%，给右侧更大空间 */
#joy-zone{position:absolute;left:0;top:0;bottom:72px;width:42%;touch-action:none}
#joy-base{position:absolute;bottom:20px;left:24px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.22);pointer-events:none}
#joy-thumb{position:absolute;top:50%;left:50%;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.45);border:2px solid rgba(255,255,255,.6);transform:translate(-50%,-50%);pointer-events:none}

#look-zone{position:absolute;right:0;top:0;bottom:72px;left:42%;touch-action:none}

/* 动作按钮区 — 更大、分组更清晰 */
#btns{position:absolute;right:12px;bottom:78px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.row{display:flex;gap:8px}
.btn{width:72px;height:72px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);background:rgba(0,0,0,.5);color:#fff;font-size:12px;font-family:monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.btn:active{background:rgba(255,255,255,.18);transform:scale(.93)}
.btn .ic{font-size:28px;line-height:1}
#b-jump{background:rgba(60,160,255,.4);border-color:rgba(100,200,255,.5)}
#b-fly{background:rgba(255,210,60,.28);border-color:rgba(255,230,100,.4)}
#b-fly.on{background:rgba(255,210,60,.7);border-color:#ffd940;box-shadow:0 0 16px rgba(255,210,60,.5)}
#b-down{display:none;background:rgba(160,120,255,.4);border-color:rgba(190,160,255,.5)}
#btns.flying #b-down{display:flex}
#b-brk{background:rgba(255,70,70,.4);border-color:rgba(255,120,120,.5)}
#b-plc{background:rgba(60,220,100,.38);border-color:rgba(80,255,130,.5)}
#b-view{background:rgba(60,200,220,.35);border-color:rgba(110,230,250,.5)}
#b-view.on{background:rgba(60,200,220,.7);border-color:#5ee0f5;box-shadow:0 0 16px rgba(60,200,220,.5)}
#b-rot{display:none;background:rgba(180,120,255,.4);border-color:rgba(200,160,255,.5)}
#btns.furni #b-rot{display:flex}
#b-act{display:none;background:rgba(255,200,80,.4);border-color:rgba(255,220,120,.5)}
#btns.canact #b-act{display:flex}

/* 热键栏 — 全量横向滚动 */
#hotbar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;max-width:95vw;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;padding-bottom:3px;flex-wrap:nowrap}
#hotbar::-webkit-scrollbar{height:3px}
#hotbar::-webkit-scrollbar-track{background:rgba(0,0,0,.2);border-radius:2px}
#hotbar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:2px}
.slot{width:62px;height:62px;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.18);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;touch-action:manipulation;cursor:pointer;transition:border-color .1s;flex-shrink:0;scroll-snap-align:center}
.slot.on{border-color:#fff;background:rgba(255,255,255,.12);box-shadow:0 0 10px rgba(255,255,255,.2)}
.slot-ic{width:34px;height:34px;border-radius:4px}
.slot-lbl{color:#bcd;font-size:9px;font-family:monospace}
.bag-btn{font-size:22px;line-height:1;color:#fff}
</style>
</head>
<body>

<div id="portrait"><span style="font-size:50px">📱</span><p>请横屏游玩</p></div>

<div id="loading">
  <h1>⛏ 我的世界</h1>
  <div id="loading-bar"><div id="loading-fill"></div></div>
  <p id="loading-text">初始化… v21</p>
  <p id="loading-sub"></p>
  <div id="loading-log"></div>
  <p id="ver">v21</p>
</div>

<div id="menu">
  <h1>⛏ 我的世界</h1>
  <div class="tip">
    左摇杆 移动 &nbsp;│&nbsp; 右侧滑动 旋转视角<br>
    🔨 长按破坏 &nbsp;│&nbsp; 📦 长按放置<br>
    ⬆ 跳跃 &nbsp;│&nbsp; ✈ 切换飞行模式<br>
    👁 切换第一/第三人称 &nbsp;│&nbsp; 底部热键栏 选择方块
  </div>
  <button id="play-btn" onclick="window.startGame&&window.startGame()">开始游戏</button>
</div>

<div id="ui">
  <div id="xhair"></div>
  <div id="coords">X:0 Y:0 Z:0</div>
  <div id="speedo"><span id="speedo-val">0</span><span id="speedo-unit">km/h</span></div>
  <div id="joy-zone"><div id="joy-base"><div id="joy-thumb"></div></div></div>
  <div id="look-zone"></div>
  <div id="btns">
    <div class="row">
      <button class="btn" id="b-act"><span class="ic">✋</span><span class="actl">互动</span></button>
      <button class="btn" id="b-rot"><span class="ic">🔄</span><span>旋转</span></button>
      <button class="btn" id="b-view"><span class="ic">👁</span><span>视角</span></button>
      <button class="btn" id="b-brk"><span class="ic">🔨</span><span>破坏</span></button>
      <button class="btn" id="b-plc"><span class="ic">📦</span><span>放置</span></button>
    </div>
    <div class="row">
      <button class="btn" id="b-fly"><span class="ic">✈</span><span>飞行</span></button>
      <button class="btn" id="b-down"><span class="ic">⬇</span><span>下降</span></button>
      <button class="btn" id="b-jump"><span class="ic">⬆</span><span>跳跃</span></button>
    </div>
  </div>
  <div id="hotbar"></div>

  <!-- 驾驶专用控制层（仅上车时显示，盖在最上层） -->
  <div id="drive-ui">
    <div id="drive-steer">
      <div id="d-steer-ring"><div id="d-steer-knob"></div></div>
    </div>
    <div id="drive-pedals">
      <button class="dbtn" id="d-hb"><span>⊗</span></button>
      <button class="dbtn" id="d-gas"><span>▲</span></button>
      <button class="dbtn" id="d-brake"><span>▼</span></button>
    </div>
    <button id="d-exit"><span class="ic">🚪</span><span>下车</span></button>
    <button id="d-auto"><span class="ic">▶</span><span>自驾</span></button>
  </div>
</div>

<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script src="gsap.min.js"></script>

<!-- Diagnostic: runs before the game bundle -->
<script>
var _lt = document.getElementById('loading-text');
var _lf = document.getElementById('loading-fill');
var _errMsg = '';

function _st(s) { if (_lt) _lt.textContent = s; }
function _sb(p, c) { if (_lf) { _lf.style.width = p + '%'; if (c) _lf.style.background = c; } }

// Capture JS errors (sync)
window.addEventListener('error', function(e) {
  var parts = [];
  // Distinguish resource-load errors from JS errors
  if (e.target && e.target !== window && e.target.tagName) {
    parts.push('res:' + e.target.tagName + (e.target.src ? ':' + e.target.src.slice(-40) : ''));
  } else {
    parts.push(e.message || '(no msg)');
    if (e.error && e.error.constructor) parts.push('type:' + e.error.constructor.name);
    if (e.lineno) parts.push('ln:' + e.lineno + (e.colno ? ':' + e.colno : ''));
  }
  parts.push('step:' + (window._step || '0'));
  _errMsg = parts.join(' | ');
  _st('错误: ' + _errMsg);
  _sb(100, '#f44');
}, true);

// Capture async errors (Promise rejections)
window.addEventListener('unhandledrejection', function(e) {
  var msg = e.reason ? (e.reason.message || String(e.reason)) : 'promise rejected';
  _errMsg = msg;
  _st('异步错误: ' + msg);
  _sb(100, '#f44');
});

// If nothing happened after 10s, show diagnostic state
setTimeout(function() {
  if (!window._ok) {
    if (!_errMsg) {
      _st('脚本未响应 (v19) — 请截图发给开发者');
    }
    _sb(100, '#f44');
  }
}, 10000);

// ═══ src/init.js ═══
// ─── init.js ──────────────────────────────────────────────────────────────────
// 最先执行：设置诊断标志、缓存 DOM 引用、声明 setProgress。
// window._ok 告诉诊断脚本"游戏代码已开始执行"，防止 10 秒超时误报。
// window._step 在关键节点更新，供错误信息定位用。

window._ok   = true;
window._step = 1;

var loadEl   = document.getElementById('loading');
var loadFill = document.getElementById('loading-fill');
var loadText = document.getElementById('loading-text');
var loadSub  = document.getElementById('loading-sub');
var loadLog  = document.getElementById('loading-log');
var menuEl   = document.getElementById('menu');
var uiEl     = document.getElementById('ui');
var coordEl  = document.getElementById('coords');

// GSAP 是否可用（gsap.min.js 在游戏包之前以 <script> 加载）。全局共享给所有源文件。
var _hasGsap = (typeof gsap !== 'undefined');

// 标题入场弹跳（加载页 + 菜单页）
if (_hasGsap) {
  gsap.from('#loading h1, #menu h1', { scale: 0.7, autoAlpha: 0, y: -14,
    duration: 0.7, ease: 'back.out(1.7)' });
}

// 更新加载进度条和文字
function setProgress(pct, msg) {
  if (loadFill) {
    if (_hasGsap) gsap.to(loadFill, { width: pct + '%', duration: 0.4, ease: 'power2.out', overwrite: true });
    else loadFill.style.width = pct + '%';
  }
  if (loadText) loadText.textContent = msg;
}

// 当前文件提示（小字）
function setProgressSub(msg) {
  if (loadSub) loadSub.textContent = msg;
}

// 追加到滚动日志（最多显示 5 行）
var _logLines = [];
function addProgressLog(msg) {
  _logLines.push(msg);
  if (_logLines.length > 5) _logLines.shift();
  if (loadLog) loadLog.innerHTML = _logLines.map(function(l) {
    return '<span style="color:#22c55e">✓</span> ' + l;
  }).join('<br>');
}

setProgress(5, 'Three.js 初始化...');

// three.min.js 必须在此脚本块之前以 <script src> 加载
if (typeof THREE === 'undefined') {
  setProgress(0, '错误: THREE 未定义 — lib/three.min.js 未加载');
  throw new Error('THREE undefined');
}

window._step = 2;


// ═══ src/constants.js ═══
// ─── constants.js ─────────────────────────────────────────────────────────────
// 游戏全局常量：世界尺寸、物理参数、方块 ID、颜色表、面定义。
// 不依赖任何其他文件，所有模块均可引用这里的变量。

// 区块尺寸（单位：方块）
var CHUNK_W = 16, CHUNK_H = 64, CHUNK_D = 16;

// 地形生成参数
var SEA   = 12;    // 海平面高度
var AMP   = 14;    // 地形起伏幅度
var SCALE = 0.04;  // Perlin 采样缩放（越小地形越平缓）

// 物理参数
var GRAVITY  = 28;   // 重力加速度（方块/秒²）
var JUMP_V   = 10;   // 跳跃初速度（方块/秒）
var PH       = 1.7;  // 玩家碰撞箱高度（方块）
var PR       = 0.3;  // 玩家碰撞箱半径（方块）
var MOVE_SPD = 5;    // 步行速度
var FLY_SPD  = 8;    // 飞行速度

// 方块类型 ID
var AIR         = 0;
var GRASS       = 1;
var DIRT        = 2;
var STONE       = 3;
var SAND        = 4;
var WOOD        = 5;
var LEAVES      = 6;
var WATER       = 7;
// 故宫专用方块
var RED_WALL    = 8;   // 朱红宫墙（砖纹+故宫红 tint）
var GOLD_ROOF   = 9;   // 黄色琉璃瓦（砂岩纹+金黄 tint）
var WHITE_STONE = 10;  // 汉白玉台基（石砖纹+象牙白 tint）
var GRAY_BRICK  = 11;  // 青砖铺地（石砖纹原色）
// 开源建筑（aschinese 结构）所需方块
var GRAY_ROOF   = 12;  // 灰瓦屋顶（石纹+青灰 tint）
var RED_PILLAR  = 13;  // 朱红立柱（陶瓦纹+朱红 tint）
var PLANKS      = 14;  // 木板（橡木板原色）
var COBBLE      = 15;  // 卵石（圆石原色）
var MUD_BRICK   = 16;  // 土砖（砂岩纹+土黄 tint）
var TERRITORY_STONE = 17;  // 领地石（紫色结界，敌人无法进入 12m 范围）
// 新增自然方块
var ICE       = 18;  // 冰
var SNOW      = 19;  // 雪
var IRON_ORE  = 20;  // 铁矿石
var GLASS     = 21;  // 玻璃
var OBSIDIAN  = 22;  // 黑曜石
var GRAVEL    = 23;  // 砾石
var RED_SAND  = 24;  // 红沙
var TNT       = 25;  // TNT
var PUMPKIN   = 26;  // 南瓜
var COAL_ORE  = 27;  // 煤矿石
// 新增方块（贴图集扩展）
var BIRCH_LOG      = 28;  // 白桦木
var BIRCH_LEAVES   = 29;  // 白桦叶
var SPRUCE_LOG     = 30;  // 云杉木
var SPRUCE_LEAVES  = 31;  // 云杉叶
var BEDROCK        = 32;  // 基岩
var BLUE_WOOL      = 33;  // 蓝羊毛

// ═══ src/noise.js ═══
// ─── noise.js ─────────────────────────────────────────────────────────────────
// 纯 ES5 实现的 2D Perlin 噪声，无外部依赖。
// 算法：随机置换表 + 梯度向量插值（Ken Perlin 改进版）。
// 仅供地形高度采样，输出范围约 [-1, 1]。

// 512 个随机置换值（前 256 随机打乱后镜像复制，避免越界取模）
var _perm = new Uint8Array(512);
(function () {
  var i, j, t;
  for (i = 0; i < 256; i++) _perm[i] = i;
  // Fisher–Yates shuffle
  for (i = 255; i > 0; i--) {
    j = Math.floor(Math.random() * (i + 1));
    t = _perm[i]; _perm[i] = _perm[j]; _perm[j] = t;
  }
  for (i = 0; i < 256; i++) _perm[i + 256] = _perm[i];
}());

function _fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); } // 平滑曲线
function _lerp(a, b, t) { return a + t * (b - a); }
function _grad(h, x, z) {                                           // 2D 梯度
  switch (h & 3) {
    case 0: return  x + z;
    case 1: return -x + z;
    case 2: return  x - z;
    default: return -x - z;
  }
}

// 采样 (x, z) 处的噪声值，返回 [-1, 1] 近似范围内的浮点数
function noise2D(x, z) {
  var ix = Math.floor(x) & 255, iz = Math.floor(z) & 255;
  var fx = x - Math.floor(x),   fz = z - Math.floor(z);
  var ux = _fade(fx), uz = _fade(fz);
  var aa = _perm[_perm[ix]   + iz],     ab = _perm[_perm[ix]   + iz + 1];
  var ba = _perm[_perm[ix+1] + iz],     bb = _perm[_perm[ix+1] + iz + 1];
  return _lerp(
    _lerp(_grad(aa, fx,   fz),   _grad(ba, fx-1, fz),   ux),
    _lerp(_grad(ab, fx, fz-1), _grad(bb, fx-1, fz-1), ux),
    uz
  );
}

//   局部坐标 (lx, lz)：区块内偏移，[0, CHUNK_W)
//
// 区块数据布局：Uint8Array，索引 = lx + wy*CHUNK_W + lz*CHUNK_W*CHUNK_H
//
// 出生平地：原点附近 32 格内保持平坦（SEA+2），平滑混合到 64 格处恢复正常丘陵。
// 区块按需生成（走到哪生成到哪），不在此处预加载。

var chunks = {};  // 已加载区块，键 = "cx,cz"

function ckey(cx, cz) { return cx + ',' + cz; }
function gchunk(cx, cz) { return chunks[ckey(cx, cz)]; }

// 读取世界坐标方块 ID（区块未加载时返回 AIR，不触发加载）
function getBlock(wx, wy, wz) {
  if (wy < 0)        return STONE;
  if (wy >= CHUNK_H) return AIR;
  var cx = Math.floor(wx / CHUNK_W);
  var cz = Math.floor(wz / CHUNK_D);
  var ch = gchunk(cx, cz);
  if (!ch) return AIR;
  var lx = ((wx % CHUNK_W) + CHUNK_W) % CHUNK_W;
  var lz = ((wz % CHUNK_D) + CHUNK_D) % CHUNK_D;
  return ch.data[lx + wy * CHUNK_W + lz * CHUNK_W * CHUNK_H];
}

// 写入方块并重建受影响的区块网格（含跨边界的相邻区块）
function setBlock(wx, wy, wz, id) {
  if (wy < 0 || wy >= CHUNK_H) return;
  var cx = Math.floor(wx / CHUNK_W);
  var cz = Math.floor(wz / CHUNK_D);
  var ch = gchunk(cx, cz);
  if (!ch) return;
  var lx = ((wx % CHUNK_W) + CHUNK_W) % CHUNK_W;
  var lz = ((wz % CHUNK_D) + CHUNK_D) % CHUNK_D;
  ch.data[lx + wy * CHUNK_W + lz * CHUNK_W * CHUNK_H] = id;
  rebuildChunk(cx, cz);
  if (lx === 0)          rebuildChunk(cx - 1, cz);
  if (lx === CHUNK_W-1)  rebuildChunk(cx + 1, cz);
  if (lz === 0)          rebuildChunk(cx, cz - 1);
  if (lz === CHUNK_D-1)  rebuildChunk(cx, cz + 1);
}

// 地形生成
// 出生区（|wx|<=32 且 |wz|<=32）强制平坦高度 SEA+2，
// 32~64 格平滑混合至正常 Perlin 丘陵，64 格外完全正常。
var _FLAT_H   = SEA + 2;  // 平坦区地表高度
var _FLAT_IN  = 32;       // 纯平坦半径（格）
var _FLAT_OUT = 64;       // 混合结束半径（格）

function genTerrain(cx, cz) {
  var data = new Uint8Array(CHUNK_W * CHUNK_H * CHUNK_D);
  var lx, lz, wx, wz, h, y, id, worldR, blend, noiseH;
  for (lx = 0; lx < CHUNK_W; lx++) {
    for (lz = 0; lz < CHUNK_D; lz++) {
      wx = cx * CHUNK_W + lx;
      wz = cz * CHUNK_D + lz;

      // 切比雪夫距离（方形平地，视觉上更自然）
      worldR = Math.max(Math.abs(wx), Math.abs(wz));
      blend  = Math.max(0, Math.min(1, (worldR - _FLAT_IN) / (_FLAT_OUT - _FLAT_IN)));
      noiseH = Math.floor(SEA + noise2D(wx * SCALE, wz * SCALE) * AMP);
      h      = Math.round(_FLAT_H * (1 - blend) + noiseH * blend);

      // 石头路：城堡南门前 12 格宽，向南延伸 200 格
      var _road = (wx >= -3 && wx <= 8 && wz >= 14 && wz <= 200);
      if (_road) h = SEA + 2;

      // 高铁轨道床：沿 Z 轴，5 格宽，与道路平行
      var _rail = (wx >= 10 && wx <= 14 && wz >= 8 && wz <= 200);
      if (_rail) h = SEA + 2;

      // 公路/轨道两侧缓冲带（各 5 格），削平高出路面的地形
      var _shoulder = (wx >= -8 && wx <= 19 && wz >= 8 && wz <= 205);
      if (_shoulder && h > SEA + 2) h = SEA + 2;

      // 铃鹿赛道平坦区（z=205~3215，x=-900~900）
      var _circuit = (wz >= 205 && wz <= 3215 && wx >= -900 && wx <= 900);
      if (_circuit) h = SEA + 2;

      // 赛道围墙（外圈单格，比地面高 3 格；wx=8~16 处留缺口供轨道通过）
      var _cwall = (
        (wz >= 204 && wz <= 3216 && (wx === -902 || wx === 902)) ||
        (wx >= -902 && wx <= 902 && (wz === 204 || wz === 3216) && (wx < 8 || wx > 16))
      );
      if (_cwall) h = SEA + 5;

      for (y = 0; y <= h && y < CHUNK_H; y++) {
        id = (y === h)    ? ((_cwall || _road || _rail || _circuit) ? STONE : (h <= SEA + 1) ? SAND : GRASS)
           : (y >= h - 3) ? DIRT
           :                STONE;
        data[lx + y * CHUNK_W + lz * CHUNK_W * CHUNK_H] = id;
      }
      for (y = h + 1; y <= SEA; y++) {
        data[lx + y * CHUNK_W + lz * CHUNK_W * CHUNK_H] = WATER;
      }
    }
  }

  // 树木生成（橡树/白桦/云杉；WorldR>40，草地，~3% 概率）
  // 内边距 3 确保半径 3 的树冠完全落在本区块内（不跨区块裁切）
  var tx, tz, twx, twz, twR, th, surfY, treeKind, trunkId, leafId, trunkH, topY, ty, tx2, tz2, rr, dxl, dzl;
  for (tx = 3; tx < CHUNK_W - 3; tx++) {
    for (tz = 3; tz < CHUNK_D - 3; tz++) {
      twx = cx * CHUNK_W + tx;
      twz = cz * CHUNK_D + tz;
      twR = Math.max(Math.abs(twx), Math.abs(twz));
      if (twR < 40) continue;
      if (twx >= -3 && twx <= 8 && twz >= 14 && twz <= 200) continue;  // 路区无树
      if (twx >= 9 && twx <= 15 && twz >= 8 && twz <= 200) continue;  // 轨道区无树
      if (twx >= -902 && twx <= 902 && twz >= 204 && twz <= 3217) continue; // 赛道区无树
      // 确定性伪随机（sin hash，每格唯一）
      th = Math.sin(twx * 127.1 + twz * 311.7) * 43758.5453;
      th = th - Math.floor(th);
      if (th > 0.03) continue;
      // 找草地表面
      surfY = -1;
      for (y = CHUNK_H - 1; y > SEA + 1; y--) {
        if (data[tx + y * CHUNK_W + tz * CHUNK_W * CHUNK_H] === GRASS) { surfY = y; break; }
      }
      if (surfY < 0) continue;
      // 树种：0=橡树 1=白桦 2=云杉
      treeKind = Math.floor(th * 300) % 3;
      trunkId  = (treeKind === 0) ? WOOD         : (treeKind === 1) ? BIRCH_LOG    : SPRUCE_LOG;
      leafId   = (treeKind === 0) ? LEAVES       : (treeKind === 1) ? BIRCH_LEAVES : SPRUCE_LEAVES;
      trunkH   = (treeKind === 0) ? 5 : (treeKind === 1) ? 6 : 7;
      // 树干
      for (ty = surfY + 1; ty <= surfY + trunkH && ty < CHUNK_H; ty++) {
        data[tx + ty * CHUNK_W + tz * CHUNK_W * CHUNK_H] = trunkId;
      }
      topY = surfY + trunkH;

      if (treeKind === 2) {
        // ── 云杉：圆锥形树冠（底宽顶尖，含尖顶）──
        var spruceLayers = [[topY - 3, 2], [topY - 2, 2], [topY - 1, 1], [topY, 1], [topY + 1, 0]];
        for (var sl = 0; sl < spruceLayers.length; sl++) {
          ty = spruceLayers[sl][0]; rr = spruceLayers[sl][1];
          if (ty < 0 || ty >= CHUNK_H) continue;
          for (tx2 = tx - rr; tx2 <= tx + rr; tx2++) {
            for (tz2 = tz - rr; tz2 <= tz + rr; tz2++) {
              dxl = Math.abs(tx2 - tx); dzl = Math.abs(tz2 - tz);
              if (rr === 2 && dxl === 2 && dzl === 2) continue;  // 削去最外四角
              if (data[tx2 + ty * CHUNK_W + tz2 * CHUNK_W * CHUNK_H] === AIR)
                data[tx2 + ty * CHUNK_W + tz2 * CHUNK_W * CHUNK_H] = leafId;
            }
          }
        }
      } else {
        // ── 橡树/白桦：圆球形树冠 ──
        //   下两层 5×5（去四角）、第三层 3×3、顶层十字
        for (ty = topY - 2; ty <= topY + 2 && ty < CHUNK_H; ty++) {
          if (ty < 0) continue;
          rr = (ty <= topY) ? 2 : (ty === topY + 1) ? 1 : 1;
          for (tx2 = tx - rr; tx2 <= tx + rr; tx2++) {
            for (tz2 = tz - rr; tz2 <= tz + rr; tz2++) {
              dxl = Math.abs(tx2 - tx); dzl = Math.abs(tz2 - tz);
              // 5×5 层削四角、顶层只留十字（防止方块感）
              if (rr === 2 && dxl === 2 && dzl === 2) continue;
              if (ty === topY + 2 && dxl + dzl > 1) continue;
              if (data[tx2 + ty * CHUNK_W + tz2 * CHUNK_W * CHUNK_H] === AIR)
                data[tx2 + ty * CHUNK_W + tz2 * CHUNK_W * CHUNK_H] = leafId;
            }
          }
        }
      }
    }
  }

  return data;
}

// ─── renderer.js ──────────────────────────────────────────────────────────────

renderer.setSize(window.innerWidth, window.innerHeight, false);

// ═══ src/sky.js ═══
// ─── sky.js ───────────────────────────────────────────────────────────────────
// 自然天空系统：昼夜循环 + 太阳/月亮 + 漂移云层 + 天气状态机（晴/多云/雨）。

// 昼夜：DAY_LEN 秒一整天。skyTime 0.25=日出、0.5=正午、0.75=日落、0/1=午夜。

//
// 联动渲染管线：
//   天空穹顶顶点色   — 每帧按配色重算（170 个顶点，开销可忽略）
//   雾色             — 始终等于地平线色，远景无缝融入天空
//   地形亮度         — mesh.js 的 _mat.color 全局乘数（MeshBasicMaterial 不受灯光影响）
//   半球光/平行光    — 跟随太阳方向与强度，作用于玩家/NPC 的 Lambert 材质
//
// 天气状态机：晴 → 多云 ⇄ 雨，随机时长，参数（云量/亮度/雾距/雨强）平滑过渡。
// 云：两层体素风扁平四边形（noise2D 阈值取格），常驻层 + 阴天增量层，随风漂移。
// 雨：相机周围圆柱体内 300 条短线段下落循环，仅雨强 >0 时更新和显示。

var DAY_LEN = 600;          // 一整天 600 秒（10 分钟）
var skyTime = 0.42;         // 固定在下午（昼夜循环已关闭）

// ── 天空穹顶（顶点色渐变，每帧重算）────────────────────────────────────────────
var _domeGeo = new THREE.SphereGeometry(170, 16, 9);
var _domeT = [];                       // 每顶点渐变因子 0=地平线 1=天顶
(function () {
  var pos = _domeGeo.attributes.position.array;
  var n = _domeGeo.attributes.position.count;
  var col = new Float32Array(n * 3);
  for (var i = 0; i < n; i++) {
    var yN = pos[i * 3 + 1] / 170;
    _domeT.push(Math.max(0, Math.min(1, (yN + 0.2) / 1.2)));

  _domeGeo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
}());
var _dome = new THREE.Mesh(
  _domeGeo,
  new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, depthWrite: false, fog: false })
);
_dome.renderOrder = -3;
scene.add(_dome);

// 三套配色 [地平线 r,g,b, 天顶 r,g,b]
var _SKY_DAY   = [0.557, 0.773, 0.961,  0.102, 0.373, 0.780];
var _SKY_DUSK  = [0.969, 0.604, 0.333,  0.275, 0.243, 0.490];
var _SKY_NIGHT = [0.043, 0.063, 0.125,  0.010, 0.020, 0.060];

// ── 太阳 / 月亮圆盘 ────────────────────────────────────────────────────────────
function _disc(radius, color, opacity) {

    new THREE.CircleGeometry(radius, 20),
    new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: opacity, depthWrite: false, fog: false })

  scene.add(m);
  return m;
}
var _sunDisc  = _disc(9, 0xfff3c0, 1);
var _sunGlow  = _disc(16, 0xffd980, 0.25);   // 太阳光晕
var _moonDisc = _disc(6, 0xdfe8f5, 1);

// ── 灯光（作用于玩家/NPC Lambert 材质；地形亮度走 _mat.color）──────────────────
var _hemi = new THREE.HemisphereLight(0x87ceeb, 0x4a6741, 1.2);
scene.add(_hemi);
var _sunLight = new THREE.DirectionalLight(0xfff4e0, 0.55);
_sunLight.position.set(2, 5, 1);
scene.add(_sunLight);

// ── 云层（体素风扁平四边形，noise 取格）────────────────────────────────────────
var CLOUD_Y = 46, CLOUD_CELL = 14, CLOUD_GRID = 26;   // 26×26 格 ≈ 364×364

    for (var j = 0; j < CLOUD_GRID; j++) {
      var v = noise2D(i * 0.21 + 53.7, j * 0.21 + 17.3);
      if (v <= thLo || v > thHi) continue;
      var x0 = (i - half) * CLOUD_CELL, z0 = (j - half) * CLOUD_CELL;
      var x1 = x0 + CLOUD_CELL, z1 = z0 + CLOUD_CELL;
      pos.push(x0,0,z0, x1,0,z0, x1,0,z1,  x0,0,z0, x1,0,z1, x0,0,z1);

  var mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0,
    side: THREE.DoubleSide, depthWrite: false

  scene.add(mesh);

}
var _cloudA = _buildClouds(0.32, 9);      // 常驻稀疏云
var _cloudB = _buildClouds(0.10, 0.32);   // 阴天增量云（晴天透明）
var _cloudDrift = 0;

// ── 雨（相机周围圆柱体内的下落线段）────────────────────────────────────────────
var RAIN_N = 300, RAIN_R = 18, RAIN_H = 26;

(function () {

    _rainBase[i * 3]     = Math.cos(a) * r;
    _rainBase[i * 3 + 1] = Math.random() * RAIN_H;
    _rainBase[i * 3 + 2] = Math.sin(a) * r;

var _rainGeo = new THREE.BufferGeometry();
_rainGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(RAIN_N * 6), 3));
var _rainMat = new THREE.LineBasicMaterial({ color: 0xa8bdd8, transparent: true, opacity: 0 });
var _rain = new THREE.LineSegments(_rainGeo, _rainMat);
_rain.visible = false;
_rain.frustumCulled = false;
scene.add(_rain);
var _rainFall = 0;   // 下落相位

// ── 天气状态机 ─────────────────────────────────────────────────────────────────
// 目标参数表 [增量云不透明度, 常驻云不透明度, 天光系数, 雨强, 雾近, 雾远]
var _WEATHER = [
  [0.00, 0.75, 1.00, 0, 55, 105],   // 0 晴
  [0.70, 0.85, 0.82, 0, 45,  95],   // 1 多云
  [0.92, 0.92, 0.55, 1, 30,  72],   // 2 雨
];
var _wState = 0, _wTimer = 60 + Math.random() * 90;
// 当前平滑值（从晴天参数出发）
var _wCur = [0, 0.75, 1, 0, 55, 105];

function _nextWeather() {
  if (_wState === 0)      _wState = 1;                              // 晴 → 多云
  else if (_wState === 1) _wState = Math.random() < 0.45 ? 2 : 0;   // 多云 → 雨/晴
  else                    _wState = 1;                              // 雨 → 多云
  if (_wState === 0)      _wTimer = 90 + Math.random() * 120;
  else if (_wState === 1) _wTimer = 45 + Math.random() * 60;
  else                    _wTimer = 40 + Math.random() * 50;
}

// ── 每帧更新（game.js tick 调用）──────────────────────────────────────────────
function updateSky(dt) {
  // skyTime 已固定，无昼夜循环
  var ang  = (skyTime - 0.25) * Math.PI * 2;
  var elev = Math.sin(ang);                          // 太阳仰角 -1..1

  // 天气推进 + 参数平滑
  _wTimer -= dt;
  if (_wTimer <= 0) _nextWeather();
  var tgt = _WEATHER[_wState], k = Math.min(1, 0.4 * dt), i;
  for (i = 0; i < 6; i++) _wCur[i] += (tgt[i] - _wCur[i]) * k;
  var wLight = _wCur[2], rainStr = _wCur[3];

  // 昼/晨昏/夜混合权重
  var wDay   = Math.max(0, Math.min(1, elev * 4));
  var wNight = Math.max(0, Math.min(1, -elev * 4));
  var wDusk  = Math.max(0, 1 - Math.abs(elev) * 4) * 0.9;
  var wSum   = wDay + wNight + wDusk;
  wDay /= wSum; wNight /= wSum; wDusk /= wSum;

  // 混合后的地平线/天顶色 × 天气系数
  var hz = [], zen = [];
  for (i = 0; i < 3; i++) {
    hz[i]  = (_SKY_DAY[i]   * wDay + _SKY_DUSK[i]   * wDusk + _SKY_NIGHT[i]   * wNight) * wLight;
    zen[i] = (_SKY_DAY[i+3] * wDay + _SKY_DUSK[i+3] * wDusk + _SKY_NIGHT[i+3] * wNight) * wLight;
  }

  // 穹顶顶点色 + 跟随相机
  var col = _domeGeo.attributes.color.array;
  for (i = 0; i < _domeT.length; i++) {
    var t = _domeT[i];
    col[i * 3]     = hz[0] + (zen[0] - hz[0]) * t;
    col[i * 3 + 1] = hz[1] + (zen[1] - hz[1]) * t;
    col[i * 3 + 2] = hz[2] + (zen[2] - hz[2]) * t;
  }

    scene.fog.color.setRGB(hz[0], hz[1], hz[2]);
    scene.fog.near = _wCur[4];
    scene.fog.far  = _wCur[5];

  _sunDisc.position.set(camera.position.x + sx * 150, camera.position.y + sy * 150, camera.position.z + sz * 150);
  _sunGlow.position.copy(_sunDisc.position);
  _moonDisc.position.set(camera.position.x - sx * 150, camera.position.y - sy * 150, camera.position.z - sz * 150);
  _sunDisc.lookAt(camera.position);
  _sunGlow.lookAt(camera.position);
  _moonDisc.lookAt(camera.position);
  // 日出日落偏橙；落到地平线下淡出
  var sunFade = Math.max(0, Math.min(1, (elev + 0.08) * 8)) * Math.max(0.25, wLight);
  _sunDisc.material.color.setRGB(1, 0.82 + wDay * 0.13, 0.55 + wDay * 0.2);
  _sunDisc.material.opacity = sunFade;
  _sunGlow.material.opacity = sunFade * 0.25;
  _moonDisc.material.opacity = Math.max(0, Math.min(1, (-elev + 0.05) * 6)) * Math.max(0.3, wLight);

  // 灯光：白天太阳，夜晚弱月光
  _sunLight.position.set(sx, Math.max(sy, 0.05), sz);
  _sunLight.intensity = 0.55 * wDay * wLight + 0.08 * wNight;
  _sunLight.color.setRGB(1, 0.86 + wDay * 0.1, 0.72 + wDay * 0.16);
  _hemi.intensity = (0.3 + 1.0 * wDay + 0.25 * wDusk) * wLight;

  // 地形亮度（MeshBasicMaterial 全局乘数）：夜晚保留最低可见度
  var b = (0.22 + 0.78 * (wDay + wDusk * 0.55)) * (0.55 + 0.45 * wLight);
  if (typeof _mat !== 'undefined') _mat.color.setScalar(b);

  // 云：随风漂移 + 跟随相机（按格吸附避免重定位时滑动）
  _cloudDrift += dt * 1.6;
  var snapX = Math.round((camera.position.x - _cloudDrift) / CLOUD_CELL) * CLOUD_CELL + _cloudDrift;
  var snapZ = Math.round(camera.position.z / CLOUD_CELL) * CLOUD_CELL;
  _cloudA.position.set(snapX, CLOUD_Y, snapZ);
  _cloudB.position.set(snapX, CLOUD_Y + 2, snapZ);
  _cloudA.material.opacity = _wCur[1] * (0.35 + 0.65 * Math.max(wDay, 0.25));
  _cloudB.material.opacity = _wCur[0] * (0.35 + 0.65 * Math.max(wDay, 0.25));
  // 夜晚云偏暗
  var cb = 0.35 + 0.65 * wDay;
  _cloudA.material.color.setScalar(cb);
  _cloudB.material.color.setScalar(cb * 0.92);

  // 雨
  if (rainStr > 0.02) {
    _rain.visible = true;
    _rainMat.opacity = rainStr * 0.45;
    _rainFall = (_rainFall + dt * 34) % RAIN_H;
    var rp = _rainGeo.attributes.position.array;
    for (i = 0; i < RAIN_N; i++) {
      var rx = _rainBase[i * 3], ry0 = _rainBase[i * 3 + 1], rz = _rainBase[i * 3 + 2];
      var ry = ((ry0 - _rainFall) % RAIN_H + RAIN_H) % RAIN_H;   // 0..RAIN_H 循环下落
      rp[i * 6]     = rx; rp[i * 6 + 1] = ry;        rp[i * 6 + 2] = rz;
      rp[i * 6 + 3] = rx; rp[i * 6 + 4] = ry - 0.7;  rp[i * 6 + 5] = rz;
    }
    _rainGeo.attributes.position.needsUpdate = true;
    _rain.position.set(camera.position.x, camera.position.y - 4, camera.position.z);
  } else {
    _rain.visible = false;
  }
}

// 单格处理：染色（multiply 保留 alpha）后画入贴图集
function _drawTile(ctx, img, spec, dx, dy) {
  if (spec.backdrop) {
    ctx.fillStyle = spec.backdrop;
    ctx.fillRect(dx, dy, TILE, TILE);
  }

  if (!spec.tint) {
    // 按图片真实尺寸裁切后缩放填满 TILE×TILE（兼容 16×16 和 128×128 贴图）
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, 0, 0, img.width, img.height, dx, dy, TILE, TILE);
    return;
  }

  // 离屏染色：画原图 → multiply 乘色 → destination-in 恢复原 alpha
  var oc = document.createElement('canvas');
  oc.width = oc.height = TILE;
  var octx = oc.getContext('2d');
  octx.imageSmoothingEnabled = false;
  octx.drawImage(img, 0, 0, img.width, img.height, 0, 0, TILE, TILE);
  octx.globalCompositeOperation = 'multiply';
  octx.fillStyle = spec.tint;
  octx.fillRect(0, 0, TILE, TILE);
  octx.globalCompositeOperation = 'destination-in';
  octx.drawImage(img, 0, 0, TILE, TILE, 0, 0, TILE, TILE);
  ctx.drawImage(oc, dx, dy);
}

function loadTextures(onReady, onProgress) {
  var W = ATLAS_COLS * TILE, H = ATLAS_ROWS * TILE;
  var cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  var ctx = cv.getContext('2d');

  var imgs = [], total = _TILES.length, done = 0;

  function allLoaded() {
    var i, dx, dy;
    for (i = 0; i < total; i++) {
      dx = (i % ATLAS_COLS) * TILE;
      dy = ((i / ATLAS_COLS) | 0) * TILE;
      if (imgs[i]) {
        _drawTile(ctx, imgs[i], _TILES[i], dx, dy);
      } else {
        ctx.fillStyle = '#ff00ff';   // 加载失败：洋红占位
        ctx.fillRect(dx, dy, TILE, TILE);
      }
    }
    // 贴图集禁用 mipmap：缩小级别会把相邻贴图格颜色混入（atlas bleeding），
    // 远景方块串色。Kenney 贴图为低频平滑风格，Linear 缩小的闪烁可忽略。
    atlasTexture = new THREE.CanvasTexture(cv);
    atlasTexture.magFilter = THREE.NearestFilter;
    atlasTexture.minFilter = THREE.NearestFilter;
    atlasTexture.generateMipmaps = false;
    atlasTexture.needsUpdate = true;
    onReady();
  }

  _TILES.forEach(function (spec, i) {
    var img = new Image();
    img.onload  = function () {
      imgs[i] = img;
      done++;
      if (onProgress) onProgress(done, total, spec.file);
      if (done === total) allLoaded();
    };
    img.onerror = function () {
      imgs[i] = null;
      done++;
      if (onProgress) onProgress(done, total, spec.file + '(!)');
      if (done === total) allLoaded();
    };
    img.src = 'assets/textures/block/' + spec.file + '.png';
  });
}

// ─── mesh.js ──────────────────────────────────────────────────────────────────
// 区块网格构建：方块数据 → Three.js BufferGeometry（带贴图 UV）。
//
// 材质策略：MeshBasicMaterial + vertexColors + map（贴图集）
//   顶点色为灰度亮度值（= FSHADE[面方向]），贴图为 atlasTexture（textures.js 生成）。
//   最终颜色 = 顶点灰度 × 贴图像素颜色，等同于"带方向明暗的有贴图方块"。
//
// UV 坐标规则（两种，按面朝向区分）：
//   侧面（±X/±Z）：底部顶点→ v_low，顶部顶点→ v_high，保证草地绿条在顶、木纹垂直
//   顶/底面（±Y）：标准矩形映射

// atlasTexture 在 loadTextures() 回调后才就绪，_mat.map 由 game.js bootNext 更新
// 所有贴图在组装时已合成为完全不透明（见 textures.js），无需 alphaTest
var _mat = new THREE.MeshBasicMaterial({
  vertexColors: true,
  map: null,
  alphaTest: 0.5,            // 镂空：花草贴图透明像素直接丢弃（实心块贴图全不透明，alpha=1 照常通过）
  side: THREE.DoubleSide     // 十字花草两面可见
});

// 植物方块（十字贴图渲染、非实心、不遮挡邻面）。值在 constants.js 加载后已就绪。
var _PLANT = {};
_PLANT[DANDELION]   = 1;
_PLANT[POPPY]       = 1;
_PLANT[OAK_SAPLING] = 1;
_PLANT[GRASS_PLANT] = 1;

// UV 半像素内缩：避免在贴图集边缘采样到相邻格的颜色（atlas bleeding）
var _UV_EPS_U = 0.5 / (ATLAS_COLS * TILE);  // 半像素（U 方向）
var _UV_EPS_V = 0.5 / (ATLAS_ROWS * TILE);  // 半像素（V 方向）

function buildMesh(cx, cz, data) {
  var pos = [], col = [], uv = [];
  var lx, y, lz, id, wx, wz, f, fd, nb, sh, ti, tc, tr, u0, u1, v0, v1, cn;

  for (lx = 0; lx < CHUNK_W; lx++) {
    for (y = 0; y < CHUNK_H; y++) {
      for (lz = 0; lz < CHUNK_D; lz++) {
        id = data[lx + y * CHUNK_W + lz * CHUNK_W * CHUNK_H];
        if (id === AIR) continue;

        wx = cx * CHUNK_W + lx;
        wz = cz * CHUNK_D + lz;

        // ── 植物：十字双面贴图（两个对角四边形），跳过常规六面立方体 ──
        if (_PLANT[id]) {
          ti = BTEX[id][1];
          tc = ti % ATLAS_COLS;
          tr = (ti / ATLAS_COLS) | 0;
          u0 = tc / ATLAS_COLS + _UV_EPS_U;
          u1 = (tc + 1) / ATLAS_COLS - _UV_EPS_U;
          v1 = 1 - tr / ATLAS_ROWS - _UV_EPS_V;
          v0 = 1 - (tr + 1) / ATLAS_ROWS + _UV_EPS_V;
          // 对角面 A：(0,0)→(1,1)
          pos.push(
            wx,   y,   wz,    wx+1, y,   wz+1,  wx+1, y+1, wz+1,
            wx,   y,   wz,    wx+1, y+1, wz+1,  wx,   y+1, wz
          );
          // 对角面 B：(1,0)→(0,1)
          pos.push(
            wx+1, y,   wz,    wx,   y,   wz+1,  wx,   y+1, wz+1,
            wx+1, y,   wz,    wx,   y+1, wz+1,  wx+1, y+1, wz
          );
          // 植物用 BCOL 顶色着色（草丛=绿，蒲公英=黄，虞美人=红），保留贴图细节
          var _pc = BCOL[id]; var _pr = _pc?_pc[0]:1, _pg = _pc?_pc[1]:1, _pb = _pc?_pc[2]:1;
          for (var _pv = 0; _pv < 12; _pv++) col.push(_pr, _pg, _pb);
          uv.push(u0,v0, u1,v0, u1,v1,  u0,v0, u1,v1, u0,v1);
          uv.push(u0,v0, u1,v0, u1,v1,  u0,v0, u1,v1, u0,v1);
          continue;
        }

        for (f = 0; f < 6; f++) {
          fd = FACES[f];
          nb = getBlock(wx + fd[0], y + fd[1], wz + fd[2]);
          if (nb !== AIR && nb !== WATER && !_PLANT[nb]) continue;
          if (id === WATER && f !== 2) continue;

          sh = FSHADE[f];  // 顶点灰度亮度

          // BTEX[id][0=顶, 1=侧, 2=底]，fd[4]: 0=顶面, 3=底面, 6=侧面
          ti = BTEX[id][fd[4] === 0 ? 0 : (fd[4] === 3 ? 2 : 1)];
          tc = ti % ATLAS_COLS;
          tr = (ti / ATLAS_COLS) | 0;
          // 半像素内缩，防止采样到相邻贴图格
          u0 = tc / ATLAS_COLS + _UV_EPS_U;
          u1 = (tc + 1) / ATLAS_COLS - _UV_EPS_U;
          // Three.js UV v=0 在图片底部，v=1 在顶部（与 canvas y 轴相反）
          v1 = 1 - tr / ATLAS_ROWS - _UV_EPS_V;        // 贴图格顶边
          v0 = 1 - (tr + 1) / ATLAS_ROWS + _UV_EPS_V;  // 贴图格底边

          cn = fd[3];
          pos.push(
            wx+cn[0], y+cn[1],  wz+cn[2],
            wx+cn[3], y+cn[4],  wz+cn[5],
            wx+cn[6], y+cn[7],  wz+cn[8],
            wx+cn[0], y+cn[1],  wz+cn[2],
            wx+cn[6], y+cn[7],  wz+cn[8],
            wx+cn[9], y+cn[10], wz+cn[11]
          );
          col.push(sh,sh,sh, sh,sh,sh, sh,sh,sh, sh,sh,sh, sh,sh,sh, sh,sh,sh);

          // 侧面（fd[1]===0 即 ±X/±Z）：
          //   四个角点中 v0,v3 在 y=0（底），v1,v2 在 y=1（顶）
          //   → v_low 给底，v_high 给顶，确保草皮绿条显示在顶部
          // 顶/底面（fd[1]≠0）：标准矩形 UV
          if (fd[1] === 0) {
            uv.push(u0,v0, u0,v1, u1,v1,  u0,v0, u1,v1, u1,v0);
          } else {
            uv.push(u0,v1, u1,v1, u1,v0,  u0,v1, u1,v0, u0,v0);
          }
        }
      }
    }
  }

  if (pos.length === 0) return null;

  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.Float32BufferAttribute(col, 3));
  geo.setAttribute('uv',       new THREE.Float32BufferAttribute(uv,  2));
  return new THREE.Mesh(geo, _mat);
}

function rebuildChunk(cx, cz) {
  var ch = gchunk(cx, cz);
  if (!ch) return;
  if (ch.mesh) { scene.remove(ch.mesh); ch.mesh.geometry.dispose(); ch.mesh = null; }
  ch.mesh = buildMesh(cx, cz, ch.data);
  if (ch.mesh) scene.add(ch.mesh);
}

function createChunk(cx, cz) {
  var k = ckey(cx, cz);
  if (chunks[k]) return;
  chunks[k] = { data: genTerrain(cx, cz), mesh: null };
}

// 卸载区块：只移除网格，保留方块数据。
// 数据若删除，走远再回来会从噪声重新生成——建筑和玩家改动全部丢失。
// 每块数据 16KB，常规游玩累计内存可忽略。
function removeChunk(cx, cz) {
  var k = ckey(cx, cz);
  var ch = chunks[k];
  if (!ch) return;
  if (ch.mesh) { scene.remove(ch.mesh); ch.mesh.geometry.dispose(); ch.mesh = null; }
}


// ═══ src/physics.js ═══
// ─── physics.js ───────────────────────────────────────────────────────────────
// AABB 碰撞解算。
//
// 算法：穿透深度最小轴推出（非扫描式）
//   遍历玩家碰撞箱范围内所有实心方块，
//   计算在 X/Y/Z 三轴上的穿透深度，沿最小穿透轴将玩家推出去。
//
// 玩家碰撞箱：以 (player.x, player.y, player.z) 为底部中心，
//   宽度 PR×2，高度 PH（见 constants.js）。
// 水方块视为非实心（玩家可以穿过水面）。

function resolveAABB() {
  var hw = PR, hh = PH;
  var x0 = player.x - hw, x1 = player.x + hw;
  var y0 = player.y,      y1 = player.y + hh;
  var z0 = player.z - hw, z1 = player.z + hw;
  var bx, by, bz, bid, ox, oy, oz;

  for (bx = Math.floor(x0); bx <= Math.floor(x1); bx++) {
    for (by = Math.floor(y0); by <= Math.floor(y1); by++) {
      for (bz = Math.floor(z0); bz <= Math.floor(z1); bz++) {
        bid = getBlock(bx, by, bz);
        var _solid = !(bid === AIR || bid === WATER || _PLANT[bid]);
        if (!_solid && _furnitureSolid[bx + ',' + by + ',' + bz]) _solid = true;
        if (!_solid) continue;

        // 三轴穿透深度
        ox = Math.min(player.x + hw - bx,  bx + 1 - (player.x - hw));
        oy = Math.min(player.y + hh - by,  by + 1 - player.y);
        oz = Math.min(player.z + hw - bz,  bz + 1 - (player.z - hw));
        if (ox <= 0 || oy <= 0 || oz <= 0) continue;  // 实际未重叠

        // 沿穿透最小的轴推出
        if (oy < ox && oy < oz) {
          // Y 轴：落地或撞天花板
          if (player.y + hh / 2 < by + 0.5) {
            player.y -= oy;
            player.vy = Math.min(player.vy, 0);
          } else {
            player.y += oy;
            player.vy = Math.max(player.vy, 0);
            player.onGround = true;
          }
        } else if (ox < oz) {
          // X 轴
          player.x += (player.x < bx + 0.5) ? -ox : ox;
          player.vx = 0;
        } else {
          // Z 轴
          player.z += (player.z < bz + 0.5) ? -oz : oz;
          player.vz = 0;
        }
      }
    }
  }
}


// ═══ src/raycast.js ═══
// ─── raycast.js ───────────────────────────────────────────────────────────────
// 步进式射线检测，用于挖方块和放方块的目标定位。
//
// 算法：从摄像机眼睛位置沿视线方向每 0.05 单位步进一次，
//   遇到第一个实心（非 AIR/WATER）方块时停止。
//
// 返回值：
//   { x, y, z }  — 被瞄准的方块坐标
//   { prev }     — 该方块前一步的位置（用于放置：新方块放在此处）
//   null         — 射程内无目标
//
// 视线方向由 player.yaw/pitch 决定（见 constants.js 约定）：
//   forward = (-sin(yaw)*cos(pitch),  sin(pitch),  -cos(yaw)*cos(pitch))

function raycast(maxD) {
  var cp = Math.cos(player.pitch), sp = Math.sin(player.pitch);
  var dx = -Math.sin(player.yaw) * cp;
  var dy = sp;
  var dz = -Math.cos(player.yaw) * cp;

  // 射线起点：玩家眼睛位置（+ 第三人称时的右肩偏移）。
  // 第三人称相机右偏 CAM_SHOULDER 且朝向平行 → 屏幕中心射线 = 眼睛射线右移同量，
  // 起点同步右移后准星点与破坏/放置目标严格一致；第一人称相机即眼睛，无偏移。
  var sh = viewFP ? 0 : CAM_SHOULDER;
  var ox = player.x + Math.cos(player.yaw) * sh;
  var oy = player.y + PH * 0.85;
  var oz = player.z - Math.sin(player.yaw) * sh;

  var prev = null, d, bx, by, bz, id;
  for (d = 0; d < maxD; d += 0.05) {
    bx = Math.floor(ox + dx * d);
    by = Math.floor(oy + dy * d);
    bz = Math.floor(oz + dz * d);
    id = getBlock(bx, by, bz);
    if (id !== AIR && id !== WATER) return { x: bx, y: by, z: bz, prev: prev };
    prev = { x: bx, y: by, z: bz };
  }
  return null;
}


// ═══ src/controls.js ═══
// ─── controls.js ──────────────────────────────────────────────────────────────
// 移动端触屏控制：虚拟摇杆 + 视角滑动 + 动作按钮。
//
// 屏幕分区：
//   左侧 42%（#joy-zone）：虚拟摇杆，单点追踪，最大偏移 48px
//   右侧 58%（#look-zone）：自由视角，拖动增量更新 yaw/pitch
//
// 虚拟摇杆（joy）：
//   joy.dx/dy  — 摇杆偏移像素（-48 到 +48），由 game.js 每帧读取
//   偏移换算为移动速度：joy.dx/48 ∈ [-1, 1]
//
// 视角控制：
//   水平拖动 → player.yaw   -= delta × 0.005
//   垂直拖动 → player.pitch -= delta × 0.005
//   pitch 限制在 [-1.2, 1.2] rad（避免极端视角）
//
// 破坏/放置按钮支持长按：
//   touchstart → 设置 player.breakQ/placeQ=true 并标记 breakHeld/placeHeld
//   touchend   → 清除 breakHeld/placeHeld（单次触发由 game.js 消费，持续由 held 驱动）

var joy     = { active: false, id: -1, cx: 0, cy: 0, dx: 0, dy: 0 };
var lookAct = false, lookId = -1, lookLx = 0, lookLy = 0;

// 长按标志：game.js 在 tick 中读取
// breakHeld/placeHeld 配合冷却计时实现持续挖/放
// jumpHeld/downHeld 在飞行模式下作为升/降油门
var breakHeld = false, placeHeld = false;
var jumpHeld  = false, downHeld  = false;

var JOY_R = 48;  // 摇杆最大偏移半径（像素）

var joyZone  = document.getElementById('joy-zone');
var joyThumb = document.getElementById('joy-thumb');
var joyBase  = document.getElementById('joy-base');
var lookZone = document.getElementById('look-zone');

// ── 摇杆 ──────────────────────────────────────────────────────────────────────
joyZone.addEventListener('touchstart', function (e) {
  e.preventDefault();
  var i, t, r;
  for (i = 0; i < e.changedTouches.length; i++) {
    t = e.changedTouches[i];
    if (joy.active) continue;
    joy.active = true; joy.id = t.identifier;
    r = joyBase.getBoundingClientRect();
    joy.cx = r.left + r.width / 2;
    joy.cy = r.top  + r.height / 2;
    joy.dx = 0; joy.dy = 0;
  }
}, { passive: false });

joyZone.addEventListener('touchmove', function (e) {
  e.preventDefault();
  var i, t;
  for (i = 0; i < e.changedTouches.length; i++) {
    t = e.changedTouches[i];
    if (t.identifier !== joy.id) continue;
    joy.dx = Math.max(-JOY_R, Math.min(JOY_R, t.clientX - joy.cx));
    joy.dy = Math.max(-JOY_R, Math.min(JOY_R, t.clientY - joy.cy));
    joyThumb.style.transform =
      'translate(calc(-50% + ' + joy.dx + 'px),calc(-50% + ' + joy.dy + 'px))';
  }
}, { passive: false });

function jEnd(e) {
  e.preventDefault();
  var i;
  for (i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === joy.id) {
      joy.active = false; joy.dx = 0; joy.dy = 0;
      joyThumb.style.transform = 'translate(-50%,-50%)';
    }
  }
}
joyZone.addEventListener('touchend',    jEnd, { passive: false });
joyZone.addEventListener('touchcancel', jEnd, { passive: false });

// ── 视角滑动 ──────────────────────────────────────────────────────────────────
lookZone.addEventListener('touchstart', function (e) {
  e.preventDefault();
  var i, t;
  for (i = 0; i < e.changedTouches.length; i++) {
    t = e.changedTouches[i];
    if (lookAct) continue;
    lookAct = true; lookId = t.identifier;
    lookLx = t.clientX; lookLy = t.clientY;
  }
}, { passive: false });

lookZone.addEventListener('touchmove', function (e) {
  e.preventDefault();
  var i, t;
  for (i = 0; i < e.changedTouches.length; i++) {
    t = e.changedTouches[i];
    if (t.identifier !== lookId) continue;
    var dyaw = (t.clientX - lookLx) * 0.005;
    // 驾驶时：滑动只转相机，不转车头
    if (typeof _mountedVehicle !== 'undefined' && _mountedVehicle) {
      _driveCamYaw -= dyaw;
    } else {
      player.yaw -= dyaw;
    }
    player.pitch -= (t.clientY - lookLy) * 0.005;
    // ±89°（原版 ±90°；留 1° 余量避免万向锁奇点）
    player.pitch  = Math.max(-1.55, Math.min(1.55, player.pitch));
    lookLx = t.clientX; lookLy = t.clientY;
  }
}, { passive: false });

function lEnd(e) {
  e.preventDefault();
  var i;
  for (i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === lookId) lookAct = false;
  }
}
lookZone.addEventListener('touchend',    lEnd, { passive: false });
lookZone.addEventListener('touchcancel', lEnd, { passive: false });

// ═══ src/ui.js ═══
// ─── ui.js ────────────────────────────────────────────────────────────────────
// 游戏 UI：热键栏渲染、槽位选择、仓库面板。
// 每个槽位用 canvas 绘制等轴测微型方块图标（三面：顶/左/右），逼真展示方块外观。

var HOTBAR_N = 8;
var _bagEl = null;

// 在 68×68 离屏 canvas 上绘制等轴测方块图标（2× 超采样，显示时缩到 34）
function _drawBlockIcon(cv, id) {
  var ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, 68, 68);
  var cs = BCOL[id];
  if (!cs) return;

  var s = 22, cx = 34, cy = 14;
  // 三面颜色
  var tR = Math.round(cs[0]*255), tG = Math.round(cs[1]*255), tB = Math.round(cs[2]*255);
  var sR = Math.round(cs[6]*255), sG = Math.round(cs[7]*255), sB = Math.round(cs[8]*255);

  // 右面（最暗）
  ctx.beginPath();
  ctx.moveTo(cx,   cy+s);
  ctx.lineTo(cx+s, cy+s*0.5);
  ctx.lineTo(cx+s, cy+s*1.5);
  ctx.lineTo(cx,   cy+s*2);
  ctx.closePath();
  ctx.fillStyle = 'rgb('+Math.round(sR*0.52)+','+Math.round(sG*0.52)+','+Math.round(sB*0.52)+')';
  ctx.fill();

  // 左面（中等亮度）
  ctx.beginPath();
  ctx.moveTo(cx-s, cy+s*0.5);
  ctx.lineTo(cx,   cy+s);
  ctx.lineTo(cx,   cy+s*2);
  ctx.lineTo(cx-s, cy+s*1.5);
  ctx.closePath();
  ctx.fillStyle = 'rgb('+Math.round(sR*0.72)+','+Math.round(sG*0.72)+','+Math.round(sB*0.72)+')';
  ctx.fill();

  // 顶面（最亮）
  ctx.beginPath();
  ctx.moveTo(cx,   cy);
  ctx.lineTo(cx+s, cy+s*0.5);
  ctx.lineTo(cx,   cy+s);
  ctx.lineTo(cx-s, cy+s*0.5);
  ctx.closePath();
  ctx.fillStyle = 'rgb('+tR+','+tG+','+tB+')';
  ctx.fill();

  // 棱线描边
  ctx.strokeStyle = 'rgba(0,0,0,0.28)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(cx-s, cy+s*0.5); ctx.lineTo(cx, cy);
  ctx.lineTo(cx+s, cy+s*0.5); ctx.lineTo(cx, cy+s); ctx.lineTo(cx-s, cy+s*0.5);
  ctx.moveTo(cx, cy+s);  ctx.lineTo(cx, cy+s*2);
  ctx.moveTo(cx, cy+s);  ctx.lineTo(cx+s, cy+s*0.5);
  ctx.moveTo(cx, cy+s*2); ctx.lineTo(cx+s, cy+s*1.5);
  ctx.moveTo(cx, cy+s*2); ctx.lineTo(cx-s, cy+s*1.5);
  ctx.stroke();
}

// 返回固定尺寸 <img>（而非 <canvas>）：img 的 width/height 属性是硬约束，
// 任何移动端浏览器都不会让它溢出撑坏热键栏（canvas 的 CSS 尺寸在部分 WebView 里失效）。
function _makeSlotIcon(id) {
  var cv = document.createElement('canvas');
  cv.width = 68; cv.height = 68;     // 2× 离屏画布，仅用于绘制
  _drawBlockIcon(cv, id);
  var img = document.createElement('img');
  img.width = 34; img.height = 34;   // 硬属性约束，绝不溢出
  img.src = cv.toDataURL();
  img.style.cssText = 'display:block;width:34px;height:34px;max-width:34px;max-height:34px;' +
    'border-radius:4px;flex-shrink:0;pointer-events:none';
  return img;
}

function buildHotbar() {
  var hbar = document.getElementById('hotbar');
  if (!hbar) return;
  hbar.innerHTML = '';

  var i, id, slot;
  var n = Math.min(7, player.inv.length);
  for (i = 0; i < n; i++) {
    id   = player.inv[i];
    slot = document.createElement('div');
    slot.className = 'slot' + (i === player.slot ? ' on' : '');
    slot.id = 'slot-' + i;
    slot.appendChild(_makeSlotIcon(id));
    var lbl = document.createElement('div');
    lbl.className = 'slot-lbl';
    lbl.textContent = BNAMES[id];
    slot.appendChild(lbl);

    (function (idx, slotEl) {
      slotEl.addEventListener('touchstart', function (e) {
        e.preventDefault();
        var prev = document.getElementById('slot-' + player.slot);
        if (prev) prev.classList.remove('on');
        player.slot = idx;
        slotEl.classList.add('on');
        if (_hasGsap) gsap.fromTo(slotEl, { scale: 0.82 },
          { scale: 1, duration: 0.36, ease: 'back.out(2.4)', overwrite: true });
      }, { passive: false });
    }(i, slot));

    hbar.appendChild(slot);
  }

  // 第 8 位：仓库按钮
  var bagBtn = document.createElement('div');
  bagBtn.className = 'slot bag-btn';
  bagBtn.textContent = '📦';
  bagBtn.addEventListener('touchstart', function (e) {
    e.preventDefault();
    _ensureBag();
    _renderBag();
    toggleBag();
  }, { passive: false });
  bagBtn.addEventListener('click', function () {
    _ensureBag();
    _renderBag();
    toggleBag();
  });
  hbar.appendChild(bagBtn);
}

    btn.style.cssText =
      'flex:1;padding:8px 0;border-radius:8px;border:1px solid rgba(255,255,255,.25);' +
      'color:#fff;font-size:13px;font-family:monospace;cursor:pointer;' +
      'background:' + (cat === _bagCategory ? 'rgba(255,200,80,.38)' : 'rgba(255,255,255,.10)');
    (function (c, b) {
      b.addEventListener('touchstart', function (e) {
        e.preventDefault();
        _setBagCategory(c);
      }, { passive: false });
      b.addEventListener('click', function () { _setBagCategory(c); });
    }(cat, btn));
    tabsEl.appendChild(btn);
  });
  _bagOverlay.appendChild(tabsEl);

  // 滚动容器
  _bagScroll = document.createElement('div');
  _bagScroll.style.cssText =
    'width:100%;max-width:340px;max-height:58vh;overflow-y:auto;' +
    'overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;';

  // 网格
  _bagEl = document.createElement('div');
  _bagEl.id = 'bag';
  _bagEl.style.cssText =
    'display:grid;grid-template-columns:repeat(5,62px);gap:5px;padding:10px;' +
    'background:rgba(0,0,0,.80);border-radius:12px;justify-content:center';

  _bagScroll.appendChild(_bagEl);
  _bagOverlay.appendChild(_bagScroll);
  ui.appendChild(_bagOverlay);
}

// 切换分类并刷新网格
function _setBagCategory(cat) {
  _bagCategory = cat;
  var tabsEl = document.getElementById('bag-tabs');
  if (tabsEl) {
    var btns = tabsEl.querySelectorAll('button');
    for (var bi = 0; bi < btns.length; bi++) {
      btns[bi].style.background = (btns[bi].dataset.cat === cat)
        ? 'rgba(255,200,80,.38)' : 'rgba(255,255,255,.10)';
    }
  }
  _renderBag();
}

function _renderBag() {
  if (!_bagEl) return;
  _bagEl.innerHTML = '';
  var i;
  for (i = 7; i < player.inv.length; i++) {
    (function (idx) {
      var id = player.inv[idx];
      // 按分类过滤
      var isFurni = isFurnitureId(id);
      var isPlant = !!_PLANT[id] || (typeof isCropSeed === 'function' && isCropSeed(id));
      if (_bagCategory === '家具' && !isFurni) return;
      if (_bagCategory === '植物' && !isPlant) return;
      if (_bagCategory === '方块' && (isFurni || isPlant)) return;

      var el = document.createElement('div');
      el.className = 'slot';
      el.appendChild(_makeSlotIcon(id));
      var lbl = document.createElement('div');
      lbl.className = 'slot-lbl';
      lbl.textContent = BNAMES[id];
      el.appendChild(lbl);
      function pick() {
        var tmp = player.inv[player.slot];
        player.inv[player.slot] = player.inv[idx];
        player.inv[idx] = tmp;
        buildHotbar();
        toggleBag();   // 选完自动关闭
        if (typeof _updateHeldItem === 'function') _updateHeldItem(player.slot);
      }
      // 用 touchstart/touchend 判断"点"而非"滑"，不阻止事件以保留滚动
      var _ty = 0;
      el.addEventListener('touchstart', function (e) { _ty = e.touches[0].clientY; }, { passive: true });
      el.addEventListener('touchend', function (e) {
        if (Math.abs(e.changedTouches[0].clientY - _ty) < 12) pick();
      }, { passive: true });
      el.addEventListener('click', pick);
      _bagEl.appendChild(el);
    }(i));
  }
}

function toggleBag() {
  if (!_bagOverlay) return;
  if (typeof bagToggleSound === 'function') bagToggleSound();
  var open = _bagOverlay.style.display !== 'flex';
  if (open) {
    _bagOverlay.style.display = 'flex';
    if (_hasGsap) {
      gsap.fromTo(_bagOverlay, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2, overwrite: true });
      if (_bagScroll) gsap.from(_bagScroll.children, { y: 18, autoAlpha: 0, scale: 0.92,
        duration: 0.32, stagger: 0.025, ease: 'power2.out', overwrite: true });
    }
  } else if (_hasGsap) {
    gsap.to(_bagOverlay, { autoAlpha: 0, duration: 0.18, ease: 'power2.in', overwrite: true,
      onComplete: function () { _bagOverlay.style.display = 'none'; gsap.set(_bagOverlay, { clearProps: 'opacity,visibility' }); } });
  } else {
    _bagOverlay.style.display = 'none';
  }
}

// ─── audio.js ─────────────────────────────────────────────────────────────────
// 音乐 + 音效系统（assets/sounds/，MC 原版音效转 mp3，iOS Safari 不支持 ogg）。
//
// 架构：
//   背景音乐 — HTMLAudioElement 流式循环播放（calm1，C418），不占解码内存
//   音效     — Web Audio API：XHR 预载 + decodeAudioData，
//              播放时随机选变体 + 随机音高（0.85–1.05，MC 同款手感）
//
// iOS 解锁：AudioContext 必须由用户手势激活 → startGame（开始按钮）里调
//   unlockAudio()，恢复 ctx 并启动音乐。
//
// 对外接口：
//   initAudio()        — 创建 ctx 并异步预载所有音效（启动时调，不阻塞）
//   unlockAudio()      — 用户手势内调用：resume ctx + 播放音乐
//   digSound(blockId)  — 破坏/放置音效（按方块材质选 dig 组）
//   stepSound(blockId) — 脚步声（按脚下方块材质选 step 组）
//   splashSound()      — 入水水花

var _actx = null, _sfxBuf = {}, _musicEl = null, _musicIdx = 0;
var _MUSIC_TRACKS = [
  'assets/sounds/music_calm1.mp3',
  'assets/sounds/music_forest.mp3',
  'assets/sounds/music_town.mp3',
];

// 音效组 → 变体文件名（assets/sounds/*.mp3）
var _SFX = {
  dig_grass:    ['dig_grass1', 'dig_grass2'],
  dig_stone:    ['dig_stone1', 'dig_stone2'],
  dig_wood:     ['dig_wood1', 'dig_wood2'],
  dig_sand:     ['dig_sand1', 'dig_sand2'],
  step_grass:   ['step_grass1', 'step_grass2', 'step_grass3'],
  step_stone:   ['step_stone1', 'step_stone2', 'step_stone3'],
  step_wood:    ['step_wood1', 'step_wood2'],
  step_sand:    ['step_sand1', 'step_sand2'],
  splash:       ['random_splash'],
  // 战斗音效（combat_fx.js battleSfx 使用）
  atk_swing:    ['atk_swing1', 'atk_swing2', 'rpg_swing', 'rpg_swing2'],
  atk_clang:    ['atk_clang1', 'atk_clang2'],
  atk_hit:      ['atk_hit1', 'atk_hit2'],
  atk_bow:      ['atk_bow'],
  atk_draw:     ['atk_draw'],
  // 塔攻击 / 敌方单位 / UI
  tower_magic:  ['rpg_magic1', 'rpg_spell'],
  enemy_hurt:   ['enemy_hurt1', 'enemy_hurt2', 'enemy_hurt3', 'fps_enemy_hurt'],
  enemy_death:  ['enemy_death1', 'enemy_death2', 'fps_enemy_destroy'],
  ui_click:     ['rpg_interface1', 'rpg_interface2', 'rpg_interface3'],
  ui_place:     ['ui_placement-a', 'ui_placement-b'],
  ui_remove:    ['ui_removal-a'],
  // 新增音效组
  jump:         ['game_jump'],
  land:         ['game_land'],
  break_extra:  ['game_break'],
  coin:         ['game_coin', 'rpg_coin'],
  slot_change:  ['rpg_sword-unsheathe', 'fps_weapon_change'],
  ui_toggle:    ['ui_toggle'],
  view_rotate:  ['ui_rotate'],
  enemy_atk:    ['fps_enemy_attack'],
  blaster:      ['fps_blaster'],
};

// 方块 ID → 材质名（dig_/step_ 前缀拼接）
var _MAT = [
  null,    // 0  AIR
  'grass', // 1  GRASS
  'grass', // 2  DIRT
  'stone', // 3  STONE
  'sand',  // 4  SAND
  'wood',  // 5  WOOD
  'grass', // 6  LEAVES
  null,    // 7  WATER
  'stone', // 8  RED_WALL
  'stone', // 9  GOLD_ROOF
  'stone', // 10 WHITE_STONE
  'stone', // 11 GRAY_BRICK
  'stone', // 12 GRAY_ROOF
  'wood',  // 13 RED_PILLAR
  'wood',  // 14 PLANKS
  'stone', // 15 COBBLE
  'sand',  // 16 MUD_BRICK
  'stone', // 17 TERRITORY_STONE
  'stone', // 18 ICE
  'grass', // 19 SNOW
  'stone', // 20 IRON_ORE
  'stone', // 21 GLASS
  'stone', // 22 OBSIDIAN
  'sand',  // 23 GRAVEL
  'sand',  // 24 RED_SAND
  'wood',  // 25 TNT
  'wood',  // 26 PUMPKIN
  'stone', // 27 COAL_ORE
  'wood',  // 28 BIRCH_LOG
  'grass', // 29 BIRCH_LEAVES
  'wood',  // 30 SPRUCE_LOG
  'grass', // 31 SPRUCE_LEAVES
  'stone', // 32 BEDROCK
  'grass', // 33 BLUE_WOOL
  'grass', // 34 GREEN_WOOL
  'grass', // 35 RED_WOOL
  'grass', // 36 WHITE_WOOL
  'grass', // 37 YELLOW_WOOL
  'wood',  // 38 BOOKSHELF
  'wood',  // 39 CARVED_PUMPKIN
  'wood',  // 40 CRAFTING_TABLE
  'stone', // 41 DIAMOND_ORE
  'stone', // 42 EMERALD_ORE
  'stone', // 43 GOLD_ORE
  'stone', // 44 REDSTONE_ORE
  'stone', // 45 FURNACE
  null,    // 46 LAVA
  'grass', // 47 MELON
  'stone', // 48 MOSSY_COBBLE
  'grass', // 49 DANDELION
  'grass', // 50 POPPY
  'grass', // 51 OAK_SAPLING
  'grass', // 52 GRASS_PLANT
  'stone', // 53 PACKED_ICE
  'sand',  // 54 SANDSTONE
];

function initAudio() {
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;   // 极旧浏览器：静默降级
  _actx = new AC();

  // 预载所有音效变体
  Object.keys(_SFX).forEach(function (group) {
    _SFX[group].forEach(function (name) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'assets/sounds/' + name + '.mp3', true);
      xhr.responseType = 'arraybuffer';
      xhr.onload = function () {
        if (xhr.status !== 200) return;
        _actx.decodeAudioData(xhr.response, function (buf) {
          _sfxBuf[name] = buf;
        }, function () {});
      };
      xhr.send();
    });
  });

  // 背景音乐：顺序播放 3 首曲目，循环
  function _loadTrack(idx) {
    var el = new Audio(_MUSIC_TRACKS[idx % _MUSIC_TRACKS.length]);
    el.volume = 0.35;
    el.preload = 'auto';
    el.addEventListener('ended', function () {
      _musicIdx = (idx + 1) % _MUSIC_TRACKS.length;
      _musicEl = null;
      _loadTrack(_musicIdx);
      if (_actx) {
        var p = _musicEl.play();
        if (p && p.catch) p.catch(function () {});
      }
    });
    _musicEl = el;
  }
  _loadTrack(0);
}

// 用户手势内调用（iOS 音频解锁）
function unlockAudio() {
  if (_actx && _actx.state === 'suspended') _actx.resume();
  if (_musicEl && _musicEl.paused) {
    var p = _musicEl.play();
    if (p && p.catch) p.catch(function () {});  // 自动播放被拒：静默
  }
}

// 播放一组音效：随机变体 + 随机音高
function _playSfx(group, vol, pitchLo, pitchHi) {
  if (!_actx || _actx.state !== 'running') return;
  var names = _SFX[group];
  if (!names) return;
  var buf = _sfxBuf[names[(Math.random() * names.length) | 0]];
  if (!buf) return;
  var src  = _actx.createBufferSource();
  var gain = _actx.createGain();
  src.buffer = buf;
  src.playbackRate.value = pitchLo + Math.random() * (pitchHi - pitchLo);
  gain.gain.value = vol;
  src.connect(gain);
  gain.connect(_actx.destination);
  src.start(0);
}

function digSound(blockId) {
  var m = _MAT[blockId];
  if (m) _playSfx('dig_' + m, 0.7, 0.85, 1.05);
}

function stepSound(blockId) {
  var m = _MAT[blockId];
  if (m) _playSfx('step_' + m, 0.3, 0.9, 1.1);
}

function splashSound() {
  _playSfx('splash', 0.6, 0.9, 1.1);
}

function placeSound() {
  _playSfx('ui_place', 0.55, 0.9, 1.1);
}

function removeSound(blockId) {
  // 破坏音用材质特定音效；若无材质则用通用移除音
  var m = _MAT[blockId];
  if (m) _playSfx('dig_' + m, 0.7, 0.85, 1.05);
  else _playSfx('ui_remove', 0.6, 0.9, 1.1);
}

function uiClickSound() {
  _playSfx('ui_click', 0.45, 0.95, 1.05);
}

function jumpSound()       { _playSfx('jump',        0.50, 0.95, 1.05); }
function landSound()       { _playSfx('land',        0.70, 0.90, 1.05); }
function killSound()       { _playSfx('coin',        0.60, 0.90, 1.05); }
function slotChangeSound() { _playSfx('slot_change', 0.45, 0.90, 1.10); }
function bagToggleSound()  { _playSfx('ui_toggle',   0.45, 0.95, 1.05); }


// ═══ src/models.js ═══
// ─── models.js ────────────────────────────────────────────────────────────────
// GLTF 模型加载：玩家角色（Steve）+ NPC（僵尸/狐狸/马/鹦鹉）。
//
// 模型来源（提交在 assets/models/）：
//   player.glb — Steve，hexianWeb/Third-Person-MC（MIT），
//                24 个动画：idle/forward/running_forward/jump/falling/出拳/潜行等
//   zombie.glb — 僵尸，同上（MIT），同套动画体系
//   fox.glb    — Fox，PixelMannen（CC0，Khronos 官方样例）
//   horse.glb  — Horse，three.js 示例（mirada/ro.me）
//   parrot.glb — Parrot，同上
//
// 加载策略：异步、不阻塞游戏启动。
//   玩家先用盒子占位（game.js 构建），player.glb 加载完成后热替换。
//   NPC 在各自模型就绪后才生成。
//
// 对外接口：
//   loadPlayerModel()  — 异步加载玩家模型
//   playerAnim(state)  — 切换玩家动画状态：'idle' | 'walk' | 'run' | 'jump' | 'fall'
//   playerMixer        — 玩家动画混合器（tick 中 update）
//   spawnNPCs() / updateNPCs(dt) — NPC 生成与 AI 更新

var gltfLoader = new THREE.GLTFLoader();

// ── 玩家模型 ──────────────────────────────────────────────────────────────────
var playerMixer = null;   // null = 模型未就绪
var _pActions   = {};     // 动画名(原始) → AnimationAction
var _pCurrent   = '';

// 状态 → 可能的动画名（不同模型命名不同，按序取第一个存在的）
var _ANIM_ALIAS = {
  idle: ['idle', 'Idle'],
  walk: ['forward', 'walk', 'Walking', 'Walk'],
  run:  ['running_forward', 'run', 'Running', 'forward', 'walk'],
  jump: ['jump', 'Jump'],
  fall: ['falling', 'jump', 'Jump']
};

function loadPlayerModel() {
  gltfLoader.load('assets/models/player.glb', function (gltf) {
    var model = gltf.scene;

    // 归一化身高，脚底对齐 y=0
    var bbox = new THREE.Box3().setFromObject(model);
    var s = (PH * 0.95) / (bbox.max.y - bbox.min.y);
    model.scale.set(s, s, s);
    model.position.y = -bbox.min.y * s;
    // 模型默认朝 +Z，游戏前进方向为 -Z → 转 180°
    model.rotation.y = Math.PI;

    while (playerGroup.children.length) playerGroup.remove(playerGroup.children[0]);
    playerGroup.add(model);

    playerMixer = new THREE.AnimationMixer(model);
    var i;
    for (i = 0; i < gltf.animations.length; i++) {
      _pActions[gltf.animations[i].name] = playerMixer.clipAction(gltf.animations[i]);
    }
    playerAnim('idle');
  }, undefined, function () { /* 加载失败：保留盒子占位 */ });
}

// 切换玩家动画状态（同状态重复调用为空操作）
function playerAnim(state) {
  if (!playerMixer) return;
  var names = _ANIM_ALIAS[state] || [state], name = null, i;
  for (i = 0; i < names.length; i++) {
    if (_pActions[names[i]]) { name = names[i]; break; }
  }
  if (!name || _pCurrent === name) return;
  var prev = _pActions[_pCurrent];
  if (prev) prev.fadeOut(0.2);
  _pActions[name].reset().fadeIn(0.2).play();
  _pCurrent = name;
}

// ── NPC ───────────────────────────────────────────────────────────────────────
// 地面 NPC（狐狸/马）：漫游 AI（直走 + 随机转向 + 贴地 + 遇水/悬崖掉头）
// 飞行 NPC（鹦鹉）：绕出生点圆周飞行 + 上下浮动
var npcs     = [];  // 地面：{ group, mixer, x, y, z, yaw, speed, timer }
var flyNpcs  = [];  // 飞行：{ group, mixer, cx, cz, radius, baseY, angSpd, ang, phase }

// 从高空往下找第一个实心方块顶面的 y
function _groundY(wx, wz) {
  var bx = Math.floor(wx), bz = Math.floor(wz), y, id;
  for (y = CHUNK_H - 1; y >= 0; y--) {
    id = getBlock(bx, y, bz);
    if (id !== AIR && id !== WATER) return y + 1;
  }
  return SEA + 2;
}

// 通用：缩放到目标高度、脚底对齐、转向 -Z
// 两段测量：先按原始包围盒求缩放，应用缩放/旋转并刷新世界矩阵后，
// 再量一次缩放后的世界包围盒把脚底精确归零——单段测量在 GLTF 嵌套骨架/
// 世界矩阵未刷新时会得到偏低的 min.y，导致模型整体被抬高（悬空）。
function _prepModel(model, targetH) {
  model.updateMatrixWorld(true);
  var bbox = new THREE.Box3().setFromObject(model);
  var s = targetH / (bbox.max.y - bbox.min.y);
  model.scale.set(s, s, s);
  model.rotation.y = Math.PI;
  model.position.y = 0;
  model.updateMatrixWorld(true);
  bbox = new THREE.Box3().setFromObject(model);   // 缩放后世界空间脚底
  model.position.y = -bbox.min.y;                  // 脚底精确对齐 group 原点
  return model;
}

// 取第一个动画（这些动物模型都只有 1-3 个剪辑）
function _firstClip(anims, prefer) {
  var i;
  if (prefer) {
    for (i = 0; i < anims.length; i++) {
      if (anims[i].name === prefer) return anims[i];
    }
  }
  return anims.length ? anims[0] : null;
}

function _addGroundNPC(model, clip, targetH, speed) {
  _prepModel(model, targetH);
  var group = new THREE.Group();
  group.add(model);
  scene.add(group);

  var mixer = null;
  if (clip) {
    mixer = new THREE.AnimationMixer(model);
    mixer.clipAction(clip).play();
  }

  var ang  = Math.random() * Math.PI * 2;
  var dist = 8 + Math.random() * 10;
  var nx = player.x + Math.sin(ang) * dist;
  var nz = player.z + Math.cos(ang) * dist;

  npcs.push({
    group: group, mixer: mixer,
    x: nx, y: _groundY(nx, nz), z: nz,
    yaw: Math.random() * Math.PI * 2,
    speed: speed,
    timer: 2 + Math.random() * 3
  });
}

function _addFlyNPC(model, clip, targetH) {
  _prepModel(model, targetH);
  var group = new THREE.Group();
  group.add(model);
  scene.add(group);

  var mixer = null;
  if (clip) {
    mixer = new THREE.AnimationMixer(model);
    mixer.clipAction(clip).play();
  }

  flyNpcs.push({
    group: group, mixer: mixer,
    cx: player.x + (Math.random() - 0.5) * 20,
    cz: player.z + (Math.random() - 0.5) * 20,
    radius: 6 + Math.random() * 6,
    baseY: _groundY(player.x, player.z) + 8 + Math.random() * 6,
    angSpd: 0.4 + Math.random() * 0.3,
    ang: Math.random() * Math.PI * 2,
    phase: Math.random() * Math.PI * 2
  });
}

function spawnNPCs() {
  // 僵尸 ×2（缓慢徘徊，MC 标准身高 1.8）
  gltfLoader.load('assets/models/zombie.glb', function (g) {
    _addGroundNPC(g.scene, _firstClip(g.animations, 'forward'), 1.8, 0.7);
    gltfLoader.load('assets/models/zombie.glb', function (g2) {
      _addGroundNPC(g2.scene, _firstClip(g2.animations, 'forward'), 1.8, 0.8);
    });
  }, undefined, function () {});

  // 狐狸 ×2
  gltfLoader.load('assets/models/fox.glb', function (g) {
    _addGroundNPC(g.scene, _firstClip(g.animations, 'Walk'), 0.9, 1.5);
    gltfLoader.load('assets/models/fox.glb', function (g2) {
      _addGroundNPC(g2.scene, _firstClip(g2.animations, 'Walk'), 0.9, 1.8);
    });
  }, undefined, function () {});

  // 马 ×2
  gltfLoader.load('assets/models/horse.glb', function (g) {
    _addGroundNPC(g.scene, _firstClip(g.animations), 1.6, 2.2);
    gltfLoader.load('assets/models/horse.glb', function (g2) {
      _addGroundNPC(g2.scene, _firstClip(g2.animations), 1.6, 2.0);
    });
  }, undefined, function () {});

  // 鹦鹉 ×3（飞行）
  gltfLoader.load('assets/models/parrot.glb', function (g) {
    _addFlyNPC(g.scene, _firstClip(g.animations), 0.5);
    gltfLoader.load('assets/models/parrot.glb', function (g2) {
      _addFlyNPC(g2.scene, _firstClip(g2.animations), 0.5);
      gltfLoader.load('assets/models/parrot.glb', function (g3) {
        _addFlyNPC(g3.scene, _firstClip(g3.animations), 0.5);
      });
    });
  }, undefined, function () {});
}

function updateNPCs(dt) {
  var i, n, nx, nz, gy, tx, tz;

  // 地面漫游
  for (i = 0; i < npcs.length; i++) {
    n = npcs[i];

    n.timer -= dt;
    if (n.timer <= 0) {
      n.yaw  += (Math.random() - 0.5) * Math.PI;
      n.timer = 2 + Math.random() * 4;
    }

    // 前进方向 -Z（与玩家一致）
    nx = n.x - Math.sin(n.yaw) * n.speed * dt;
    nz = n.z - Math.cos(n.yaw) * n.speed * dt;
    gy = _groundY(nx, nz);

    // 落差超过 2 格或踩水 → 掉头
    if (Math.abs(gy - n.y) > 2 ||
        getBlock(Math.floor(nx), Math.floor(gy) - 1, Math.floor(nz)) === WATER) {
      n.yaw += Math.PI;
    } else {
      n.x = nx; n.z = nz;
      n.y += (gy - n.y) * Math.min(1, 10 * dt);
    }

    n.group.position.set(n.x, n.y, n.z);
    n.group.rotation.y = n.yaw;
    if (n.mixer) n.mixer.update(dt);
  }

  // 圆周飞行
  for (i = 0; i < flyNpcs.length; i++) {
    n = flyNpcs[i];
    n.ang += n.angSpd * dt;
    tx = n.cx + Math.cos(n.ang) * n.radius;
    tz = n.cz + Math.sin(n.ang) * n.radius;
    n.group.position.set(
      tx,
      n.baseY + Math.sin(n.ang * 2 + n.phase) * 1.5,  // 上下浮动
      tz
    );
    // 面向切线方向：速度 = (-sin(ang), cos(ang))，
    // 前进约定 -Z → (-sin(yaw), -cos(yaw))，解得 yaw = π - ang
    n.group.rotation.y = Math.PI - n.ang;
    if (n.mixer) n.mixer.update(dt);
  }
}
