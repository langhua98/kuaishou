<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>B站搜索</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  background: #f2f2f7; min-height: 100vh; color: #1c1c1e;
}
.overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.45); display: flex; align-items: flex-end;
}
.sheet {
  background: #fff; border-radius: 20px 20px 0 0;
  padding: 24px 20px 40px; width: 100%;
}
.sheet h2 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
.sheet p  { font-size: 13px; color: #6c6c70; line-height: 1.6; margin-bottom: 16px; }
.sheet input {
  width: 100%; padding: 13px 14px;
  border: 1.5px solid #d1d1d6; border-radius: 12px;
  font-size: 15px; outline: none; margin-bottom: 12px;
}
.sheet input:focus { border-color: #fb7299; }
.sheet .save-btn {
  width: 100%; padding: 14px; background: #fb7299; color: #fff;
  border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
}
header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid #e5e5ea; padding: 12px 14px 10px;
}
.header-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.logo { font-size: 16px; font-weight: 700; flex: 1; color: #fb7299; }
.cfg-btn { background: none; border: none; font-size: 22px; line-height: 1; cursor: pointer; padding: 2px; }
.search-row { display: flex; gap: 8px; }
.search-row input {
  flex: 1; padding: 10px 16px; border: 1.5px solid #d1d1d6;
  border-radius: 24px; font-size: 15px; outline: none; background: #f2f2f7;
}
.search-row input:focus { border-color: #fb7299; background: #fff; }
.search-row button {
  padding: 10px 18px; background: #fb7299; color: #fff;
  border: none; border-radius: 24px; font-size: 15px; font-weight: 600;
  cursor: pointer; white-space: nowrap;
}
.search-row button:disabled { opacity: .45; }
.status { padding: 10px 14px; font-size: 13px; color: #8e8e93; min-height: 36px; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 10px 30px; }
.card { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.card img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; background: #eee; }
.card .info { padding: 8px 10px 10px; }
.card .cap {
  font-size: 13px; line-height: 1.4; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.card .meta { font-size: 11px; color: #aeaeb2; margin-top: 4px; }
.card .open { display: inline-block; margin-top: 6px; font-size: 12px; color: #fb7299; text-decoration: none; }
.spinner {
  display: inline-block; width: 16px; height: 16px;
  border: 2px solid #e5e5ea; border-top-color: #fb7299;
  border-radius: 50%; animation: spin .7s linear infinite;
  vertical-align: middle; margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="overlay" id="overlay" style="display:none">
  <div class="sheet">
    <h2>设置后端地址</h2>
    <p>填入你在 Railway 部署好的服务地址。<br>格式：<code>https://xxx.railway.app</code>（结尾不加斜杠）</p>
    <input id="urlInput" type="text" inputmode="url" placeholder="https://your-app.railway.app" autocapitalize="none" autocorrect="off" spellcheck="false">
    <button class="save-btn" onclick="saveUrl()">保存</button>
  </div>
</div>

<header>
  <div class="header-row">
    <span class="logo">📺 B站搜索</span>
    <button class="cfg-btn" onclick="openCfg()" title="设置后端地址">⚙️</button>
  </div>
  <div class="search-row">
    <input id="kw" type="search" placeholder="搜索B站视频…" enterkeyhint="search">
    <button id="btn" onclick="doSearch()">搜索</button>
  </div>
</header>

<div class="status" id="status">首次使用请点右上角 ⚙️ 配置后端地址。无需登录，直接搜索。</div>
<div class="grid" id="grid"></div>

<script>
const KEY = "ks_api";
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function getUrl() { return localStorage.getItem(KEY) || ""; }

function saveUrl() {
  let v = document.getElementById("urlInput").value.trim().replace(/\/+$/, "");
  if (!v) return;
  if (!/^https?:\/\//i.test(v)) v = "https://" + v;
  try { new URL(v); } catch (_) {
    alert("地址格式不对，例如：\nhttps://xxxx.railway.app");
    return;
  }
  localStorage.setItem(KEY, v);
  document.getElementById("overlay").style.display = "none";
  document.getElementById("status").textContent = "后端地址已保存：" + v;
}

function openCfg() {
  document.getElementById("urlInput").value = getUrl();
  document.getElementById("overlay").style.display = "flex";
}

document.getElementById("overlay").addEventListener("click", function(e) {
  if (e.target === this) this.style.display = "none";
});

document.addEventListener("DOMContentLoaded", () => {
  if (!getUrl()) openCfg();
  document.getElementById("kw").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); doSearch(); }
  });
});

async function doSearch() {
  const kw   = document.getElementById("kw").value.trim();
  const base = getUrl();
  if (!kw)   return;
  if (!base) { openCfg(); return; }

  const btn    = document.getElementById("btn");
  const status = document.getElementById("status");
  const grid   = document.getElementById("grid");

  btn.disabled = true;
  grid.innerHTML = "";
  status.innerHTML = '<span class="spinner"></span>搜索中…';

  try {
    const res  = await fetch(`${base}/api/search?keyword=${encodeURIComponent(kw)}`);
    const data = await res.json();

    if (!data.ok) {
      status.textContent = "出错：" + (data.error || data.detail || JSON.stringify(data));
      return;
    }
    status.textContent = data.count > 0 ? `找到 ${data.count} 条结果` : "未找到结果";

    for (const v of data.results) {
      const card = document.createElement("div");
      card.className = "card";
      const cover = v.cover
        ? `<img src="${esc(v.cover)}" referrerpolicy="no-referrer" loading="lazy">`
        : `<div style="aspect-ratio:16/10;background:#eee"></div>`;
      const playNum = typeof v.play === "number" ? v.play.toLocaleString() + " 播放" : "";
      card.innerHTML = `${cover}
        <div class="info">
          <div class="cap">${esc(v.caption) || "(无标题)"}</div>
          <div class="meta">${esc(v.author || "")}${playNum ? " · " + playNum : ""}${v.duration ? " · " + esc(v.duration) : ""}</div>
          ${v.pageUrl ? `<a class="open" href="${esc(v.pageUrl)}" target="_blank">去B站看 ↗</a>` : ""}
        </div>`;
      grid.appendChild(card);
    }
  } catch (e) {
    const saved = getUrl();
    status.innerHTML = `连接失败：${e.message}<br><small>当前地址：${saved || "未设置"} — 点 ⚙️ 重新确认</small>`;
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
